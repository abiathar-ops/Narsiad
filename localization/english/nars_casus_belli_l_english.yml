 narsokratia_onslaught_victory: "[attacker.GetShortUIName|U] takes all of [defender.GetShortUINamePossessive] lands, as well as titles belonging to [defender.GetHerHim] and [vassalize|E] [defender.GetHerHis] former vassals. The [Glossary( 'Narsokratía', 'NARSOKRATIA_GLOSS' )] grows!"
 
