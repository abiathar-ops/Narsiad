 selian_defiance_war_invalidated_message: "The coalition against the [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] has collapsed, and the war is invalidated."

 # Victory (Attackers Win / Selian Defender Loses)
 selian_defiance_loses_defender: "The world's defiance has crushed you. Your ambition to restore the [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] ends in ruin as your vassals scatter and your realm is shattered."
