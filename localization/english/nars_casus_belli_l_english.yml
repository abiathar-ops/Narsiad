 selian_defiance_loses_other: "[attacker.GetShortUIName|U] crushes the ambitions of [defender.GetShortUIName]. The threat of the [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] is ended."

 # Defeat (Attackers Lose / Selian Defender Wins)
 selian_defiance_wins_defender: "You have defied the world! You shatter the coalition of your neighbors, securing the emergence of the [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] and your legacy as a hegemon potentate."
