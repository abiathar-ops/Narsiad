l_english: 
 munitions_research_scheme: "Harness Gunpowder"
 munitions_research_scheme_desc: "I seek to arm my forces with that most sophisticated and terrifying of weapons, gunpowder."
 munitions_research_scheme_desc_general: "Great stores of black powder must be amassed; our armies must be armed with the thunderous arquebus, emboldening them with a rain of lead cartridges!"
 munitions_research_scheme_SUCCESS_DESC: "You will unlock the #V Mástiges#! [men_at_arms|E] regiment and apply the [GetModifier('munitions_research_modifier').GetNameWithTooltip] to [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] for #high 30 years#!."
 munitions_research_scheme_action: "Harness Gunpowder in"
 munitions_research_scheme_invalidated_title: "@scheme_icon! Harness Gunpowder Ends"

 raise_warhost_scheme: "Raise Selian Host"
 raise_warhost_scheme_desc: "We must meticulously plan, supply, and train a formidable new host. If our preparations fall short, we will simply redouble our efforts until the army is ready."

 recruit_nars_scheme: "Muster $game_concept_selianes$"
 recruit_nars_scheme_desc: "You attempt to recruit and muster $game_concept_selianes$ through diplomacy in hopes of convincing them to join your cause."
 recruit_nars_scheme_desc_general: "The #v $recruit_nars_scheme$#! Scheme is a [personal_scheme|E] in which you attempt to recruit and muster $game_concept_selianes$ through diplomacy in hopes of convincing them to join your cause.\n\n#flavor "Not even gods fight against necessity." - $Alnars$, $anduril_name$#!"
 recruit_nars_scheme_SUCCESS_DESC: "You recruit new $game_concept_selianes$ through diplomacy to your cause"
 recruit_nars_scheme_action: "Muster $game_concept_selianes$"
 recruit_nars_scheme_invalidated_title: "@scheme_icon! Muster $game_concept_selianes$ Ends"

 piously_devote_scheme: "Pious Devotion"
 piously_devote_scheme_action: "Piously Devote"
 piously_devote_scheme_desc: "I will piously devote myself in the nearby temples, learning new passages as I spend time gleaning timeless wisdom."
 piously_devote_scheme_desc_general: "#v $piously_devote_scheme$#! is a [personal_scheme|E] in which you attempt to gain [piety|E], [skill|E], and other [traits|E] through piously devoting yourself in service for the [gods|E] of tradition.\n\n#flavor "Not even gods fight against necessity." - $Alnars$, $anduril_name$#!"
 piously_devote_scheme_SCHEME_SUCCESS_DESC: "You improve your skills, learning, or gain a trait and its experience"
 SCHEME_OWNER_CYNICAL: "You are [GetTrait('cynical').GetName( owner )]: $VALUE|+0=$"
 SCHEME_OWNER_ZEALOUS: "You are [GetTrait('zealous').GetName( owner )]: $VALUE|+0=$"

 mend_narsil_scheme: "Mend Narsíl"
 mend_narsil_scheme_desc: "You attempt to mend the shattered shards of [narsil|E] anew in hopes of solidifying your legitimacy among the $game_concept_selianes$."
 mend_narsil_scheme_desc_general: "The #v $narsil_shards_name$#! refuses easy binding; only through ritual, coin, and craft may it be made whole once more.\n\n#flavor "Not even gods fight against necessity." - $Alnars$, $anduril_name$#!"
 mend_narsil_scheme_SUCCESS_DESC: "You will reforge #V [narsil|E]#! and claim it as an [artifact|E]!"
 mend_narsil_scheme_action: "Mend Narsíl"
 mend_narsil_scheme_invalidated_title: "@scheme_icon! Mend Narsíl Ends"

 produce_amphora_scheme: "Produce Amphora"
 produce_amphora_scheme_desc: "You attempt to create with your own hands, your very own personally made #v Amphora#! [artifact|E] for you to use or sell."
 produce_amphora_scheme_desc_general: "You attempt to create with your own hands, your very own [Glossary( 'Amphoreús', 'AMPHOREUS_GLOSS' )] [artifact|E] for you to use or sell.\n\n#flavor "Let one receptacle enclose our bones: an amphora that thy queenly mother gave thee." - $Alnars$, $anduril_name$#!"
 produce_amphora_scheme_SUCCESS_DESC: "You will create an #V Amphora#! and claim it as an [artifact|E]!"
 produce_amphora_scheme_action: "Produce Amphora"
 produce_amphora_scheme_invalidated_title: "@scheme_icon! Produce Amphora Ends"

