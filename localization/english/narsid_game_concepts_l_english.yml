l_english:
  #Narsid Flavours
 game_concept_narsid: "Narsid"
 game_concept_narsids: "Narsids"
 game_concept_menofnars: "Men of Narsēs"
 game_concept_narsids_desc: "The Narsids, also known as 'Nāresids' or 'Men of Narsēs', are a long thought to be extinct people. They are blessed with inhuman beauty and grace the same way they are also known for their chauvinistic pride and arrogant hubris."

 game_concept_narsokratia: "Nārsokratía"
 game_concept_narsokratia_desc: "The Nārsokratía, or the Rule of Narsēs, are an ancient and enduring political system that has defined the governance of the [narsid|E] [realm|E] for centuries. Rooted in the principles of aristocratic rule and divine right, the Nārsokratía is characterized by a hierarchical structure where power is concentrated in the hands of a select few, justified by their lineage and perceived connection to the divine. This system has allowed the [narsids|E] to maintain a stable and prosperous [realm|E], albeit one of hubristic exclusivity and chauvinism."
 game_concept_narsidrealm: "Narsid Realm"

 game_concept_narses: "Narsēs"
 game_concept_narses_desc: "Narsēs, the God worshipped by the [orphic|E], is often depicted as the embodiment of fated fortune, embodying the ideals of unstoppable [faith|E] in ambition and its fickle endings. Narsēs is revered as the predominant deity of the [menofnars|E] and his teachings through the $Prophētēs$ form the foundation of their [tradition|E] and [cultural|E] values."

 game_concept_naresid: "Nāresid"
 game_concept_orphists: "Orphists"
 game_concept_orphic: "Orphists"
 game_concept_naresid_desc: "Narēsids dedicate their [faith|E] to [narses|E], the [narsid|E] deity of fated fortune and progress. [head_of_faith] of this [religion|E] oftentimes are called the $Prophētēs$ and their scriptures form the basis of [narsid|E] [culture|E] and [traditions|E]"

 game_concept_narsil: "Narsíl"
 game_concept_narsil_desc: "Narsíl is an heirloom [artifact|E] of the [dynasty|E] of [narsid|E] [hegemons|E]. Shattered during one of the many [civil_wars|E] among the [narsids|E] during the dusk of their [narsokratia|E], its fragments now lay waiting for the day it is mended once more to rally the fragmented [menofnars|E]."

 #Narsid MAA
 game_concept_hoplites: "Hoplîtes"
 game_concept_hoplite: "Hoplîte"
 game_concept_hoplites_desc: "The Hoplîtes were citizen-soldiers of Ancient Narsid city-states. Hoplîte soldiers were primarily represented by free citizens who were able to afford armaments. Some Narsid states of antiquity maintained a small elite professional unit, known as the [optimates|E]."

 game_concept_optimates: "Optimátēs"
 game_concept_optimates_desc: "The Optimátēs were an elite class of professional soldiers in Ancient Narsid city-states. They were typically recruited from the wealthier classees or from distinguised [hoplites|E] and were known for their exceptional iron discipline."

 game_concept_mastiges: "Mástiges" 
 game_concept_mastiges_desc: "The Mástiges are a new innovation of the new Narsid revival. Armed with newly discovered and utilized black powders, the Mástiges are the penultimate [hoplites|E] of the current era, feared and formidable force on the battlefield and known for their ruthlessness and effectiveness in combat."


