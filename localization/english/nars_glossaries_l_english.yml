l_english: 
 POLITEION_GLOSS: "#bold 'Politeíon'#! means '(A Temple) of All the Gods'."
 ALNARS_GLOSS: "#bold '$Alnars$'#! is the first Selian who dared to venture back into the world. Through charisma, he forged the isolationist exiles of his people into a unified band of mercenaries, paving the way to the restoration of the $game_concept_selianes$."
 NARSOKRATIA_GLOSS: "#bold 'Narsokratía'#! means 'Rule of Narsēs'."
 POLIMETIS_GLOSS: "#bold 'Polimêtis'#! are $game_concept_selianes$ widely known for their pearly contributions to scholarly and martial pursuits. In an age much archaic, they served as the backbone of the state."
 MASTIGES_GLOSS: "#bold 'Mástigoî' #! are armed with newly discovered and utilized gunpowders, they are a new class of [Glossary( 'Optímātoî', 'OPTIMATOI_GLOSS' )] now fielded with new weaponries."
 OPTIMATOI_GLOSS: "The #bold 'Optímātoî' #! are citizen-soldiers of the $game_concept_selianes$ realm. These steadfast men-at-arms are armed with compliments of heavy armours in long pike formations."
 EPHEBOI_GLOSS: "#bold Epheboi#! were male adolescents in ancient Greece."
 KUNOPS_GLOSS: "#bold 'Kýnōps'#! is an egregious insult meaning "dog-face" formed from kuno-, “dog” and ṓps, “eye, face”."
 TRYPHE_GLOSS: "#bold 'Tryphé'#! is a concept referring to luxury or extravagance. "
 O_ANDRES_GLOSS: "'Oh, men!'"
 MAGOULA_GLOSS: "#bold 'Magoula'#! is a term used to describe a type of prehistoric settlement mound found in Greece."
 EUSEBEIA_GLOSS:0 "#bold 'Eusebeia'#! refers to deep reverence, piety, and the strict fulfillment of one's duty to the gods."
 SOPHROSYNE_GLOSS:0 "#bold 'Sophrosyne'#! represents soundness of mind, moderation, and dignified self-control."
 KOINONIA_GLOSS:0 "#bold 'Koinonia'#! refers to a fellowship or community built on shared goals and kinship."
 OIKOS_GLOSS:0 "#bold 'Oikos'#! represents the fundamental social unit of the household, expanding into the wider family line."
 POLIS_GLOSS:0 "#bold 'Polis'#! refers to the [city-state|E] and its collective body of enfranchised citizens."
 EUNOMIA_GLOSS:0 "#bold 'Eunomia'#! represents good order, righteous governance, and the rule of just laws."
 BASILEUS_GLOSS:0 "#bold 'Basileús'#! refers to a supreme sovereign or monarch holding ultimate authority."
 AUTOKRATEIA_GLOSS:0 "#bold 'Autokrateia'#! represents the exercise of absolute, undivided power and self-governance by a single ruler."
 HEGEMONIA_GLOSS:0 "#bold 'Hēgemonia'#! refers to the political and military dominance of one sovereign state over others within a league or confederation."
 SYMMACHIA_GLOSS:0 "#bold 'Symmachia'#! represents a binding offensive and defensive military alliance forged between Greek states."
 ALALE_GLOSS: "#bold 'Alalē!'#! is an ancient war cry used by soldiers as they charged into battle. It was believed to evoke the spirit of battle and invoke the protection of war deities."
 ELEUTHERIA_GLOSS:0 "#bold 'Eleutheria'#! refers to political liberty, independence, and freedom from external tyranny or subjugation."
 ISONOMIA_GLOSS:0 "#bold 'Isonomia'#! represents the equality of political rights, governance, and law among free citizens and states."
 ANANKE_GLOSS:0 "#bold 'Ananke'#! refers to force, constraint, or unavoidable necessity."
 HOMONOIA_GLOSS:0 "#bold 'Homonoia'#! refers to unity of mind, concord, and harmonious political union."
 MISTHIOS_GLOSS:0 "#bold 'Misthophóroi'#! is a term originally applied to someone who worked in return for salaries. This included labourers but the word was very soon applied to hired mercenaries."
 KLEOS_GLOSS:0 "#bold 'Kléos'#! refers to the glory, renown, and fame earned through heroic deeds and mythical triumphs. In antiquity, achieving it ensured that a character's name and deeds would survive physical death, immortalized forever in songs and poetry."
 AMPHOREUS_GLOSS:0 "#bold 'Amphoreús'#! or an amphora refers to a two-handled ceramic jar with a narrow neck, serving as the standard container for storing and transporting commodities. In earlier periods, these jars were used as grave markers, while some amphorae were used as containers for cremations. Ornate amphorae filled with sacred oil were also awarded as prestigious prizes to victors in contests."
 KOSMOS_GLOSS:0 "#bold 'Kosmos'#! can mean many things at the same time. While the most popular interpretation, derived from Plato, refers to the world (which is the literal meaning of the word), Aristotle believed that this world was eternal and had neither beginning nor end. Here, however, our version of #italic kosmos#! refers to an apt and harmonious arrangement constructed from individual parts."
 OÍMOI_GLOSS:0 "#bold 'Oímoi'#! is an ancient Greek exclamation of intense grief, shock, or physical pain."
 AKROPOLIS_GLOSS:0 "#bold 'Akrópolis'#! or plurally 'Akropóleis' are the high, fortified citadel or upper part of an ancient city. They are built on high, rocky hills with steep sides to protect citizens during attacks thus functioning as bastions of protection."
 MEITHIOS_GLOSS: "#bold 'Meíthiōs'#! are a $game_concept_selianes$ term denoting people who travel to attempt a proliferation of a religion or creed, specifically of one exalting the $game_concept_politeion$."