 nars_special_doctrine_descriptive_name: "$nars_special_doctrine_name$"
 nars_special_doctrine_desc:  "We are heirs to an antiquate glory, once-forgotten now risen—the true hegemons of the world."

 nars_special_doctrine_2_name: "Philopolitēs"
 nars_special_doctrine_2_no_actor: "Scholar of Yore"
 nars_special_doctrine_2_descriptive_name: "$nars_special_doctrine_2_name$"
 nars_special_doctrine_2_desc:  "We are scholars of a bygone era, witness to the long history—ageless scions of yore."

