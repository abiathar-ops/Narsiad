l_english:
  #Nikean Flavours
 game_concept_nikean: "Nikean"
 game_concept_nikean_adj: "Nikean's"
 game_concept_nikeans: "Nikeans"
 game_concept_nikeans_adj: "Nikeans'"
 game_concept_nikeis: "Nikēís"
 game_concept_nikeis_adj: "Nikēís'"
 game_concept_nikeans_desc: "The [Glossary( 'Nikēís', 'NIKEAN_GLOSS' )] are a long thought to be extinct [culture|E]. Despite having a [tradition|E] of [innovation|E], they are notorious for their chauvinistic pride and hubris. Nikean [orphists|E] are known for their contributions to [learning|E] and [martial|E] pursuits, writing records of their findings with [narsic|E]. The Nikēís are famed for their inhuman [attraction|E] and beauty."

 game_concept_narsic: "Old Nikean"
 game_concept_narsic_short: "O.N."
 game_concept_narsic_desc: "Old [nikean|E] was originally the language of the ancient [nikeis|E] of old [narsokratia|E]. The [language|E], especially in its classical form, is rich in idioms and proverbs, reflecting the [nikean|E] values of [martial|E] ambition and the pursuit of [learning|E]."

 game_concept_polymetis: "Polymêtis"
 game_concept_polymetis_desc: "The [Glossary( 'Polymêtis', 'POLYMETIS_GLOSS' )] are [nikeans|E] who are known for their pearly contributions to [learning|E] pursuits and [martial|E] [innovation|E]. They commonly serve as [courtiers|E], [councillors|E] and [commanders|E] to the [realm|e]."
 game_concept_sophist: "Polymêtis"
 game_concept_sophists: "Polymêtides"

 game_concept_narsokratia: "Narsokratía"
 game_concept_narsokratia_i: "@government_type_narsokratia!"
 game_concept_narsokratia_possessive: "Narsokratía's"
 game_concept_narsokratia_government: "Narsokratía Government"
 game_concept_narsokratia_governments: "Narsokratía Governments"
 game_concept_nikeanrealm: "Nikean Realm"
 game_concept_narsokratia_desc: "The [Glossary( 'Narsokratía', 'NARSOKRATIA_GLOSS' )] is an ancient [hegemony|E] that has defined the culture of the [nikean|E] [realm|E] for centuries. The [realm|E] is concentrated in the hands of a singular [ruler|E] that maintains a stable [region|E] through appointed [governors|E] to manage and preside over land over its [region|E] for them — essentially a precursor to an [GetGovernment('administrative_government').GetName] [government_form|E] in yore."

 game_concept_narses: "Narsēs"
 game_concept_narses_desc: "Narsēs, the ancient [nikeis|E] personification of [innovation|E], is worshipped by [orphists|E]. Embodying the ideals of fanatical [faith|E] in ambitious [learning|E], Narsēs is revered as the predominant deity of the [nikeis|E] [panteion|E] by its adherents."

 game_concept_phokas: "Phōkās"
 game_concept_phokas_desc: "Phōkās, the ancient [nikeis|E] personification of [stewardship|E] and levity, is worshipped by [orphists|E]. Although not as prominent as [narses|E], Phōkās is revered as a major deity of the [nikeis|E] [panteion|E] by its adherents."

 game_concept_enuo: "Enuō"
 game_concept_enuo_desc: "Enuō, the ancient [nikeis|E] personification of [war|E] and [fertility|E], is worshipped by [orphists|E]. Although not as prominent as [narses|E], Enuō is revered as a major deity of the [nikeis|E] [panteion|E] by its adherents."

 game_concept_orphists: "Orphists"
 game_concept_orphic: "Orphic"
 game_concept_orphic_adj: "Orphic's"
 game_concept_nikean_faith: "Nikean Faith"
 game_concept_orphists_desc: "Orphists are followers of the [nikeis_adj|E] [panteion|E], the conglomeration of [nikean|E] deities of varying aspects. The [head_of_faith|E] of this [religion|E] oftentimes are called the $Prophētēs$ and their scriptures form the basis of [nikean|E] [traditions|E] and by proxy, their [narsokratia|E]."

 game_concept_panteion: "Orphic Panteíon"
 game_concept_panteion_possessive: "Orphic Panteíon's"
 game_concept_panteion_desc: "The [orphic|E] [Glossary( 'Panteíon', 'PANTEION_GLOSS' )] is the conglomeration of all deities of the [nikean_faith|E]. They serve as a central pillar of the [nikeis|E], each embodying different [traits|E] of life, nature, and human experience. Most of the [nikeis|E] worship [narses|E], the personification of [learning|E] and [innovation|E]. However, the [nikeis|E] also revere other deities such as [phokas|E] and [enuo|E]."

 game_concept_narsil: "Narsíl"
 game_concept_narsil_desc: "Narsíl is an heirloom [artifact|E] of the [nikean|E] [hegemons|E]. Shattered during one of the many [civil_wars|E] among the [nikeans|E] during the dusk of their [narsokratia|E], Narsíl's shards have been passed down until it was possessed by [alnars|E]."

 #Nikean MAA
 game_concept_hoplites: "Hoplîtes"
 game_concept_hoplite: "Hoplîte"
 game_concept_hoplites_desc: "The [Glossary( 'Hoplîtes', 'HOPLITES_GLOSS' )] were citizen-soldiers of the old [nikean|E] city-states. These [men_at_arms|E] were primarily represented by free citizens who were able to afford armaments and armor. Now revived, they live to serve [narsokratia|E] once more."

 game_concept_mastiges: "Mástiges" 
 game_concept_mastiges_desc: "The [Glossary( 'Mástiges', 'MASTIGES_GLOSS' )] are a new [innovation|E] of the new [nikeis|E] revival. Armed with newly discovered and utilized gunpowders, they are the penultimate [hoplites|E] of the [realm|E]. Feared and formidable, it's no wonder that they are known for their ruthlessness and effectiveness in [wars|E]."

 game_concept_alnars: "Alnárs"
 game_concept_alnars_adj: "Alnárs'"
 game_concept_alnars_desc: "Among the first to delve into the outside world with his retinue of [hoplites|E], Alnárs is considered to be the progenitor of the new [nikean|E] [mercenary|E] lifestyle. A forerunner of the Nikean Restoration, Alnárs had slowly restored the [nikeis|E] presence in his [region|E] piece by piece. Mysteriously murdered while on his way home from a [temple|E] dedicated to the [panteion|E], his life's work has opened the gates to the outside world for the [nikeans|E] once more, earning him the epithet of 'Sōtēr' or Savior."
 
 game_concept_story_nikean: "$game_concept_story_generic_prefix$ Narsiad"
 game_concept_story_nikean_desc: "#tooltip_heading Story Style: Moderate#!\n\nYou are guided down to the path of the [nikean|E] Restoration, competing with and against your fellow siblings' [house|E] for the sole leadership of the [nikeis|E] as its [cultural_head|E].\n\nEventually, your story will culminate with the formation of a reborn [narsokratia|E] and you as the [hegemon|E] of your [region|E].\n\n$game_concept_story_generic_desc_boilerplate$"

 game_concept_nikean_incursion:0 "Nikean Incursion"
 game_concept_nikean_incursion_desc:3 "A [nikean|E] [casus_belli|E] allowing for the forceful annexation of an independent [rulerpossessive|E] entire [realm|E] and to distribute their former [counties|E] among your followers. Unlocked by the [GetTrait('nars_conqueror').GetName( GetNullCharacter )] [trait|E].\n\nYou can only use this [casus_belli|E] on a [top_liege|E] who does not possess any of the following:\n$EFFECT_LIST_BULLET$#V Nikean Culture#!\n$EFFECT_LIST_BULLET$#V Nikēís Ethnicity#!\n$EFFECT_LIST_BULLET$#V Orphic Faith#!"

 game_concept_nikean_migration:0 "Nikean Migration"
 game_concept_nikean_migration_desc:3 "A [nikean|E] [casus_belli|E] allowing for a forceful [migration|E] into an independent [rulerpossessive|E] [kingdom|E] and to distribute their former [counties|E] among your followers. Unlocked by being a [nikean|E] [adventurer|E].\n\nYou can only use this [casus_belli|E] on a [top_liege|E] who does not possess any of the following:\n$EFFECT_LIST_BULLET$#V Nikean Culture#!\n$EFFECT_LIST_BULLET$#V Nikēís Ethnicity#!\n$EFFECT_LIST_BULLET$#V Orphic Faith#!"

 PANTEION_GLOSS: "[narsic_short|E] #bold Panteíon#! means '(A Temple) of All the Gods'."
 NARSOKRATIA_GLOSS: "[narsic_short|E] #bold Narsokratía #! means 'Rule of Narsēs'."
 POLYMETIS_GLOSS: "[narsic_short|E] #bold Polymêtis #! means 'Many-Counsels'."
 NIKEAN_GLOSS: "[narsic_short|E] #bold Nikēís #! means 'Those Born of Victory'."
 MASTIGES_GLOSS: "[narsic_short|E] #bold Mástiges #! means 'Ravagers'."
 HOPLITES_GLOSS: "[narsic_short|E] #bold Hoplîtes #! means 'Shield-Bearers'."
