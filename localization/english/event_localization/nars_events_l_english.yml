l_english:
 narsid_intro.1001.t:0 "Our Cataclysm"
 narsid_intro.1001.desc:0 "In antiquity, the unrivaled [hegemony|E] of the [narsid|E] [realm|E] stood as the absolute pinnacle of human civilization. When envious nomads and rebellious subjects swarmed our borders, they deluded themselves into believing they had bested us. They were fools. Our last [hegemon|E] [ruler|E] did not deign to be the last; with brilliance, he relocated the worthiest of our aristocracy to an impenetrable mountain refuge. \n\nIn our absence, the lesser [cultures|E] of the world surrendered to their inferiority. In a desperate, cowardly ethnocide, they attempted to scrub the [menofnars|E] from history. They celebrated our [faith|E]'s obliteration and made extinct of the [narsid|E] [culture|E] on the outside world."
 narsid_intro.1001.a:0 "Shameful!"

 narsid_intro.1002.t:0 "The World is Our Birthright"
 narsid_intro.1002.desc:0 "On this day, we have returned. As I gaze upon our ancestral lands, I know that the road ahead will be long and difficult, but we shall rebuild and prosper once more. The [menofnars|E] have not merely survived; we have already won by virtue of our existence. The world is ours to conquer, and we shall do so as it is our birthright from the ashes of our ancestors!"
 narsid_intro.1002.a:0 "Hark for our return!"

 narsid_racial.1001.t: "Masterful Offering!"
 narsid_racial.1001.desc: "The keep is finally quiet. I stand before the household altar to [ROOT.Char.GetFaith.HouseholdGodName], ready to pour the evening racial. I unstopper the wine and pour it into the offering bowl with such immaculate precision and dramatic flair that it borders on the theatrical.\n\nI strike a heroic pose in the dim light, reciting the sacred hymns with a voice so resonant I briefly impress myself. The wine splashes perfectly, not a single drop wasted on the floorstones.\n\nI feel incredibly pious, and honestly, quite magnificent. It is a tragedy the rest of the court was not here to witness such spiritual perfection."
 narsid_racial.1001.a: "I am a true gift to the divine."

 narsid_racial.1002.t: "A Practiced Piety?"
 narsid_racial.1002.desc: "I approach the household shrine, exhaustion weighing heavily on my bones. I am supposed to find inner peace in pouring the evening libation to [ROOT.Char.GetFaith.HouseholdGodName], but all I can think about is the impending grain shortage and the dreadful smell of my spymaster.\n\nI mechanically unstopper the wine, dump an unceremonious splash into the bowl, and rattle off the traditional prayers at a speed that would make an auctioneer blush.\n\nWell, the divine obligation is technically fulfilled. Am I relaxed? Not in the slightest. My shoulders are still as tight as bowstrings. But the heavens cannot say I skipped my chores."
 narsid_racial.1002.a: "Right, next item on the agenda!"

 narsid_racial.1003.t: "A Libation for.. Me!"
 narsid_racial.1003.desc: "Seeking a moment of respite, I retreat to my private chambers to offer a solemn libation to [ROOT.Char.GetFaith.HouseholdGodName]. I reach for a highly prized amphora of sweet, spiced wine from the southern vineyards, intending to pour a modest measure into the offering bowl.\n\nI pull the stopper. The rich, intoxicating aroma hits my nose. I look at the silent household idol. I look back at the wine.\n\nBefore I can second-guess my own blasphemy, I tip the heavy clay jug back and down half of it in one glorious, unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch. The crushing stress of the day vanishes entirely... until I realize I will have to pay the steward to quietly replace this incredibly expensive vintage before my servants notices."
 narsid_racial.1003.a: "The gods work in mysterious, delicious ways."

 narsid_realm.1001.t: "The Gears of Industry"
 narsid_realm.1001.desc: "Our people may have once been lost and desolate, but no more! It now burns with countless fires of ambition, and buildings, holds, and settlements spring up across the plains. \n\nForges and armouries stockpile weapons for the growing hosts of our [hoplites|E], while smithies and workshops construct ever stronger walls and towers to house the growing legions. \n\nThe [menofnars|E] of our [realm|E] are restless, and such reckless might must soon spill over or be wasted forevermore!"
 narsid_realm.1001.a: "Let the forges roar!"

 decision_develop_industry_tt: "Unleash the industrial power of the [narsid|E] [realm|E]!"