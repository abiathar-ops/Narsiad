 narsid_racial.1001.t: "A Good Trim"
 narsid_racial.1001.desc: "I close the door to my chambers and set the lock. This sort of thing demands focus and must not be disturbed. A few moments of preparation follow, ensuring the candles will burn long and steady, adjusting the mirror and carefully positioning the stool. Soon, I am ready to begin.\n\nThe ritual starts with a careful assessment of my beard's current state. It could certainly be worse, all things considered. A little uneven, with a few stray hairs here and there, but nothing beyond repair. I set to work with great care and discipline.\n\nEach meticulous stroke of the blade is punctuated by a fresh application of warm water, softening the hair and ensuring precision. The process takes time, but such tasks are never meant to be rushed. Gradually, symmetry returns and the unruly strands fall into line.\n\nAt last, I sit back and study my reflection. All in all, much better. The beard now has a refined shape, its dignity enhanced. I cut a far finer figure, and the process was relaxing, to boot."
 narsid_racial.1001.a: "I should do this more often."

 narsid_racial.1002.t: "A Fantastic Trim"
 narsid_racial.1002.desc: "I secure the lock on my door and ready my chambers for the task ahead. I choose the most comfortable cushion for my shaving stool, adjust the mirror so the lamplight does not glare into my eyes, and light a scented candle for good measure.\n\nThe figure in the mirror has looked better, and I take note of the sorry state of my beard. Loose hairs aplenty and uneven patches throughout. I set to work and soon settle into a steady rhythm, alternating between strokes of the razor and applying soothing water and rock salt to my face. Soon, I lose myself in the routine, and the burdens of the day lift from my shoulders.\n\nSome time passes, but eventually I set down my razor to examine my handiwork. It is majestic. My beard now hangs proud, groomed to perfection. I look years younger, yet no less wise for it. I feel energised, ready to face any trial."
 narsid_racial.1002.a: "I look... regal."

 narsid_racial.1003.t: "A Good Trim?"
 narsid_racial.1003.desc: "As I close the door to my bedchamber, a familiar sense of comfort settles over me. I settle down on the stool beside the mirror and cast my eyes on the figure staring back. My eyes are drawn towards the impressive beard on my chin. Some excessive hairs are poking out of my nose, however, and it seems to be a bit longer on the left side, towards the ear...\n\nI gingerly pick up my razor and begin trimming - a few tufts here, a few strays there, just a little more... now to take care of that bit there... a few hairs too many, but I'll just even it out...\n\nMy thoughts trail off and my eyes widen. I can't fix what I've just done. I've cut too close to the skin, and now a whole clump of hair comes away in my hand. I look at the mirror and almost shriek in horror.\n\nThe only way to fix the disaster I've inflicted upon myself would be to shave it #italic all#! off."
 narsid_racial.1003.a: "I can't do that! I could never do that!"