 nikean_bookmark.1002.t: "Kakías Apékhou: Foreboding" #Prelude to war
 nikean_bookmark.1002.desc.0001: "As the [heir|E] of [alnars_adj|E] original [camp|E], the burden of our own preservation and the [nikean|E] restoration falls squarely on my shoulders. The dispatch brought to me by my messenger makes it undeniable—our kin are moving away from the orthodox [nikean|E] [tradition|E] in place of their own beliefs. \n\n[rival_1.GetTitledFirstName] and [rival_2.GetTitledFirstName] are accumulating [gold|E] and [prestige|E] on their breakaway [camps|E], eyeing our share of [glory|E] with clear intents of their own selfish [mercenary|E] ambitions. \n\nIs there really no other way other than a [war|E] between [family|E]? Should I send for a delegate in hopes of wishful diplomacy for reconciliation and compromise or must I take initiative to bolster our forces and prepare for the worst from them?"
 nikean_bookmark.1002.desc.0002: "My [loyal|E], leal [hoplites|E] answers to no outdated, bygone [traditions|E]! [event_messenger.GetTitledFirstName] arrived with explicit warnings from our old [nikean|E] [camp|E], but words mean little when steel and [soldiers|E] rule the [region|E]. If [rival_1.GetTitledFirstName] thinks to lock us out of our [glory|E] and destiny, and [rival_2.GetTitledFirstName] prepares for aggression and [war|E], then we shall carve our own line into history with iron and blood. However, I must ask myself: is there really no other way other than this [war|E] between siblings? Should I send for treaties of hopeful diplomacy for reconciliation and compromise or must I take initiative to bolster our forces and prepare for the worst?"
 nikean_bookmark.1002.desc.0003: "Let the others bicker over dust and nothings. [scope:event_messenger.GetTitledFirstName] report that [rival_1.GetTitledFirstName] clings tightly to shadows of the archaic past and bygone [traditions|E] while [rival_2.GetTitledFirstName] grows ever bolder and moronically reckless. True restoration of the [nikeans|E] requires calculated [intrigue|E] and disciplined patience. We have sharpened our blades for years already and our time to unsheathe our daggers approaches ever quickly. However, I must ask myself: is there really no other way other than this [war|E] between siblings? Should I send for treaties of hopeful diplomacy for reconciliation and compromise or must I take initiative to bolster our forces and prepare for the worst?"
 nikean_bookmark.1002.a: "We must prepare for [war|E]"
 nikean_bookmark.1002.b: "Surely there is still a chance for [diplomacy|E]"

 nikean_bookmark.1003.t: "Kakías Apékhou: Conflict" #War declaration
 nikean_bookmark.1003.desc: "'T-Terrible tidings!' a messenger gasps, bursting in and nearly upending the sacred libation bowl I was about to pour in honor of [alnars|E]. 'Let me guess,' I sigh, dabbing spilled wine from my robes. 'Both of the [rival|E] [camps|E] finally realized that they share a mutual hatred of our noble [followers|E]?' \n\nThe pale messenger nods frantically, looking quite pitiful. \n\nIndeed, the heads of our two rival [nikean|E] [mercenaries|E] have formally declared [war|E] upon my own [faction|E] in tandem.\n\nThis [war|E] within our shared [dynasty|E] will be a waste of [nikean|E] lives but my blessed father's legacy shall not be squandered by these wretched infidels. Fine, we shall shepherd these lost sheeps in due time. By force and rows of [hoplites|E], of course."
 nikean_bookmark.1003.a: "The [dynasty] will be mine, by might!"
 nikean_bookmark.1003.b: "Frack! We need more armies..."

 nikean_bookmark.1004.t: "Kakías Apékhou: Reconciliation" #Peace and alliance declaration
 nikean_bookmark.1004.desc: ""
 nikean_bookmark.1004.a: "Let bygones be. I accept them as my own as [friends|E]."
 nikean_bookmark.1004.b: "Our rifts may be deep but they are still my [close_family|E]."
 nikean_bookmark.1004.c: "It is better for our [dynasty|E] to go on separate ways."