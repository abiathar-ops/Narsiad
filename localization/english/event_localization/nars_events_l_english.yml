l_english:
 narsokratia_event.flavor: "[Glossary( '"Alalē! Alalē! Alalē!"', 'ALALE_GLOSS' )]"
 alnars_anduril: "$Alnars$, $anduril_name$."

 nars_intro.0001.t: "Kakías Apékhou"
 nars_intro.0001.desc: "Tales nearby tells of three progenies of the famed [alnars|E], leader of the $game_concept_selianes$ [Glossary( 'Misthophóroi', 'MISTHIOS_GLOSS' )].\n\nThese three mercenaries who have grown in fame these past few years are [eleios.GetFirstNameNicknamedRegnal], [ilione.GetFirstNameNicknamedRegnal], and [strato.GetFirstNameNicknamedRegnal]. Their intentions here are unknown and yet whispers and rumours are abound of their father's demise, which would be catastrophic to the unity of their currently united camp. Considering their personalities, a schism is coming for their mercenary camp's ill-fated destiny.\n\n#flavor "Those long divided, must unite; those long united, one day must divide." - $alnars_anduril$#!"
 nars_intro.0001.a: "I wonder what destiny lies before [eleios.GetFirstNamePossessive] path..."
 nars_intro.0001.a.flavor: "[eleios.GetFirstNameNoTooltip] the Scholared Heir, firstborn and leader of the orthodox faction that longs for a Hegemony of the $game_concept_selianes$."
 nars_intro.0001.b: "[ilione.GetFirstNamePossessive] bloodstained destiny compels me..."
 nars_intro.0001.b.flavor: "[ilione.GetFirstNameNoTooltip] the Wayward Sword, secondborn and leader of those that has long adapted and now beholden to mercenary ways."
 nars_intro.0001.c: "The spider weaves curtains for [strato.GetFirstNamePossessive] whims..."
 nars_intro.0001.c.flavor: "[strato.GetFirstNameNoTooltip] the Vile Whisperer, thirdborn and part of the fringe faction that longs more for profits and selfish intrigues."
 nars_intro.0001.d: "Intriguing... but alas, it is mere tall tales."
 nars_intro.0001.d.flavor: "It would be better for me to haste to my own court rather than hear more of this nonsensical, pointless drivel."
 selian_incivility.tt: "The [mercenary|E] [camp|E] of #v [alnars.GetFirstNameNicknamed]#! fragments"

 nars_intro.0002.t:0 "$nars_intro.0001.t$"
 nars_intro.0002.desc:0 "The death of my father, [alnars|E], has divided his [Glossary( 'Misthophóroi', 'MISTHIOS_GLOSS' )] [camp|E] into three bickering factions."
 nars_intro.0002.eleios:0 "\n\nMy siblings, blinded by arrogance, have thrown away our old ways and tradition. $Ilione$ would see our people bleed as mindless sellswords for foreign coin, while $Strato$ weaves craven webs in the shadows, forgetting the honor of our ancestors. The true destiny of a [selian|E] is not to wander as outcasts or hide as spies, but to claim lands and restore the past [narsokratia|E] of the $game_concept_selianes$."
 nars_intro.0002.ilione:0 "\n\nMy brothers scramble for power like dogs fighting over a bone. $Eleios$ dreams of tying us to the dirt with his settled [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')], while $Strato$ cowers in the shadows of foreign courts. Fools, them both. The essence of a [selian|E] lies not in statecraft or [intrigue|E], but in [martial|E] [prowess|E]."
 nars_intro.0002.strato:0 "\n\nMy siblings, blinded by hubris, took their [faction|E] in opposite directions. $Eleios$ marches openly, seeking a bloody [hegemony|E], while $Ilione$ sells our people's honor to the highest bidder for their wretched wars. They do not see the truth: we are vastly outnumbered. A [selian|E] spear can pierce armor, but a whispered secret can topple an [empire|E] without a single casualty of our own."
 nars_intro.0002.end:0 "\n\nI must make a decision: convince them of my leadership, both [target_1.GetFirstNameNoTooltip] and [target_2.GetFirstNameNoTooltip], or to break away completely, removing all pretense from the now tumultuous camp built by [alnars.GetFirstNameNicknamedRegnal]."
 nars_intro.0002.a: "There is still hope yet for our unity!"
 nars_intro.0002.a.flavor: "They are still my own blood, no matter how we all quarrel"
 nars_intro.0002.b: "Why must I prevent the inevitable?"
 nars_intro.0002.b.flavor: "They are now, and from here on, incorrigible to our cause!"
 selian_diplomacy.tt: "You try to persuade to #v [target_1.GetFirstName]#! and #V [target_2.GetFirstName]#! to join your [camp|E]"
 selian_incivility.tt: "The [mercenary|E] [camp|E] of #v [alnars.GetFirstNameNicknamed]#! fragments"

 nars_intro.1001.t:0 "Gnōthi Seauton"
 nars_intro.1001.desc:0 "In antiquity, the hegemony of the $game_concept_selianes$ stood at the forefront of civilization. When nomadic incursions and catastrophic plagues turned our lands asunder, they believed we were truly destroyed. \n\nAlas, that couldn't be more false.\n\nOur last ruler did not deign to be the final; he relocated numbers of our kind to dozens of hidden [Glossary( 'Akropóleis', 'AKROPOLIS_GLOSS' )] on the fringes of his lands, away from the covetous eyes of our once-subjugated tribal vassals. \n\nAlas even so, in the weakness that followed, various tribal clans and nomads scrubbed the remaining [selianes|E] one massacre at a time. They had so soon celebrated our realm's obliteration to know their own hubris about our complete destruction.\n\nDecades after [alnars|E] roamed the world, I now follow his steps.\n\n#flavor "Though our kind is brought to the brink by wars or plague, leaving only the unlettered survivors on the peaks, from those lonely few all of our cultural ways must invariably spring anew." - $alnars_anduril$#!"
 nars_intro.1001.a:0 "And so time goes on..."
 nars_intro.1001.a.flavor: "The time for our restoration is nigh!"

 selian_diplomacy_both_join_toast_t: "House $name_dyn_nars_1001$ Reunited"
 selian_diplomacy_both_join_toast_tt: "Both [target_1.GetFirstNameNoTooltip] and [target_2.GetFirstNameNoTooltip] joined your [camp|E]!"
 selian_diplomacy_half_joins_toast_t: "Partial $name_dyn_nars_1001$ Reunion"
 selian_diplomacy_target_1_joins_toast_tt: "[target_1.GetFirstNameNoTooltip] has now joined your [camp|E]\n[target_2.GetFirstNameNoTooltip], however, stubbornly refuses."
 selian_diplomacy_target_2_joins_toast_tt: "[target_2.GetFirstNameNoTooltip] has now joined your [camp|E]\n[target_1.GetFirstNameNoTooltip], however, stubbornly refuses."
 selian_diplomacy_neither_join_toast_t: "Entreaties Rejected"
 selian_diplomacy_neither_join_toast_tt: "Both [target_1.GetFirstNameNoTooltip] and [target_2.GetFirstNameNoTooltip] refused to join you!"

 nars_courtiers.0001.t: "A Selian Arrives"
 nars_courtiers.0001.desc: "[selian_courtier.GetName] has arrived at [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]!\nYou have lost #color_red [EmptyScope.ScriptValue('minor_gold_value')]#! [gold_i][gold|E] in wages"
 nars_courtiers.0003.t: "Herald Spurned"
 nars_courtiers.0003.desc: "You have gained #color_red [EmptyScope.ScriptValue('minor_stress_impact_gain')]#! [stress_gain_i][stress|E]\nYou have lost #color_red [EmptyScope.ScriptValue('minor_gold_value')]#! [gold_i][gold|E] in wages"

 nars_courtiers.0021.toast.t: "Sponsored Host Departs!"
 nars_courtiers.0021.toast.desc: "[new_adventurer.GetTitledFirstName] gathered a host and now marches against [target_kingdom_ruler.GetTitledFirstName]!"

 nars_courtiers.0011.t: "Engúa Pára d' Áta"
 nars_courtiers.0011.desc: "I sink back in my chair and feel drowsiness take me as I hear my courtiers recount the same banality for the upteenth iteration.I need someone, #emp anyone#!, who can tell me about anything new, something remotely original and innovating.\n\nAfter dispatching messages throughout my realm, two [selianes|E] finally show up in [ROOT.Char.GetCapitalLocation.GetName]. They both are promising candidates and both #emp are#! undoubtably [Glossary( 'Polimêtis', 'POLIMETIS_GLOSS' )] prospects.\n\n #flavor "Any bureaucratic offices should be entrusted only to those who possess three things: loyalty to law, the greatest capacity for the duties of the office, and virtue." - $alnars_anduril$#!"
 nars_courtiers.0011.a: "I will take [pugilist.GetFirstName] to my court."
 nars_courtiers.0011.b: "Mayhaps, I will take [savant.GetFirstName] instead."
 nars_courtiers.0011.d: "There is no one suitable here, unfortunately."
 nars_courtiers.0011.c: "Our coffers can accomodate both their recruitment."
 nars_courtiers.0011.d.tt: "You spurn them both to seek their fortunes elsewhere."
 nars_courtiers.0011.a.tt: "Both #v [pugilist.GetFirstName]#! and #v [savant.GetFirstName]#! joins your [court|E]"
 nars_courtiers.0011.a.flavor: "Any minor considerations #emp are#!, of course, not allowed to interfere with merit. [pugilist.GetSheHe|U] has proven [pugilist.GetHerHis] merits"
 nars_courtiers.0011.b.flavor: "Any minor considerations #emp are#!, of course, not allowed to interfere with merit. [savant.GetSheHe|U] has proven [savant.GetHerHis] merits"
 nars_courtiers.0011.c.flavor: "Any minor considerations #emp are#!, of course, not allowed to interfere with merit. They have proven their merits"
 nars_courtiers.0011.d.flavor: "I must wait and hope for the future"

 nars_faith_9000_toast_title: "Aeì Ho Theòs Geōmetreî"
 nars_faith_9000_toast_desc: "The Selian tradition has been imposed on the realm!"
 
 nars_faith.0001.t: "Homónoian Díōke"
 nars_faith.0001.desc: "Haivēn's serenity belongs to the faithful, yet [pagan.GetTitledFirstNameNoTooltip] of the [pagan.GetCulture.GetCollectiveNounNoTooltip], who answers to my crown, is blissfully unaware of it, clinging still to [pagan.GetHerHis] superstitions and false beliefs along with the people of [pagan.GetPrimaryTitle.GetName].\n\nBringing that land into the $game_concept_selianes$ faith is a virtuous endeavor in itself, strengthening the control of my rule and easing my hold over it. My chosen [Glossary( 'meíthiō', 'MEITHIOS_GLOSS' )], [evangelizer.GetFirstName], is ready to go.\n\n#flavor "I shall not cease to teach, to exhort you and in my usual way to point out to any one of you whom I happen to meet: 'You are $game_concept_selianes$... are you not ashamed of your eagerness to possess as much wealth as possible, while you do not care for nor give thought to wisdom or truth?'" - $alnars_anduril$"
 nars_faith.0001.a: "Fortunes guide you!"
 nars_faith.0001.a.flavor: "Go in [Glossary( 'Eusebeia', 'EUSEBEIA_GLOSS' )], virtuous one."
 nars_faith.0001.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital"
 nars_faith.0003.desc_bribe: "[sender.GetTitledFirstName] has sent a [Glossary( 'meíthiō', 'MEITHIOS_GLOSS' )], [evangelizer.GetFirstName], to my court, preaching in here, the wisdom of an alien faith, honored in temples of learning that always smell of incense.\n\n[evangelizer.GetSheHe|U] carries more than words and a token of goodwill, yes, but whether or not those are enough to convince me is of course another matter entirely.\n\n#flavor "I shall not cease to teach, to exhort you and in my usual way to point out to any one of you whom I happen to meet: 'You are $game_concept_selianes$... are you not ashamed of your eagerness to possess as much wealth as possible, while you do not care for nor give thought to wisdom or truth?'" - $alnars_anduril$"
 nars_faith.0003.desc_no_bribe: "[sender.GetTitledFirstName] has sent a [Glossary( 'meíthiō', 'MEITHIOS_GLOSS' )], [evangelizer.GetFirstName], to my court, preaching in here, the wisdom of an alien faith, honored in temples of gold and silver that always smell of incense.\n\n[evangelizer.GetSheHe|U] carries more than words and a token of goodwill, yes, but whether or not those are enough to convince me is of course another matter entirely.\n\n#flavor "I shall not cease to teach, to exhort you and in my usual way to point out to any one of you whom I happen to meet: 'You are $game_concept_selianes$... are you not ashamed of your eagerness to possess as much wealth as possible, while you do not care for nor give thought to wisdom or truth?'" - $alnars_anduril$"
 nars_faith.0003.a: "How much did you offer us again?"
 nars_faith.0003.a.flavor: "We really #emp do#! need to fill our coffers"
 nars_faith.0003.b: "We've no need for your gold."
 nars_faith.0003.b.flavor: "I might as well get some good relations"
 nars_faith.0003.c: "Sod off, you cretin infidel!"
 nars_faith.0003.c.flavor: "My lands shan't have any foreign faiths!"
 nars_faith.0006.desc_new: "My predecessor [sender.GetFirstName] had invested into the evangelism of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] [Glossary( 'meíthiō', 'MEITHIOS_GLOSS' )] [evangelizer.GetFirstName], in fact, has just returned."
 nars_faith.0006.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring and spread the blessed words of the $game_concept_selianes$ faith to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back to court today, as I've been eagerly waiting for [evangelizer.GetHerHis] toils' results.\n\nThe success of this mission could mean a great expansion of our faith and influence, but failure would be a waste of our time and resources that had been better spent elsewhere if so."
 nars_faith.0006.desc_success: "\n\n"I bring great news, my liege! The populace of [pagan.GetPrimaryTitle.GetNameNoTier] has converted to [evangelizer.GetFaith.GetName]!", [evangelizer.GetFirstNameNoTooltip] said with a radiant smile on [evangelizer.GetHerHis] face. I can see [evangelizer.GetHerHis] increase in faith due to [evangelizer.GetHerHis] success.\n\n#flavor "For if I preach our old, noble ways, that gives me no ground for boasting. For necessity is laid upon me. Woe to me if I do not preach of the ways of our forefathers and their antiquate heritage!" - $alnars_anduril$"
 nars_faith.0006.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of God, and sent me away empty-handed.", [evangelizer.GetFirstNameNoTooltip] said with a forced smile on [evangelizer.GetHerHis] face.\n\n#flavor "For if I preach our old, noble ways, that gives me no ground for boasting. For necessity is laid upon me. Woe to me if I do not preach of the ways of our forefathers and their antiquate heritage!" - $alnars_anduril$"
 nars_faith.0006.a: "Praise be our lords divine!"
 nars_faith.0006.a.flavor: "The faith spreads and soon our works will spread like fire!"
 nars_faith.0006.b: "It's only a temporary setback."
 nars_faith.0006.b.flavor: "Not now, but our faith #emp will#! spread in time"
 nars_faith.0007.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my [Glossary( 'meíthiō', 'MEITHIOS_GLOSS' )] [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of God!"
 nars_faith.0007.a: "Outrageous!"

 nars_nickname.0010.t:0 "Êthos Dokímaze"
 nars_nickname.0010.desc:0 "To choose an epithet is to carve one's essence into the annals of our shared history. How shall I be remembered by my peers, and what legacy shall I leave for posterity?\n\n#flavor "He took the title of [Glossary( 'Hēgemon', 'HEGEMONIA_GLOSS' )], a term signifying something more than human. In this way, the power of the people passed entirely into the hands of his personage." - $alnars_anduril$"
 nars_nickname.0010.aa:0 "I shall shed my epithet."
 nars_nickname.0010.aa.tt:0 "Casting aside your current epithet, you choose to remain without one, for now."
 nars_nickname.0010.a:0 "I am defined by my pious devotion."
 nars_nickname.0010.a.tt:0 "Reflect on your faith, virtue, and enlightenment"
 nars_nickname.0010.b:0 "I am defined by my impervious glory."
 nars_nickname.0010.b.tt:0 "Reflect on war, conquest, and ambition"
 nars_nickname.0010.c:0 "I am defined by infamy and dread."
 nars_nickname.0010.c.tt:0 "Reflect on hubris, corruption, and infamy."
 nars_nickname.0010.x:0 "My current name suffices."
 nars_nickname.0010.x.tt:0 "You choose not to adopt a new epithet at this time."

 nars_narsil.0001.t: "Forging $narsil_name$"
 nars_narsil.0001.desc: "You progressed the #v [GetScheme('mend_narsil_scheme').GetTypeName]#! [scheme|E]\nYou have lost #color_red [EmptyScope.ScriptValue('medium_gold_value')]#! [gold_i][gold|E] in materials"
 nars_narsil.0002.t: "Forging $narsil_name$"
 nars_narsil.0002.desc: "You have gained #color_red [EmptyScope.ScriptValue('minor_stress_impact_gain')]#! [stress_gain_i][stress|E]\nYou have lost #color_red [EmptyScope.ScriptValue('medium_gold_value')]#! [gold_i][gold|E] in materials"

 nars_narsil.9000.t: "Dikaíōs Ktô"
 nars_narsil.9000.desc: "Deep in the vaults of my armory, my smiths have at last completed their toil. As one of them lifts [narsil|E] from the trough, the metal hums with a strange, unnatural energy. It is whole once more, its edge gleaming in the torchlight. The smith falls to his knees, presenting it to my hands.\n\n#flavor "The measure of a man's personage is what he does with his power." - $alnars_anduril$"
 nars_narsil.9000.a: "At long last, the sign of my times."
 nars_narsil.9000.flavor: "[Glossary( '"Alalē! Alalē! Alalē!"', 'ALALE_GLOSS' )]"

 nars_amphora.0001.t: "Making $artifact_amphora_name$"
 nars_amphora.0001.desc: "Your #v [GetScheme('produce_amphora_scheme').GetTypeName]#! [scheme|E] progressed!\nYou have lost #color_red [EmptyScope.ScriptValue('tiny_gold_value')]#! [gold_i][gold|E] in materials"
 nars_amphora.0002.t: "Making $artifact_amphora_name$"
 nars_amphora.0002.desc: "You have gained #color_red [EmptyScope.ScriptValue('minor_stress_impact_gain')]#! [stress_gain_i][stress|E]\nYou have lost #color_red [EmptyScope.ScriptValue('medium_gold_value')]#! [gold_i][gold|E] in materials"
 nars_amphora.0003.t: "Making $artifact_amphora_name$"
 nars_amphora.0003.desc: "You gained [learning_i|E][learning|E] [skill|E] insights!\nYou have lost #color_red [EmptyScope.ScriptValue('medium_gold_value')]#! [gold_i][gold|E] in materials"
 nars_amphora.0004.t: "Making $artifact_amphora_name$"
 nars_amphora.0004.desc: "You gain #v 75#! [legitimacy_i|E][legitimacy|E] from $game_concept_selianes$\nYou have lost #color_red [EmptyScope.ScriptValue('medium_gold_value')]#! [gold_i][gold|E] in materials"
 nars_amphora.9000.t: "[scheme.GetNameNoTooltip]: Success"
 nars_amphora.9000.desc: "Deep in the vaulted chambers of my workshops, my hands have at last completed their toil. As I lift the vessel from the polishing cloths, the sheen seems to catch and hold a nearby ambient torchlight. I hold my own creation, my [Glossary( 'Amphoreús', 'AMPHOREUS_GLOSS' )], in my hands as I revel in my own creation.\n\n#flavor "As a man takes a vessel of solid gold, the crown of his possessions, bubbling with the dew of the vine, and marvels at his own glory." - $alnars_anduril$"
 nars_amphora.9000.a: "At long last, my handiwork."
 nars_amphora.9000.flavor: "An amphora of mine own..."

 nars_faith.10.t: "Peithoûs Chrýsion"
 nars_faith.10.desc: "Coins has always moved men more readily than piety, yet purses alone will not carry the [faith|E] of the $game_concept_selianes$ into stubborn men. How boldly should my meithios spend on their conversions, and how much am I willing to spend to hasten more lands into the fold?\n\n#flavor "He must be taught, even against his will, to accept the rites he has spurned... that he may know the divine manifest to men." - $alnars_anduril$#!"
 nars_faith.10.a: "I will spare no expense!"
 nars_faith.10.b: "Temperance in all things."
 nars_faith_intro_tt: "Let coins do what we cannot."
 no_change_evangelism_tt: "Your #v[GetScheme('sponsor_meithios_scheme').GetTypeName]#! [scheme|E] progresses unmodified"

 nars_narsil.10.t: "Xíphous Palingenesía"
 nars_narsil.10.desc: "The shards of [narsil|E] test both my smiths' skill and my own resolve. How relentlessly should I pursue its mending, and how much of my coffers am I willing to spend chasing its restoration?\n\n#flavor "The $game_concept_selianes$ were forging in their vast [Glossary( 'Akropóleis', 'AKROPOLIS_GLOSS' )] with silence. They were shaping the terrifying sword of $game_concept_enuo$, with which she rouses men and cities to war. - $alnars_anduril$#!"
 nars_narsil.10.a: "I will spare no expense!"
 nars_narsil.10.b: "It'll take the time it takes."
 nars_narsil_intro_tt: "Let the shards remember their shape."
 no_change_restoration_tt: "Your #v [GetScheme('mend_narsil_scheme').GetTypeName]#! [scheme|E] progresses unmodified"

 nars_amphora.10.t: "Keraméōs Téchnē"
 nars_amphora.10.desc: "To shape clay into a worthy [Glossary( 'Amphoreús', 'AMPHOREUS_GLOSS' )] is to prove oneself among the civilized. How meticulously should I labor at the wheel, and how much comfort am I willing to trade for a masterwork?\n\n#flavor "Come, $game_concept_phokas$, with upraised hand protect the kiln. Let the clay vessels bake well and emerge with a beautiful dark glaze, and let them be fired without cracking." - $alnars_anduril$#!"
 nars_amphora.10.a: "I will spare no expense!"
 nars_amphora.10.b: "It'll take the time it takes."
 nars_amphora_intro_tt: "Let the wheel turn true."
 no_change_craftsmanship_tt: "Your #v [GetScheme('produce_amphora_scheme').GetTypeName]#! [scheme|E] progresses unmodified"
 produce_amphora_tt: "You create an #v Amphora#! [inventory_artifact|E]"

 nars_hegemony.0002.t: "Ídia Phúlatte"
 nars_hegemony.0002.desc: "Words flown by the winds has spread across our region that our liege-lord, [nikator_aspirant.GetFirstNameNoTooltip], has proclaimed [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] over all of this region. Heralds from the [nikator_aspirant.GetPrimaryTitle.GetNameNoTooltip] has come bearing news of our realm's rise to hegemony... and those who seek to display their disobedience to our lord's proclamation.\n\nMy blood boils at the coming war everyone knows. A storm is brewing, whispers of a coalition of disobedient rabbles. Well to war then, it is now time to take up arms against those who refuse to see my liege's [realm|E] rise and rule over all the others.\n\n#flavor "Freedom is the sure possession of those alone who have the courage to defend it." - $Ilione$, Funeral Oration of $Alnars$.#!"
 nars_hegemony.0002.a: "For this region! To arms, to arms!"
 nars_hegemony.0002.a.flavor: "[Glossary( '"Alalē! Alalē! Alalē!"', 'ALALE_GLOSS' )]"
 hegemony_join_tt: "You will soon join the #v Anticipative War#!"

 nars_hegemony.0003.t: "Ídia Phúlatte"
 nars_hegemony.0003.desc: "Words flown by the winds has spread across our region that [nikator_aspirant.GetFirstNameNoTooltip] has proclaimed [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] over all of this region. Heralds from the [nikator_aspirant.GetPrimaryTitle.GetNameNoTooltip] has come bearing demands for submission and recognition for his hegemony.\n\nTo bend the knee is to humiliate not only myself but this realm of mine. To remain silent is to invite suspicion from every side. To reject this claim is to take up arms beside those who refuse to see one [realm|E] rise and rule over all the others.\n\n#flavor "Freedom is the sure possession of those alone who have the courage to defend it." - $Ilione$, Funeral Oration of $Alnars$.#!"
 nars_hegemony.0003.b: "For this region! To arms, to arms!"
 nars_hegemony.0003.b.flavor: "[Glossary( '"Alalē! Alalē! Alalē!"', 'ALALE_GLOSS' )]"
 nars_hegemony_submit_tt: "You submit to [nikator_aspirant.GetFirstNameNoTooltip] as a [subject|E]"
 nars_hegemony_reject_tt: "You will soon join the #v Anticipative War#!"

 nars_hegemony.0101.t: "Kairòn Prosdékhou"
 nars_hegemony.0101.desc: "The ambitions of [defender.GetFirstNameNoTooltip] have been shattered upon the shields of our coalition. Through our united defiance, we have preserved the freedom of our home cities and defended the inviolable, sacred principle of autonomy across the region.\n\nThe threat of a singular tyrant dominating this region has ended. The cities remain free, equal, and master of their own fates.\n\n#flavor "For a man's native land is his most sacred possession, and he who betrays it loses his right to walk upon its soil as a free man." - $alnars_anduril$#!"
 nars_hegemony.0101.a: "As it should be."
 nars_hegemony.0101.a.flavor: "Let no one man claim what belongs to all."

 nars_hegemony.0102.t: "$nars_hegemony.0101.t$"
 nars_hegemony.0102.desc: "The combined [realms|E] and its coalition stood as a defiant, insurmountable wall against our forces. Our vision to forge a single, powerful hegemony under our banners has crumbled into bitter defeat, swallowed by the coalition's resistance.\n\nOur hubris has met its inevitable ending. The mantle of [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] slips through our fingers, leaving our realm weakened and exposed to the whims of our triumphant rivals.\n\n#flavor "There is one safeguard known generally, which is a security to all, but especially to democracies as against despots. What is it? Distrust." - $Strato$, Commentaries on $anduril_name$.#!"
 nars_hegemony.0102.a: "The gods judge harshly."
 nars_hegemony.0102.a.flavor: "Perhaps another day, another sword."

 nars_hegemony.0103.t: "$nars_hegemony.0101.t$"
 nars_hegemony.0103.desc: "Our coalition's lines broke before the relentless forces of [defender.GetFirstNameNoTooltip]. One by one, free cities have been forced to bow, their armies shattered and their autonomy emptied.\n\nFragmanted by the results, our vassals declare independence as we have no choice but to let [defender.GetTitledFirstNamePossessiveNoTooltip] supreme [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] be formed. The bygone era of independent realms yields to the unyielding emergence of a single power.\n\n#flavor "For that some rule and others be ruled is a thing not only necessary, but expedient; from the hour of their birth, some are marked for subjection, others for rule." - $alnars_anduril$#!"
 nars_hegemony.0103.a: "We fought and we lost."
 nars_hegemony.0103.a.flavor: "The coalition's bones will fertilize their fields."

 nars_hegemony.0104.t:0 "$nars_hegemony.0101.t$"
 nars_hegemony.0104.desc:0 "The squabbling coalition lies broken at our feet. Through iron resolve, brilliant strategy, and bloody triumph on the field, we have established [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] over all of this region entire.\n\nUnder our firm strength, the disobedient, treacherous realms outside our realm has been shattered, ripe for the taking. Now, a new sun rises over the region, and our blessed names will be remembered for millennia as the true master of this region.\n\n#flavor "A multitude of masters is no good thing; let there be one master, one king, to whom is given the scepter and rights of judgment." - $alnars_anduril$#!"
 nars_hegemony.0104.a:0 "This region marches as one!"
 nars_hegemony.flavor.win: "A new sun illuminates this region..."
 nars_hegemony.flavor.lose: "This region will remain away from grasping hands..."

 nars_hegemony.0105.t:0 "$nars_hegemony.0101.t$"
 nars_hegemony.0105.desc:0 "The coalition lies broken at our feet. Through iron resolve, brilliant strategy, and bloody triumph on the field, we have established [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] over this region entire, uniting it under one $game_concept_selianes$.\n\nUnder our firm strength, the disobedient, treacherous realms outside our realm has been shattered, ripe for the taking. Now, a new sun rises over the region, and our blessed names will be remembered for millennia as the true master of this region.\n\nThe ones who had restored our long-standing dream — [narsokratia|E].\n\n#flavor "For it has always been a rule established by nature that the weaker should be subject to the stronger. We have done no extraordinary feat, nothing contrary to nature in creating a hegemony when it was in our grasp, and then in refusing to give it up." - $alnars_anduril$#!"
 nars_hegemony.0105.a:0 "This region marches as one!"

 nars_hegemony.0106.t: "$nars_hegemony.0101.t$"
 nars_hegemony.0106.desc: "The combined [realms|E] of this region and its coalition stood as a successful defiant, insurmountable wall against our forces. Our vision to forge a single, powerful hegemony under our banners has crumbled into bitter defeat, swallowed by the coalition's resistance.\n\nOur hubris has met its inevitable ending. The mantle of [Glossary('Narsokratía', 'NARSOKRATIA_GLOSS')] slips through our fingers, leaving our realm weakened and exposed to the whims of our triumphant rivals.\n\n#flavor "There is one safeguard known generally, which is a security to all, but especially to democracies as against despots. What is it? Distrust." - $Strato$, Commentaries on $anduril_name$.#!"
 nars_hegemony.0106.a: "The gods judge harshly."
