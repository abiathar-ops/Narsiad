l_english:
 nikean_intro.1001.t:0 "Fall of Old Ōikoumēne"
 nikean_intro.1001.desc:0 "In antiquity, the unrivaled [hegemony|E] of the [nikeanrealm|E] stood as the absolute pinnacle of human civilization. When envious nomads and rebellious subjects swarmed our borders, they deluded themselves into believing they had bested us. \n\nThey were wrong. Our last [hegemon|E] [ruler|E] did not deign to be the last; with brilliance, he relocated the worthiest of our leal aristocracy to an impenetrable mountain refuge. \n\nIn our exiled absence, the lesser [cultures|E] of the world attempted to scrub the [nikeis|E] from history in a cowardly ethnocide. They celebrated our [faith|E]'s obliteration and made extinct of the [nikean|E] [culture|E] on the outside world. \n\nAs decades passed, the world outside became unrecognizable, but our forefathers endured in our exile. As the [regions|E] around us decayed into barbaric [wars|E], they preserved the flame of our [culture|E], waiting for the perfect moment to return and reclaim our [realms|E]."
 nikean_intro.1001.a:0 "Deplorable!"

 nikean_intro.1002.t:0 "Our Realm in Exile"
 nikean_intro.1002.desc:0 "Centuries have passed since then, the [realms|E] outside has certainly forgotten our [culture|E]. It was perhaps our luck that in this [era|E] we have returned, for it is an age of strife. As I gaze upon our ancestral [regions|E], I know that the road ahead will be long and difficult, but we shall rebuild [narsokratia|E] and prosper once more. The [nikeis|E] have not merely survived; we have already won by [virtue|E] of our existence. The world is ours to conquer, and we shall do so as it is our birthright from the ashes of our ancestors!"
 nikean_intro.1002.a:0 "Hark, St. Alnarēs!"

 nikean_racial.1001.t: "Masterful Offering!"
 nikean_racial.1001.desc: "The [holding|E] is finally quiet. I stand before the household altar to [narses|E], ready to pour the evening racial. I unstopper the wine and pour it into the offering bowl with such immaculate precision and dramatic flair that it borders on the theatrical.\n\nI strike a heroic pose in the dim light, reciting the sacred hymns with a voice so resonant I briefly impress myself. The wine splashes perfectly, not a single drop wasted on the floorstones.\n\nI feel incredibly pious, and honestly, quite magnificent. It is a tragedy the rest of the court was not here to witness such perfection in [piety|E]."
 nikean_racial.1001.a: "I am a true gift to the divine."

 nikean_racial.1002.t: "A Practiced Piety?"
 nikean_racial.1002.desc: "I approach the household shrine, exhaustion weighing heavily on my bones. I am supposed to find inner peace in pouring the evening libation to [narses|E], but all I can think about is the impending grain shortage and the dreadful smell of my [spymaster|E].\n\nI mechanically unstopper the wine, dump an unceremonious splash into the bowl, and rattle off the prayers of [nikean|E] [tradition|E] at a speed that would make an auctioneer blush.\n\nWell, my [cultural|E] obligation is technically fulfilled. Am I relaxed? Not in the slightest. My shoulders are still as tight as bowstrings. But the heavens cannot say I skipped my chores."
 nikean_racial.1002.a: "Right, next item on the agenda!"

 nikean_racial.1003.t: "A Libation for.. Me!"
 nikean_racial.1003.desc: "Seeking a moment of respite, I retreat to my private chambers to offer a solemn libation to [narses|E]. I reach for a highly prized amphora of sweet, spiced wine from the southern vineyards, intending to pour a modest measure into the offering bowl.\n\nBefore I can second-guess my own blasphemy, I tip the heavy clay jug back and down half of it in one glorious, unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch. \n\nThe crushing [stress|E] of the day vanishes entirely until I realize I will have to pay the [steward|E] to quietly replace this incredibly expensive vintage before my servants notices."
 nikean_racial.1003.a: "The gods work in mysterious, delicious ways."

 nikean_realm.1001.t: "The Gears of Industry"
 nikean_realm.1001.desc: "Our people may have once been lost and desolate, but no more! It now burns with countless fires of ambition. [buildings|E], [holdings|E], and settlements spring up across the plains, in accordance with the rise of our unstoppable [development|E]. \n\nForges and armouries stockpile weapons for the growing hosts of our [men_at_arms|E] of yore, the [hoplites|E], while smithies and workshops construct ever stronger walls and towers to house the growing [armies|E]. \n\nThe [nikeis|E] of our [realm|E] are restless, and each alley and street yearns for the glorious revival of the [nikeanrealm|E] of antiquity. The [narsokratia|E] will almost be reborn and the hour is nigh!"
 nikean_realm.1001.a: "Let the forges roar!"

 nikean_realm.1011.t: "An All-Seeing Eye"
 nikean_realm.1011.desc: "To maintain rule, the [narsokratia|E] must possess total truth. The flaw of lesser [cultures|E] is that they wait for treason to strike before acting. The [nikeis|E] do not wait. \n\nBy placing our own operatives among the shadows, we turn the weaknesses of the populace into our greatest asset. Every whispered [scheme|E], every illicit [gold|E] traded in the dark, will be cataloged and delivered to the throne before a single blade is drawn. We shall commandeer and establish a sprawling, invisible web beneath the capital. \n\nWe will hear every [secret|E], record every sin, and extinguish every [revolt|E] before it ever draws breath!"
 nikean_realm.1011.a: "A thousand eyes and one!"

 nikean_realm.1021.t: "A Surplus of Perfection"
 nikean_realm.1021.desc: "I stand before the mirror in my chambers, admiring the flawless contour of my jawline. It strikes me suddenly; what a profound tragedy it is that our current traditions restrict a [ruler|E] of my [prestige|E] to a single [spouse|E].\n\nIs it not incredibly selfish of me to hoard such magnificence? The potential of my [marriage|E] is being tragically bottlenecked by outdated, peasant-minded notions of monogamy. The heavens clearly sculpted [nikean|E] [lieges|E] to be shared.\n\nI immediately issue an imperial decree redefining sacred [doctrines|E]. The only question that remains is exactly how much of my perfection the [realm|E] is prepared to handle."
 nikean_realm.1021.a: "Bigamy. A perfect, duality of devotion."
 nikean_realm.1021.b: "Bah..! Might as well get three!"

 nikean_realm.1031.t: "The Faith Spreads!"
 nikean_realm.1031.desc: "The priests and heralds we dispatched have returned with glowing reports. Across the [realm|E], shrines to [narses|E] have been erected where foreign temples once stood. The chants of the [orphic|E] faith now echo in village squares that spoke only in foreign tongues last season.\n\nIt is not total — the deep roots of old beliefs do not wither overnight. But the tide has turned. The [nikeis|E] are no longer an isolated flame; they are a spreading fire, and the [narsokratia|E] grows more unified with every passing year."
 nikean_realm.1031.a: "One faith, one [realm|E]!"

 decision_develop_industry_tt: "Unleash the industrial power of the [nikeanrealm|E]!"
 decision_spy_network_tt: "Establish the Silent Synod to monitor the [nikeanrealm|E]."

 nikean_titles.2021.t: "Old Ōikoumēne"
 nikean_titles.2021.desc: "Not since antiquity have we [nikeis|E] stood united beneath a single banner. Guided by one purpose, one vision. A true [narsokratia|E].\n\nFrom every corner of the world, [GetReligionByKey('nars_religion').GetAdherentNamePluralNoTooltip] now travel to [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Pilgrims and [rulers|E], scholars and [soldiers|E]. From distant deserts and crowded ports, from every school and sect, they gather before me — to bow their heads, to pledge their hearts.\n\nOnly time will tell if this [hegemony|E] will last – or if it is doomed to fade into history once more. For now, the plentitudes will know the all‑embracing peace of Narsēs."
 nikean_titles.2021.a: "All of the world shall belong to Narsēs!"

 nikean_titles.2022.t: "An Ode to Narsēs!"
 nikean_titles.2022.desc: "Today, I call all [nikeis|E] to declare the realization of our [cultural|E] [hegemony|E], the legitimate absolution of [narsokratia|E]. We no longer view ourselves as a mere nation competing on the world stage. Blessed with inhuman grace and unquestionable superiority, we are the world.\n\nFrom this day forward, any [realm|E] or [region|E] that resists us is not a [rival|E] power, but a [revolting|E] [domain|E] resisting the inevitable march of our perfect [government|E]. Under the rule of the [nikeis|E], every [region|E] will finally know true, universal pacification." 
 nikean_titles.2022.a: "One Law, One People, One Hegemony!"
 
 nikean_titles.2011.t:0 "A Step from Old Nārsokratía"
 nikean_titles.2011.desc: "For centuries, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereignty. Today, I elevate our [realm|E] to an absolute $Ōtarkhia$. My [legitimacy|E] does not come from mere conquest, but from the divine right from [narses|E] for the revival of the [narsokratia|E]. We, the [nikeis|E], stand above them, blessed with a grace and perfection they can only ever envy.\n\nThe true [nikeanrealm|E] is awake. The pretender [empires|E] will soon realize that they are nothing more than temporary [stewards|E] of our historical [domains|E], simply keeping the throne warm for their rightful [rulers|E]." 
 nikean_titles.2011.a: "God and My Rights!"

 nikean_titles.2001.t: "Proclaiming the Despotēia"
 nikean_titles.2001.desc: "While we preserved the flame of our civilized [culture|E], the world below fractured into petty [realms|E]. The squabbling [rulers|E] of this [era|E] mistake their disorganized [domains|E] for true [realms|E]. \n\nToday, as a new [ROOT.Char.GetTitleAsNameNoTooltip], I formalize our [nikean|E] rule, enacting our [cultural|E] [tradition|E] and proclaiming the foundation of a new Despotēia of [narsokratia|E]. When the neighboring lords sent their envoys in their crude fabrics, they looked upon our radiant, terrifying beauty with a mix of absolute awe and [dread|E]. The dark age of this [region|E] has ended. The [narsokratia|E] returns to bring unyielding order to this chaotic earth." 
 nikean_titles.2001.a: "Our first true step..!"

 nikean_artifact.1001.t: "A Horrifying Dilemma..?"
 nikean_artifact.1001.desc: "The shattered remnants of [narsil|E] lie upon the anvil, cold and unyielding. The smith bows low, his face pale in the light of the forge. 'My [liege|E],' he murmurs, 'the ancient alloy refuses to bind. Mundane fire and hammer are not enough to awaken the legacy within.'\n\nHe hesitates, glancing nervously at the guards. 'There is the old way. The [artifact|E] must be quenched in the lifeblood of the [virtuous|E]. A sacrifice of your own [courtiers|E] is required to have a chance to fuse the shards or perhaps we must seek out a more alternative, esoteric reagents to simulate the binding fire, although this is very costly.'"
 nikean_artifact.1001.a: "They will be martyrs for our cause!"
 nikean_artifact.1001.b: "Find another way, anything other than this!"
 nikean_artifact.1001.c: "Now is not the time. Not yet."

 nikean_artifact.1002.t: "The Sinful Quench!"
 nikean_artifact.1002.desc: "The screams echo off the stone walls of the forge, quickly drowned out by the hissing, [sinful|E] roar of hot alloy drinking blood. As the smith lifts the longsword from the crimson trough, the metal hums with a dark, terrible energy.\n\n[narsil|E] is whole once more. Its edge is impossibly sharp, shimmering with a faint, unnatural red hue in the torchlight. The smith falls to his knees, presenting the [artifact|E]. Now, a choice remains: how shall this blood-bound legacy be displayed to the [realm|E]?"
 nikean_artifact.1002.a: "In war, in battle, in blood!"

 nikean_artifact.1003.t: "A Costly Restoration"
 nikean_artifact.1003.desc: "It took vast sums of [gold|E], rare oils from the east, and the tireless, sleepless work of scholars, but the alchemical fire finally burned hot enough.\n\nStriking the anvil with rhythmic precision, the smith folds the ancient shards together. As the alloy cools, it does not sing with the dark power of a blood ritual, but it gleams with a pure, untainted [virtue|E]. \n\n[narsil|E] has been reforged through wealth and wisdom. The smith presents the masterwork, awaiting my decree on its final place of honor."
 nikean_artifact.1003.a: "In war, in battle, in blood!"

 nikean_artifact.1004.t: "An Heirloom Restored!"
 nikean_artifact.1004.desc: "The sacred [artifact|E] [narsil|E] has been restored. The [artifact|E] is whole once more, its edge shimmering with a radiant light that seems to pulse with the essence of our [culture|E].\n\nI force my quivering hands to grip [artifact|E], holding tight this heavy symbol of our renewed [hegemony|E]. As I lift it, a surge of power courses through me, filling me with a sense of invincibility and divine favor. The [artifact|E] is not just a weapon; it is a beacon of hope and a testament to the resilience of our [realm|E].\n\nWith [narsil|E] in hand, I am ready to lead our [nikeis|E] into a new era of glory and conquest. The world will tremble before the might of the [nikeanrealm|E], and our [rivals|E] will know the true meaning of [dread|E] when they see our unity. Most importantly, however, the wider [nikeanrealm|E] now unequivocally considers me the true heir of our forefather [hegemons|E]!\n\nThe notion towards the restoration of the [narsokratia|E] of old is growing ever stronger, and with it, the promise of a glorious [hegemony|E] for all [nikeis|E]!"
 nikean_artifact.1004.a: "I bear the sword!"

 nikean_gunpowder.1001.t: "A New Armament..?"
 nikean_gunpowder.1001.desc: "As [ROOT.Char.GetTitleAsName], it is my duty to provide our [armies|E] with state-of-the-art weaponry. This is a responsibility granted by [ROOT.Char.GetFaith.HighGodName], and entrusted through siege and assault for [ROOT.Char.GetFaith.PositiveAfterLife].\n\nIf [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] is to be protected, our [armies|E] must house more than cold, unrefined weaponries!\n\nWhere are my swift [GetMaA('maa_mastiges').GetName]? Where are clever craftsmen like [Glossary( 'Ars', 'ARS_GLOSS' )], who will forge great death-projectors to spit sparks over my enemies?"
 ARS_GLOSS: "The mythological hero #bold Ars#! is attributed with the lost invention of boom-sticks to emulate thunders on the battlefield."
 nikean_gunpowder.1001.a: "I will put [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to work."
 nikean_gunpowder.1001.b: "Barbarians will make our black powder."
 nikean_gunpowder.1001.c: "Use a powder liable to explode? No."

 nikean_courtiers.0011.t: "A New Sophēs..?"
 nikean_courtiers.0011.desc: "I sink back in my chair and feel drowsiness take me as I hear my [courtiers|E] recount the same idea for the fifteenth time. I need someone, #emp anyone#!, who can tell me about something new, something innovating! And so, I have decided to search for a new hand to assist me in my [court|E].\n\nAfter dispatching messages through [nikean|E] holds, two [nikeis|E] finally show up in [ROOT.Char.GetCapitalLocation.GetName]. They both are two promising candidates, a former [hoplite|E] and a scholar, both [sophes|E] prospects. Both of them are skilled in their own right, in [learning|E] and [martial|E] pursuits, but I can only choose one to join my [court|E]. I must choose wisely or choose none at all."
 nikean_courtiers.0011.a: "I will take [pugilist.GetFirstName] into my [court|E]."
 nikean_courtiers.0011.b: "Perhaps, I will take [savant.GetFirstName] instead."
 nikean_courtiers.0011.d.decline: "None of them suit my needs."
 nikean_courtiers.0011.d.none: "There is no one suitable here."
 nikean_courtiers.0011.d.tt: "These [sophes|E] prospects are dismissed, free to roam the [realm|E] and seek their fortunes elsewhere."