l_english:
 narsokratia_event.flavor: "Our vision of [narsokratia|E] grows ever closer!"
 nikean_intro.1001.t:0 "Gnōthi Seauton"
 nikean_intro.1001.desc:0 "In antiquity, the unquestionable [hegemony|E] of the [nikeanrealm|E] stood at the forefront of civilization. When [nomads|e] and [civil_wars|E] torn our [realm|E] asunder, they believed we were truly destroyed. \n\nThey couldn't be more wrong. \n\nOur last [hegemon|E] did not deign to be the last; with brilliance, he relocated the worthiest of our [prestigious|E] [nobles|E] to dozens of hidden mountain refuges on the fringes of his wider [realm|E]. \n\nIn our absence, the other civilizations of the world scrubbed the [nikeis|E] from history in a brutal ethnocide. Other [cultures|E] had so soon celebrated our obliteration on the wider world to realize their own hubristic delusions about our complete destruction. \n\nAs time passed, the world outside became unrecognizable, but we of the [nikeis|E] endured in our exile. As the [regions|E] around us decayed into barbarism and [tribes|E], we preserved the flame of our [tradition|E], waiting for the perfect moment to return and reclaim our [realms|E]."
 nikean_intro.1001.a:0 "And so time goes on.."

 nikean_intro.1002.t:0 "Gnōthi Seauton"
 nikean_intro.1002.desc:0 "It is perhaps our luck that it is in this [era|E] that we have returned. Strife and [wars|E] in every [region|E] is everpresent and it is nothing but opportunity for the [nikeis|e] and our restoration.\n\nAs I gaze upon the lands, I realize that the road ahead will be long and difficult. Yet still, the world is ours to [control|E], and we shall do so as it is our birthright from the ashes of our ancient [nikean|E] [hegemony|E], recorded in our archiving books, dreamt of and desired by each [nikean|E]!"
 nikean_intro.1002.a:0 "..and we have returned."

 nikean_faith.1001.t: "Psukhês Iatreîon"
 nikean_faith.1001.desc: "The [temple|E] is finally quiet. I stand before the [nikeis|E] altar to the [panteion|E], ready to pour the evening racial. I unstopper the wine and pour it into the offering bowl with such immaculate precision and dramatic flair that it borders on the theatrical.\n\nI strike a heroic pose in the dim light, reciting the sacred hymns with a voice so resonant I briefly impress myself. The wine splashes perfectly, not a single drop wasted on the floorstones.\n\nI feel incredibly pious, and honestly, quite magnificent. It is a tragedy the rest of the [court|E] was not here to witness such perfection in [piety|E]."
 nikean_faith.1001.a: "I am a true gift to the [panteion|E]."

 nikean_faith.1002.t: "Psukhês Iatreîon"
 nikean_faith.1002.desc: "I approach the sacred [temple|E] shrine, exhaustion weighing heavily on my bones. I am supposed to find inner peace in pouring the evening libation to the [panteion|E], but all I can think about is the impending grain shortage and the dreadful smell of my [spymaster|E].\n\nI mechanically unstopper the wine, dump an unceremonious splash into the bowl, and rattle off the prayers of [nikean|E] [tradition|E] at a speed that would make an auctioneer blush.\n\nWell, my [cultural|E] obligation is technically fulfilled. Am I relaxed? Not in the slightest. My shoulders are still as tight as bowstrings. But the heavens cannot say I skipped my chores."
 nikean_faith.1002.a: "Right, next item on the agenda!"

 nikean_faith.1003.t: "Psukhês Iatreîon"
 nikean_faith.1003.desc: "Seeking a moment of respite from [stress|E], I retreat to the nearest [temple|E] offer a solemn libation to the [panteion|E]. I reach for a highly prized amphora of sweet, spiced wine from the southern [regions|E] famed for their vineyards, intending to pour a modest measure into the offering bowl.\n\nBefore I can second-guess my own [sinful|E] blasphemy, I tip the heavy clay jug back and down half of it in one glorious, unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch. \n\nThe crushing [stress|E] of the day vanishes entirely until I realize I will have to pay the [steward|E] to quietly replace this incredibly expensive vintage before my [court_chaplain|E] notices."
 nikean_faith.1003.a: "The [panteion|E] work in mysterious, delicious ways."

 nikean_realm.1001.t: "The Gears of Industry"
 nikean_realm.1001.desc: "Our people may have once been lost and desolate, but no more! It now burns with countless fires of ambition. [buildings|E], [holdings|E], and settlements spring up across the plains, in accordance with the rise of our unstoppable [development|E]. \n\nForges and armouries stockpile weapons for the growing hosts of our [men_at_arms|E] of yore, the [hoplites|E], while smithies and workshops construct ever stronger walls and towers to house the growing [armies|E]. \n\nThe [nikeis|E] of our [realm|E] are restless, and each alley and street yearns for the glorious revival of the [nikeanrealm|E] of antiquity. The [narsokratia|E] will almost be reborn and the hour is nigh!"
 nikean_realm.1001.a: "Let the forges roar!"

 nikean_realm.1011.t: "An All-Seeing Eye"
 nikean_realm.1011.desc: "To maintain rule, the [narsokratia|E] must possess total truth. The flaw of lesser [cultures|E] is that they wait for treason to strike before acting. The [nikeis|E] do not wait. \n\nBy placing our own operatives among the shadows, we turn the weaknesses of the populace into our greatest asset. Every whispered [scheme|E], every illicit [gold|E] traded in the dark, will be cataloged and delivered to the throne before a single blade is drawn. We shall commandeer and establish a sprawling, invisible web beneath the capital. \n\nWe will hear every [secret|E], record every sin, and extinguish every [revolt|E] before it ever draws breath!"
 nikean_realm.1011.a: "A thousand eyes and one!"

 # Success Event
 nikean_gunpowder.1021.t: "[scheme.GetNameNoTooltip]: Success"
 nikean_gunpowder.1021.desc: "Deep in the dusty vaults of my [capital_possessive|E] armory, my [courtiers|E] have finally perfected the volatile mixture of saltpeter, sulfur, and charcoal. Outside, our [armies|E] play host to a terrifying new exercise. Lining up in disciplined ranks, [commoners|E] level their heavy iron tubes at a row of wooden targets. A deafening crack shatters the air, thick white smoke billowing across the field as lead balls obliterate the splintering wood. \n\nMy [marshal|E] deliberate a new [regiment|E]. One that blends the [spearmen|E] and the [gunpowder|E], eliminating their weaknesses and countering [heavy_infantry|E] and [heavy_cavalry|E] alike. \n\nMy [rivals|E] will soon learn to fear the thunder of our new [regiment|E] and our [region|E] will quake under the pike and shot of our new [soldiers|E], the [mastiges|E]!"
 nikean_gunpowder.1021.a: "A new era dawns!"
 nikean_gunpowder.1021.a.mastiges_tt: "#v You#! unlock the recruitment of the [GetMaA('maa_mastiges').GetName] [men_at_arms|E]"
 
 # Fail Event
 nikean_gunpowder.1022.t: "[scheme.GetNameNoTooltip]: Failure"
 nikean_gunpowder.1022.desc: "Hellfire! Hellfire!\n\nAn uncontrollable, roaring inferno swallows my [capital_possessive|E] armory. As shrieking alchemists flee the collapsing masonry, I am forced to think upon all the chaotic tinctures, the volatile powders, and the [courtiers|E] lost in this doomed venture..\n\nHow could such a demonic substance #EMP ever#! be safely contained within an iron tube? It seems mastering this substance is nothing but a deadly fantasy for our [realm|E]. For now, at least."
 nikean_gunpowder.1022.a: "I suppose we will have to stick to [hoplites|E] now.."
 
 nikean_titles.2021.t: "Nenikḗkamen..!"
 nikean_titles.2021.desc: "Not since antiquity have we [nikeis|E] stood united beneath a single banner. Guided by one purpose, one vision. A true [narsokratia|E].\n\nFrom every corner of the world, [GetReligionByKey('nikean_religion').GetAdherentNamePluralNoTooltip] now travel to [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Pilgrims and [rulers|E], scholars and [soldiers|E]. From distant deserts and crowded ports, from every school and [temples|E], they gather before me to bow their heads, to pledge their hearts.\n\nOnly time will tell if this [hegemony|E] will last or if it is doomed to fade into history once more. For now, the plentitudes no matter [noble|E] or [commoner|E] will know the peace of the [panteion|E]."
 nikean_titles.2021.a: "Ktêma es Aeí!"

 nikean_titles.2022.t: "Ánthrōpos Métron!"
 nikean_titles.2022.desc: "Today, I call all [nikeis|E] to declare the realization of our [cultural|E] [hegemony|E], the legitimate absolution of [narsokratia|E]. We can no longer view ourselves as a mere [realm|E] competing on the world's ever many [counties|E]. Blessed with inhuman grace and unquestionable [legitimacy|E], we are the [hegemons|E].\n\nFrom this day forward, any [realm|E] or [region|E] that resists us is not a [rival|E] power, but a [revolt|E] resisting the inevitable march of our nigh-perfect [government|E]. \n\nUnder the rule of the [nikeis|E], every [region|E] will finally know true, universal pacification. Under the rule of the [panteion|E], every [character|E] will finally know true, universal salvation." 
 nikean_titles.2022.a: "One [law|E], One [hegemony|E]!"
 
 nikean_titles.2011.t:0 "Mēdèn Ága!"
 nikean_titles.2011.desc: "For untold time after our exile from the known world, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereign [hegemonies|E]. Today, I elevate our [realm|E] to an absolute $Ōtarkhia$. The true [nikeanrealm|E] is awake and rising. That much, is undeniable for all to see, for [commoners|E] and [nobles|E] alike. \n\nThe pretender [empires|E] will soon realize that they are nothing more than temporary [stewards|E] of our historical [domains|E], simply sitting themselves to keep the throne warm for their rightful [rulers|E]. We, the [nikeis|E], stand above them, blessed with a grace and perfection they can only ever envy." 
 nikean_titles.2011.a: "A step further! A step to [glory|E]!"

 nikean_titles.2001.t: "Métron Áriston!"
 nikean_titles.2001.desc: "The squabbling [rulers|E] of this [era|E] mistake their disorganized [domains|E] for true [realms|E]. \n\nToday, as a new [ROOT.Char.GetTitleAsNameNoTooltip], I formalize our [nikean|E] rule, enacting our [cultural|E] [tradition|E] and proclaiming the foundation of a new Despotēia of [narsokratia|E]. Perhaps when our neighbouring foreign [nobles|E] send their heralds in their crude fabrics, they'll look upon our radiant [court|E] with a mix of absolute awe and [dread|E]. \n\nIn our toils, we form our own [narsokratia|E], a [succession|E] from the ancient [nikeis|E] [hegemonies|E]. To bring our [legitimate|E] [claim|E] to this chaotic [region|E]. To be the epicenter of a new [nikean|E] [realm|E]." 
 nikean_titles.2001.a: "The first step; never the last!"

 nikean_artifact.1001.t: "A Horrifying Dilemma..?"
 nikean_artifact.1001.desc: "The shattered remnants of [narsil|E] lie upon the anvil, cold and unyielding. The smith bows low, his face pale in the light of the forge. 'My [liege|E],' he murmurs, 'the ancient alloy refuses to bind. Mundane fire and hammer are not enough to awaken the legacy within.'\n\nHe hesitates, glancing nervously at the guards. 'There is the old way. The [artifact|E] must be quenched in the lifeblood of the [virtuous|E]. A sacrifice of your own [courtiers|E] is required to have a chance to fuse the shards or perhaps we must seek out a more alternative, esoteric reagents to simulate the binding fire, although this is very costly.'"
 nikean_artifact.1001.a: "They will be martyrs for our cause!"
 nikean_artifact.1001.b: "Find another way, anything other than this!"
 nikean_artifact.1001.c: "Now is not the time. Not yet."

 nikean_artifact.1002.t: "The Man with the Iron Heart"
 nikean_artifact.1002.desc: "The screams echo off the stone walls of my [capital_possessive|E] foremost foundry, quickly drowned out by the hissing, [sinful|E] roar of hot alloy drinking the blood of my recent [courtier|E]. \n\nAs the smith lifts the longsword from the crimson trough, the metal hums with a dark, terrible energy. [narsil|E] is whole once more. Its edge is impossibly sharp, shimmering with a faint, unnatural red hue in the torchlight. The smith falls to his knees, presenting the [artifact|E] to my hands. \n\nNow you ask yourself, how shall this blood-bound legacy be displayed to the [realm|E], to your [narsokratia|E] and fellow [nikeis|E]?"
 nikean_artifact.1002.a: "#emp "However I kraffing want, of course!"#!"

 nikean_artifact.1003.t: "A Costly Restoration"
 nikean_artifact.1003.desc: "It took vast sums of [gold|E], rare oils from the east, and the tireless, sleepless work of scholars, but the alchemical fire finally burned hot enough.\n\nStriking the anvil with rhythmic precision, the smith folds the ancient shards together. As the alloy cools, it does not sing with the dark power of a blood ritual, but it gleams with a pure, untainted [virtue|E]. \n\n[narsil|E] has been reforged through wealth and wisdom. The smith presents the masterwork, awaiting my decree on its final place of honor."
 nikean_artifact.1003.a: "#emp "However I kraffing want, of course!"#!"

 nikean_artifact.1004.t: "An Heirloom Restored!"
 nikean_artifact.1004.desc: "The sacred [artifact|E] [narsil|E] has been restored. The [artifact|E] is whole once more, its edge shimmering with a radiant light that seems to pulse with the essence of our [culture|E].\n\nI force my quivering hands to grip [artifact|E], holding tight this heavy symbol of our renewed [hegemony|E]. As I lift it, a surge of [prowess|E] courses through me, filling me with the vision of our [panteion_possessive|E] favor. The [artifact|E] is not just a weapon; it is a beacon of hope and a testament to the resilience of our [realm|E].\n\nWith [narsil|E] in hand, I am ready to lead our [nikeis|E] into a new era of glory and conquest. The world will tremble before the might of the [nikeanrealm|E], and our [rivals|E] will know the true meaning of [dread|E] when they see our unity. Most importantly, however, the wider [nikeanrealm|E] now unequivocally considers me the true heir of our old [hegemons|E]!\n\nThe notion towards the restoration of the [narsokratia|E] of old is growing ever stronger, and with it, the promise of a glorious [hegemony|E] for all [nikeis|E]!"
 nikean_artifact.1004.a: "I bear the sword!"

 nikean_gunpowder.1001.t: "Khalepà tà Kalá"
 nikean_gunpowder.1001.desc: "As [ROOT.Char.GetTitleAsName], it is my duty to provide our [armies|E] with state-of-the-art weaponry. This is a responsibility granted by our [panteion|E]. If [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] is to be protected, our [armies|E] must house more than cold weaponries. We must develop firearms. \n\nAlready, my [marshal|E] is forming the plans for a new [regiment|E], the [GetMaA('maa_mastiges').GetName]. A mix of [spearmen|E] and [gunpowder|E], they are the successors of the [hoplites|E] and will be formidable for the [wars|E] to come.\n\nHowever in researching this volatile substance, do I entrust my [courtiers|E] to concoct it independently, or do I hire a foreign barbarian to do the dirty work for me? The former is risky, but the latter is costly. I must choose wisely."
 nikean_gunpowder.1001.a: "I will put [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to work."
 nikean_gunpowder.1001.b: "Barbarians will make our black powder."
 nikean_gunpowder.1001.c: "Use a powder liable to explode? No."

 nikean_courtiers.0011.t: "A New Sophēs..?"
 nikean_courtiers.0011.desc: "I sink back in my chair and feel drowsiness take me as I hear my [courtiers|E] recount the same idea for the fifteenth time. I need someone, #emp anyone#!, who can tell me about something new, something innovating! And so, I have decided to search for a new hand to assist me in my [court|E].\n\nAfter dispatching messages through [nikean|E] holds, two [nikeis|E] finally show up in [ROOT.Char.GetCapitalLocation.GetName]. They both are two promising candidates, a former [hoplite|E] and a scholar, both [sophes|E] prospects. Both of them are skilled in their own right, in [learning|E] and [martial|E] pursuits, but I can only choose one to join my [court|E]. I must choose wisely or choose none at all."
 nikean_courtiers.0011.a: "I will take [pugilist.GetFirstName] into my [court|E]."
 nikean_courtiers.0011.b: "Perhaps, I will take [savant.GetFirstName] instead."
 nikean_courtiers.0011.d.decline: "None of them suit my needs."
 nikean_courtiers.0011.d.none: "There is no one suitable here."
 nikean_courtiers.0011.d.tt: "These [sophes|E] prospects are dismissed, free to roam the [realm|E] and seek their fortunes elsewhere."

 # Nikean Faith
 nikean_faith.1011.t: "Aeì Ho Theòs Geōmetreî!"
 nikean_faith.1011.desc: "The heralds the [court|E] dispatched have finally returned with their exhaustingly detailed reports. To my surprise, it appears the [commoners|E] have actually been listening.\n\nAcross the [realm|E], brand new [temple|E] shrines to the [panteion|E] now echo with the chants of our [orphic|E] [faith|E], replacing whatever gibberish foreign [languages|E] they were shouting before. Granted, half the [lowborn|E] are mispronouncing the scriptures, and I am fairly certain they still pray to their old harvest spirits when my [tax_collectors|E] aren't looking. The deep roots of stubborn [traditions|E] do not wither overnight, after all. \n\nThe [nikeis|E] [faith|E] is spreading like a blazing flame or at least, the realization that worshipping the [panteion|E] is highly correlated with staying out of the [dungeon|E] is spreading. The best part? I finally only have to pretend to care about one set of [cultural|E] holidays."
 nikean_faith.1011.a: "One [realm|E], One [culture|E], One [faith|E]!"

 nikean_faith.1021.t: "A Surplus of Perfection"
 nikean_faith.1021.desc: "I stand before the mirror in my chambers, admiring the flawless contour of my jawline. It strikes me suddenly; what a profound tragedy it is that our current traditions restrict a [ruler|E] of my [prestige|E] to a single [spouse|E].\n\nIs it not incredibly selfish of me to hoard such magnificence? The potential of my [marriage|E] is being tragically bottlenecked by outdated, peasant-minded notions of monogamy. The heavens clearly sculpted [nikean|E] [lieges|E] to be shared.\n\nI immediately issue an imperial decree redefining sacred [doctrines|E]. The only question that remains is exactly how much of my perfection the [realm|E] is prepared to handle."
 nikean_faith.1021.a: "Bigamy. A perfect, duality of devotion."
 nikean_faith.1021.b: "Bah..! Might as well get three!"

 nikean_faith.1031.t: "Mustérion tês Písteōs.."
 nikean_faith.1031.desc: "I am told by my [virtuous|E] vestal in front that if I ponder the [panteion|E] deeply enough, a profound burst of [piety|E] will reveal which patron God is meant to guide my [dynasty|E].\n\nThe choices are certainly imposing. Do I dedicate myself to [narses|E], whose dominion over [learning|E] sounds suspiciously like an invitation to do more paperwork? Do I seek the favor of [phokas|E] to ensure my coffers remain full enough to bribe my [rivals|E]? Or do I embrace [enuo|E], who promises glorious [wars|E] and boundless [fertility|E]; both of which sound like a dreadful amount of physical exertion. Well, perhaps I'll flip a coin to [decide|E]..? Wait, that #emp probably#! won't work, now would it?"
 nikean_faith.1031.a: "My mind drifts to [narses|E], to [learning|E]."
 nikean_faith.1031.b: "[phokas|E]' focus on levities are quite amusing!"
 nikean_faith.1031.c: "My blood boils for [enuo|E]. For #emp me#! to let loose..?"
 nikean_faith.1031.optout:0 "I am not #emp yet#! ready to decide."
 nikean_faith.1031.flavor:0 "There is no shame in waiting until I am certain."


 nikean_faith.1041.t: "Evangelizing the [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 nikean_faith.1041.desc: "Haivēn's serenity belongs to the faithful scholars, but our neighbor, [pagan.GetTitledFirstName], is blissfully unaware of it, and persists in believing in [pagan.GetHerHis] superstitions and false [religions|E].\n\nSaving [pagan.GetHerHis] soul and those of [pagan.GetHerHis] [realm_possessive|E] people is a [virtuous|E] endeavor in itself, but there also #EMP earthly#! advantages to their conversion. For starters, reducing their hostility towards us and bringing them into our own sphere of influence.\n\nMy chosen missionary, [evangelizer.GetFirstName], is ready to go."
 nikean_faith.1041.a: "May the [panteion|E] guide you!"
 nikean_faith.1041.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital."
 nikean_faith.1043.desc: "Emissaries from our neighbors come and go frequently enough that they all mix together in my mind. However, today's [nikean|E] envoy sticks out like none before.\n\n[evangelizer.GetSheHe|U] seems to be some sort of holy [evangelizer.GetWomanMan], for starters, and instead of advancing political demands, this [evangelizer.GetFirstName] preaches of an omnipotent God, honored in temples of gold and silver that always smell of incense."
 nikean_faith.1043.a: "Please, tell me more."
 nikean_faith.1043.a.tt: "You create an [alliance|E] with [evangelizer.GetTitledFirstNamePossessiveNoTooltip] liege, [sender.GetTitledFirstName]"
 nikean_faith.1043.b: "We don't need new gods."
 nikean_faith.1043.c: "Ridiculous blasphemy!"
 nikean_faith.1043.c.tt: "This is sure to send a message: your preachers are not welcome here! But we should be ready for retaliation..."
 nikean_faith.1046.desc_new: "My predecessor [sender.GetFirstName] had invested into the evangelism of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] missionary [evangelizer.GetFirstName], in fact, has just returned."
 nikean_faith.1046.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring the knowledge of God to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back to [court|E] today, as I've been eagerly waiting for [evangelizer.GetHerHis] report.\n\nThe success of this mission could mean a great expansion of our [faith|E] and influence, but failure would be a great blow to our [realm_possessive|E] [relations|E] and the [panteion|E]'s reputation."
 nikean_faith.1046.desc_success: "\n\n"I bring great news, my liege! [pagan.GetTitledFirstName|U] was eager to hear the Glad Tidings, and converted to [evangelizer.GetFaith.GetName], accompanied by many of [pagan.GetHerHis] people.", [evangelizer.GetFirstName] said with a triumphant smile on [evangelizer.GetHerHis] face."
 nikean_faith.1046.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of God, and sent me away empty-handed.", [evangelizer.GetFirstName] said with a forced smile on [evangelizer.GetHerHis] face."
 nikean_faith.1046.a: "Excellent!"
 nikean_faith.1046.b: "It's only a temporary setback."
 nikean_faith.1047.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my missionary [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of God!"
 nikean_faith.1047.a: "Outrageous!"
 nikean_faith.1046.a.tt: "You create an [alliance|E] with the newly-converted [pagan.GetTitledFirstName]."
 nikean_faith.1044.t: "" #AI event, leave empty
 nikean_faith.1044.desc: "" #AI event, leave empty
 nikean_faith.1044.a: "" #AI event, leave empty

 nikean_bookmark.0010.t: "Sautòn Isthí: $Eleios$"
 nikean_bookmark.0010.desc: "Some months ago, the death of my pious father, [alnars|E], had chipped off [GetTitleByKey('d_laamp_nars_1001').GetNameNoTier] into another two [mercenary|E] [camps|E] headed by my siblings. Alas, perhaps it was a hidden blessing that the schism happened for they ascribe to themselves to a new [tradition|E] wholly unfamiliar to us, [followers|E] of [alnars_adj|E] beliefs. \n\nNo matter however, the road to a [nikean|E] [hegemony|E] can be taken by other roads just as well. My position as [heir|E] to [GetTitleByKey('d_laamp_nars_1001').GetNameNoTier] however have given me a number of boons to aid in our road of struggle to proclaim a [narsokratia|E]. \n\nI #EMP must#! take any advantage I possess to safeguard the future of my people!"
 nikean_bookmark.0010.a: "#emp "This [artifact|E] had always been my birthright!"#!"
 nikean_bookmark.0010.b: "#emp "I must expand our numbers.."#!"
 nikean_courtiers.tt: "You recruit a significant number of [nikeans|E] under your current [adventurer|E] [camp|E], bolstering your [followers|E]"
 nikean_diplomacy.tt: "You send entreaties to $Ilione$'s and $Strato$'s [adventurer|E] [camps|E] to join yours as [followers|E]\n@alert_icon! #alert_trial They are able to refuse your request!#!"
 nikean_diplomacy_both_join_toast_t: "The $Naresios$ Reunited"
 nikean_diplomacy_both_join_toast_tt: "Both $Ilione$ and $Strato$ have accepted your entreaties. Their camps will merge with yours."
 nikean_diplomacy_ilione_joins_toast_t: "$Ilione$ Accepts"
 nikean_diplomacy_ilione_joins_toast_tt: "$Ilione$ has agreed to follow your banner, but $Strato$ stubbornly refuses."
