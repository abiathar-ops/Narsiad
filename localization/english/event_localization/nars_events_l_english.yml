l_english:
 narsokratia_event.flavor: "The vision of Narsokratía grows ever closer!"

 nars_intro.0001.t: "Kakías Apékhou"
 nars_intro.0001.desc: "Tales nearby tells of three progenies of the famed [alnars|E], all three [characters|E] gleaming with silvery-locks alongside unusual features that are rarely seen in this [region|E] or even anywhere for that matter. These... [knoss|E] moonlighting as [mercenaries|E] and [adventurers|E] are as they are known themselves: [eleios.GetFirstNameNicknamedNoTooltipRegnal], [ilione.GetFirstNameNicknamedNoTooltipRegnal], and [strato.GetFirstNameNicknamedNoTooltipRegnal]. Their intentions are unknown and yet whispers are abound of their patriarch's demise, [alnars.GetFirstNameNicknamedNoTooltipRegnal], which would be catastrophic to the unity of their late father's camp. A schism is coming, that much is certain."
 nars_intro.0001.a: "I wonder what destiny lies before [eleios.GetFirstNamePossessive] path..."
 nars_intro.0001.b: "[ilione.GetFirstNamePossessive] bloodstained destiny compels me..."
 nars_intro.0001.c: "The spider weaves curtains for [strato.GetFirstNamePossessive] whims..."
 nars_intro.0001.d: "Intriguing... but alas, it is mere tall tales."

 nars_intro.1001.t:0 "Gnōthi Seauton"
 nars_intro.1001.desc:0 "In antiquity, the unquestionable [hegemony|E] of the [knosrealm|E] stood at the forefront of civilization. When [nomads|e] and [civil_wars|E] torn our [realm|E] asunder, they believed we were truly destroyed. \n\n#v They couldn't be more wrong.#! \n\nOur last [hegemon|E] did not deign to be the last; with brilliance, he relocated the worthiest of our [prestigious|E] [nobles|E] to dozens of hidden mountain refuges on the fringes of his wider [realm|E]. \n\nIn our absence, the other civilizations of the world scrubbed the [minoes|E] from history in a brutal ethnocide. Other [cultures|E] had so soon celebrated our obliteration on the wider world to realize their own hubristic delusions about our complete destruction. \n\nAs time passed, the world outside became unrecognizable, but we of the [minoes|E] endured in our exile. As the [regions|E] around us decayed into barbarism and [tribes|E], we preserved the flame of our [tradition|E], waiting for the perfect moment to return and reclaim our [realms|E]."
 nars_intro.1001.a:0 "And so time goes on..."
 nars_intro.1001.b: "The time for our restoration is nigh!"

 nars_intro.1002.t:0 "Gnōthi Seauton"
 nars_intro.1002.desc:0 "It is perhaps our luck that it is in this [era|E] that we have returned. Strife and [wars|E] in every [region|E] is everpresent and it is nothing but opportunity for the [minoes|e] and our restoration.\n\nAs I gaze upon the lands, I realize that the road ahead will be long and difficult. Yet still, the world is ours to [control|E], and we shall do so as it is our birthright from the ashes of our ancient [knos|E] [hegemony|E], recorded in our archiving books, dreamt of and desired by each [knos|E]!"
 nars_intro.1002.a:0 "...and we have returned."

 nars_intro.0002.t:0 "Gnōthi Seauton"
 nars_intro.0002.desc:0 "The recent death of my pious father, [alnars|E], had chipped off [GetTitleByKey('d_laamp_nars_1001').GetNameNoTier]."
 nars_intro.0002.eleios:0 "\n\nMy siblings, blinded by arrogance, have thrown away our old ways and tradition. $Ilione$ would see our people bleed as mindless sellswords for foreign coin, while $Strato$ weaves craven webs in the shadows, forgetting the honor of our ancestors. The true destiny of an [knos|E] is not to wander as outcasts or hide as spies, but to claim lands and forge a lasting [narsokratia|E]."
 nars_intro.0002.ilione:0 "\n\nMy brothers scramble for power like dogs fighting over a bone. $Eleios$ dreams of tying us to the dirt with his settled [narsokratia|E], while $Strato$ cowers in the shadows of foreign courts. Fools, them both. The essence of an [knos|E] lies not in statecraft or [intrigue|E], but in [martial|E] [prowess|E]."
 nars_intro.0002.strato:0 "\n\nMy siblings, blinded by hubris, took their [faction|E] in opposite directions. $Eleios$ marches openly, seeking a bloody [hegemony|E], while $Ilione$ sells our people's honor to the highest bidder for their wretched wars. They do not see the truth: we are vastly outnumbered. A [knos|E] spear can pierce armor, but a whispered secret can topple an [empire|E] without a single casualty of our own."
 nars_intro.0002.end:0 "\n\nI must make a decision: convince them of my leadership, both [target_1.GetFirstName] and [target_2.GetFirstName], or... to break away completely, removing all pretense from our now fragmented [camp|E] built by [alnars.GetFirstNameNicknamedNoTooltipRegnal]."
 nars_intro.0002.a: "There is still hope yet for our unity..."
 nars_intro.0002.b: "Our boons will be #emp requisitioned#! for my use!"
 nars_intro.0002.c: "I will splinter away, yes, but I will not estrange my siblings."

 nars_faith.1001.t: "Psukhês Iatreîon"
 nars_faith.1001.desc: "The [temple|E] is finally quiet. I stand before the [minoes|E] altar to the [panteion|E], ready to pour the evening racial. I unstopper the wine and pour it into the offering bowl with such immaculate precision and dramatic flair that it borders on the theatrical.\n\nI strike a heroic pose in the dim light, reciting the sacred hymns with a voice so resonant I briefly impress myself. The wine splashes perfectly, not a single drop wasted on the floorstones.\n\nI feel incredibly pious, and honestly, quite magnificent. It is a tragedy the rest of the [court|E] was not here to witness such perfection in [piety|E]."
 nars_faith.1001.a: "I am a true gift to the [panteion|E]."

 nars_faith.1002.t: "Psukhês Iatreîon"
 nars_faith.1002.desc: "I approach the sacred [temple|E] shrine, exhaustion weighing heavily on my bones. I am supposed to find inner peace in pouring the evening libation to the [panteion|E], but all I can think about is the impending grain shortage and the dreadful smell of my [spymaster|E].\n\nI mechanically unstopper the wine, dump an unceremonious splash into the bowl, and rattle off the prayers of [knos|E] [tradition|E] at a speed that would make an auctioneer blush.\n\nWell, my [cultural|E] obligation is technically fulfilled. Am I relaxed? Not in the slightest. My shoulders are still as tight as bowstrings. But the heavens cannot say I skipped my chores."
 nars_faith.1002.a: "Right, next item on the agenda!"

 nars_faith.1003.t: "Psukhês Iatreîon"
 nars_faith.1003.desc: "Seeking a moment of respite from [stress|E], I retreat to the nearest [temple|E] offer a solemn libation to the [panteion|E]. I reach for a highly prized amphora of sweet, spiced wine from the southern [regions|E] famed for their vineyards, intending to pour a modest measure into the offering bowl.\n\nBefore I can second-guess my own [sinful|E] blasphemy, I tip the heavy clay jug back and down half of it in one glorious, unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch. \n\nThe crushing [stress|E] of the day vanishes entirely until I realize I will have to pay the [steward|E] to quietly replace this incredibly expensive vintage before my [court_chaplain|E] notices."
 nars_faith.1003.a: "The [panteion|E] work in mysterious, delicious ways."

 nars_realm.1001.t: "Philósophos Gínou: Industry"
 nars_realm.1001.desc: "Our people may have once been lost and desolate, exiled and damned, but no more! They now burn with countless fires of ambition and [virtuous|E] diligence. [buildings|E], [holdings|E], and [cities|E] spring up across the plains, in accordance with the rise of our unstoppable [development|E]. \n\nForges and armouries stockpile weapons for the growing hosts of our [men_at_arms|E] of yore, the [hoplites|E], while smithies and workshops construct ever stronger walls and towers to house the growing [armies|E]. \n\nThe [minoes|E] of our [realm|E] are restless, and each alley and street yearns for the glorious revival of the [hegemony|E] of antiquity. Our blessed [narsokratia|E] is destined to be reborn and the hour is nigh for its restoration!"
 nars_realm.1001.a: "Let the forges roar!"
 industrial_boom_province_tt: "Your [counties|E] gain a [modifier|E] that boosts [men_at_arms|E] and [development|E] growth!"
 nars_realm.1001.b: "Not yet."

 nars_realm.1011.t: "Philósophos Gínou: Synods"
 nars_realm.1011.desc: "To maintain rule, the [narsokratia|E] must possess total truth. The flaw of lesser [cultures|E] is that they wait for treason to strike before acting. The [minoes|E] do not wait. \n\nBy placing our own operatives among the shadows, we turn the weaknesses of the populace into our greatest asset. Every whispered [scheme|E], every illicit [gold|E] traded in the dark, will be cataloged and delivered to the throne before a single blade is drawn. We shall commandeer and establish a sprawling, invisible web beneath the capital. \n\nWe will hear every [secret|E], record every sin, and extinguish every [revolt|E] before it ever draws breath!"
 nars_realm.1011.a: "Our thousand eyes and one!"
 spy_network_province_tt: "Your [counties|E] gain a [modifier|E] that boosts [control|E] growth!"
 nars_realm.1011.b: "Not yet."
 
 nars_realm.1021.t: "Philósophos Gínou: Propaganda"
 nars_realm.1021.desc: "A true [narsokratia|E] is not forged by the spear and the shadow alone; it requires the fervent devotion of the masses. The [commoners|E] are simple creatures, easily swayed by grand tales and gleaming marble.\n\nBy dispatching our most silver-tongued orators and poets to our [holdings|E], we shall weave a compelling narrative of [minoes|E] supremacy. We will tell them of our holy mandate, of the golden age of antiquity that we bring back, and of the unmatched benevolence of their masters.\n\nLet the streets ring with fabricated glories and embellished histories. When the people believe our reign is ordained by the [panteion|E] itself, their loyalty will be unshakable, and their cheers will drown out any whisper of dissent!"
 nars_realm.1021.a: "Tell them a thousand lies and it will be truth."
 knos_propaganda_province_tt: "Your [counties|E] gain a [modifier|E] that boosts [county_opinion|E]!"
 nars_realm.1021.b: "Not yet."
 
 #Gunpowder
 nars_gunpowder.1001.t: "Khalepà tà Kalá"
 nars_gunpowder.1001.desc: "As [ROOT.Char.GetTitleAsName], it is my duty to provide our [armies|E] with state-of-the-art weaponry. This is a responsibility granted by our [panteion|E]. If [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] is to be protected, our [armies|E] must house more than cold weaponries. We must develop firearms. \n\nAlready, my [marshal|E] is forming the plans for a new [regiment|E], the [GetMaA('maa_mastiges').GetName]. A mix of [spearmen|E] and [gunpowder|E], they are the successors of the [hoplites|E] and will be formidable for the [wars|E] to come.\n\nHowever in researching this volatile substance, do I entrust my [courtiers|E] to concoct it independently, or do I hire a foreign barbarian to do the dirty work for me? The former is risky, but the latter is costly. I must choose wisely."
 nars_gunpowder.1001.a: "I will put [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to work."
 nars_gunpowder.1001.b: "Barbarians will make our black powder."
 nars_gunpowder.1001.c: "Use a powder liable to explode? No."

 nars_gunpowder.1021.t: "[scheme.GetNameNoTooltip]: Success"
 nars_gunpowder.1021.desc: "Deep in the dusty vaults of my [capital_possessive|E] armory, my [courtiers|E] have finally perfected the volatile mixture of saltpeter, sulfur, and charcoal. Outside, our [armies|E] play host to a terrifying new exercise. Lining up in disciplined ranks, [commoners|E] level their heavy iron tubes at a row of wooden targets. A deafening crack shatters the air, thick white smoke billowing across the field as lead balls obliterate the splintering wood. \n\nMy [marshal|E] deliberate a new [regiment|E]. One that blends the [spearmen|E] and the [gunpowder|E], eliminating their weaknesses and countering [heavy_infantry|E] and [heavy_cavalry|E] alike. \n\nMy [rivals|E] will soon learn to fear the thunder of our new [regiment|E] and our [region|E] will quake under the pike and shot of our new [soldiers|E], the [mastiges|E]!"
 nars_gunpowder.1021.a: "A new era dawns!"
 nars_gunpowder.1021.a.mastiges_tt: "#v You#! unlocked  [GetMaA('maa_mastiges').GetName] [men_at_arms|E]"
 
 # Fail Event
 nars_gunpowder.1022.t: "[scheme.GetNameNoTooltip]: Failure"
 nars_gunpowder.1022.desc: "Hellfire! Hellfire!\n\nAn uncontrollable, roaring inferno swallows my [capital_possessive|E] armory. As shrieking alchemists flee the collapsing masonry, I am forced to think upon all the chaotic tinctures, the volatile powders, and the [courtiers|E] lost in this doomed venture...\n\nHow could such a demonic substance #EMP ever#! be safely contained within an iron tube? It seems mastering this substance is nothing but a deadly fantasy for our [realm|E]. For now, at least."
 nars_gunpowder.1022.a: "Craven..."

 nars_titles.0001.t: "Ánthrōpos Métron!"
 nars_titles.0001.desc: "Today, I call all [minoes|E] to declare the realization of our [cultural|E] [hegemony|E], the [narsokratia|E] remade. We can no longer view ourselves as a mere [realm|E] competing on the world's ever many [counties|E]. Blessed with inhuman grace and unquestionable [legitimacy|E], we are the [hegemons|E]. From this day forward, any [realm|E] or [region|E] that resists us is not a [rival|E] power, but a [revolt|E] resisting the inevitable march of our nigh-perfect [hegemony|E], our reborn realm of antiquity. \n\nUnder the rule of the [minoes|E], every [region|E] will finally know true, universal pacification. Under the rule of the [panteion|E], every [character|E] will finally know true, universal salvation." 
 nars_titles.0001.a: "Hépou theôi..."
 
 nars_artifacts.1001.t: "Kairòn Gnôthi: Dillema"
 nars_artifacts.1001.desc: "The shattered remnants of [narsil|E] lie upon the anvil, cold and unyielding. The smith bows low, his face pale in the light of the forge. "My liege," he murmurs, "...the ancient alloy refuses to bind. Our fiercest forges and kilns are not capable enough to stoke the flame capable of binding the shattered shards."\n\nHe hesitates, glancing nervously at the guards. "There is a much older way, documented in esoteric scrolls of the ancient [orphic|E] texts. The [artifact|E] must be quenched in the lifeblood of an [knos|E] gained from a ritual." \n\n"A sacrifice of an [minoes|E], one of your own [courtiers|E] is required to have a chance to fuse the shards or perhaps we may seek out costly reagents to stimulate our foundries.""
 nars_artifacts.1001.a: "They will be martyrs for our cause..."
 nars_artifacts.1001.b: "Find another way, anything other than this!"
 nars_artifacts.1001.c: "Now is not the time."

 nars_artifacts.1002.t: "Kairòn Gnôthi: Cruelty"
 nars_artifacts.1002.desc: "The screams of [courtiers|E] that used to admire me echoes off of the stone walls of my [capital_possessive|E] foremost foundry. The gurgles and moans of the meek victims are quickly drowned out by the hissing, [sinful|E] roar of hot alloy shards drinking the blood of my recent sacrifices, my own [courtiers|E]. \n\nAs the smith lifts the longsword from the crimson trough, the metal hums with a dark, terrible energy. [narsil|E] is whole once more. Its edge is impossibly sharp, shimmering with a faint, unnatural red hue in the torchlight. The smith falls to his knees, presenting the [artifact|E] to my hands. \n\nNow you ask yourself, how shall this blood-bound legacy be displayed to the [realm|E], to your [narsokratia|E] and fellow [minoes|E]?"
 nars_artifacts.1002.a: "However I desire, of course!"

 nars_artifacts.1003.t: "Kairòn Gnôthi: Mercy"
 nars_artifacts.1003.desc: "It took vast sums of [gold|E], rare oils from the east, and the tireless, sleepless work of scholars, but the alchemical fire finally burned hot enough.\n\nStriking the anvil with rhythmic precision, the smith folds the ancient shards together. As the alloy cools, it does not sing with the dark power of a blood ritual, but it gleams with a pure, untainted [virtue|E]. \n\n[narsil|E] has been reforged through wealth and wisdom. The smith presents the masterwork, awaiting my decree on its final place of honor."
 nars_artifacts.1003.a: "However I desire, of course!"
 
 nars_courtiers.0001.t: "An Knōs Arrives"
 nars_courtiers.0001.desc: "A new Knōs has arrived at [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]!"

 nars_courtiers.0011.t: "Engúa Pára d' Áta"
 nars_courtiers.0011.desc: "I sink back in my chair and feel drowsiness take me as I hear my [courtiers|E] recount the same idea for the fifteenth time. I need someone, #emp anyone#!, who can tell me about something new, something innovating! And so, I have decided to search for a new hand to assist me in my [court|E].\n\nAfter dispatching messages through [knos|E] holds, two [minoes|E] finally show up in [ROOT.Char.GetCapitalLocation.GetName]. They both are two promising candidates, a former [hoplite|E] and a scholar, both [polymetis|E] prospects. Both of them are skilled in their own right, in [learning|E] and [martial|E] pursuits, but I must be fiscally prudent with my [gold|E] especially as a [ruler|E]. I must choose wisely now!"
 nars_courtiers.0011.a: "I will take [pugilist.GetFirstName]."
 nars_courtiers.0011.b: "Perhaps, I will take [savant.GetFirstName] instead."
 nars_courtiers.0011.d.decline: "None of them suit my needs."
 nars_courtiers.0011.d.none: "There is no one suitable here."
 nars_courtiers.0011.c: "Perhaps I'll take both!"
 nars_courtiers.0011.d.tt: "These [polymetis|E] prospects are dismissed, free to roam the [realm|E] and seek their fortunes elsewhere."

 # Knōs Faith
 nars_faith.1011.t: "Aeì Ho Theòs Geōmetreî!"
 nars_faith.1011.desc: "The heralds the [court|E] dispatched have finally returned with their exhaustingly detailed reports. To my surprise, it appears the [commoners|E] have actually been listening.\n\nAcross the [realm|E], brand new [temple|E] shrines to the [panteion|E] now echo with the chants of our [orphic|E] [faith|E], replacing whatever gibberish foreign [languages|E] they were shouting before. Granted, half the [lowborn|E] are mispronouncing the scriptures, and I am fairly certain they still pray to their old harvest spirits when my [tax_collectors|E] aren't looking. The deep roots of stubborn [traditions|E] do not wither overnight, after all. \n\nThe [minoes|E] [faith|E] is spreading like a blazing flame or at least, the realization that worshipping the [panteion|E] is highly correlated with staying out of the [dungeon|E] is spreading. The best part? I finally only have to pretend to care about one set of [cultural|E] holidays."
 nars_faith.1011.a: "One realm, One people, One faith!"

 nars_faith.1031.t: "Mustérion tês Písteōs..."
 nars_faith.1031.desc: "I am told by my [virtuous|E] vestal in front that if I ponder the [panteion|E] deeply enough, a profound burst of [piety|E] will reveal which patron God is meant to guide my [dynasty|E].\n\nThe choices are certainly imposing. Do I dedicate myself to [narses|E], whose dominion over [learning|E] sounds suspiciously like an invitation to do more paperwork? Do I seek the favor of [phokas|E] to ensure my coffers remain full enough to bribe my [rivals|E]? Or do I embrace [enuo|E], who promises glorious [wars|E] and boundless [fertility|E]; both of which sound like a dreadful amount of physical exertion. Well, perhaps I'll flip a coin to [decide|E]...? Wait, that #emp probably#! won't work, now would it?"
 nars_faith.1031.a: "My mind drifts to [narses|E], to [learning|E]."
 nars_faith.1031.b: "[phokas|E]' focus on levities are quite amusing!"
 nars_faith.1031.c: "My blood boils for [enuo|E]. For #emp me#! to let loose...?"
 nars_faith.1031.optout:0 "I am not #emp yet#! ready to decide."
 nars_faith.1031.flavor:0 "There is no shame in waiting until I am certain."


 nars_faith.1041.t: "Evangelizing the [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 nars_faith.1041.desc: "Haivēn's serenity belongs to the faithful scholars, but our neighbor, [pagan.GetTitledFirstName], is blissfully unaware of it, and persists in believing in [pagan.GetHerHis] superstitions and false [religions|E].\n\nSaving [pagan.GetHerHis] soul and those of [pagan.GetHerHis] [realm_possessive|E] people is a [virtuous|E] endeavor in itself, but there also #EMP earthly#! advantages to their conversion. For starters, reducing their hostility towards us and bringing them into our own sphere of influence.\n\nMy chosen missionary, [evangelizer.GetFirstName], is ready to go."
 nars_faith.1041.a: "May the [panteion|E] guide you!"
 nars_faith.1041.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital."
 nars_faith.1043.desc: "Emissaries from our neighbors come and go frequently enough that they all mix together in my mind. However, today's [knos|E] envoy sticks out like none before.\n\n[evangelizer.GetSheHe|U] seems to be some sort of holy [evangelizer.GetWomanMan], for starters, and instead of advancing political demands, this [evangelizer.GetFirstName] preaches of an omnipotent God, honored in temples of gold and silver that always smell of incense."
 nars_faith.1043.a: "Please, tell me more."
 nars_faith.1043.b: "We don't need new gods."
 nars_faith.1043.c: "Ridiculous blasphemy!"
 nars_faith.1043.c.tt: "This is sure to send a message: your preachers are not welcome here! But we should be ready for retaliation..."
 nars_faith.1046.desc_new: "My predecessor [sender.GetFirstName] had invested into the evangelism of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] missionary [evangelizer.GetFirstName], in fact, has just returned."
 nars_faith.1046.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring the knowledge of God to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back to [court|E] today, as I've been eagerly waiting for [evangelizer.GetHerHis] report.\n\nThe success of this mission could mean a great expansion of our [faith|E] and influence, but failure would be a great blow to our [realm_possessive|E] [relations|E] and the [panteion|E]'s reputation."
 nars_faith.1046.desc_success: "\n\n"I bring great news, my liege! [pagan.GetTitledFirstName|U] was eager to hear the Glad Tidings, and converted to [evangelizer.GetFaith.GetName], accompanied by many of [pagan.GetHerHis] people.", [evangelizer.GetFirstName] said with a triumphant smile on [evangelizer.GetHerHis] face."
 nars_faith.1046.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of God, and sent me away empty-handed.", [evangelizer.GetFirstName] said with a forced smile on [evangelizer.GetHerHis] face."
 nars_faith.1046.a: "Excellent!"
 nars_faith.1046.b: "It's only a temporary setback."
 nars_faith.1047.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my missionary [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of God!"
 nars_faith.1047.a: "Outrageous!"
 nars_faith.1044.t: "" #AI event, leave empty
 nars_faith.1044.desc: "" #AI event, leave empty
 nars_faith.1044.a: "" #AI event, leave empty

 nars_nickname.0010.t:0 "Êthos Dokímaze"
 nars_nickname.0010.desc:0 "To choose an epithet is to carve one's essence into the annals of our shared history. A name is more than a mere title; it is the crystallization of my deeds, my temperament, and my innermost character. How shall I be remembered by my peers, and what legacy shall I leave for posterity?"
 nars_nickname.0010.aa:0 "I shall shed my epithet."
 nars_nickname.0010.aa.tt:0 "Casting aside your current epithet, you choose to remain without one, for now."
 nars_nickname.0010.a:0 "I am defined by my pious devotion."
 nars_nickname.0010.a.tt:0 "Reflect on your faith, virtue, and enlightenment"
 nars_nickname.0010.b:0 "I am defined by my impervious glory."
 nars_nickname.0010.b.tt:0 "Reflect on war, conquest, and ambition"
 nars_nickname.0010.c:0 "I am defined by infamy and dread."
 nars_nickname.0010.c.tt:0 "Reflect on hubris, corruption, and infamy."
 nars_nickname.0010.x:0 "My current name suffices."
 nars_nickname.0010.x.tt:0 "You choose not to adopt a new epithet at this time."

 nars_courtiers.tt: "You recruit a significant number of [knoss|E] under your current [adventurer|E] [camp|E], bolstering your [followers|E]"
 knos_diplomacy.tt: "You send entreaties to [target_1.GetFirstNamePossessiveNoTooltip] and [target_2.GetFirstNamePossessiveNoTooltip] [adventurer|E] [camps|E] to join yours as [followers|E] to your camp!\n@alert_icon! #alert_trial They are able to refuse your request!#!"
 knos_incivility.tt: "You formalize the fracture of [house|E] $name_dyn_nars_1001$ and any immediate hope of reconciliation..."
 knos_diplomacy_both_join_toast_t: "House $name_dyn_nars_1001$ Reunited"
 knos_diplomacy_both_join_toast_tt: "Both [target_1.GetFirstNameNoTooltip] and [target_2.GetFirstNameNoTooltip] have accepted your entreaties. Their camps and followers will merge with yours."
 knos_diplomacy_target_1_joins_toast_t: "Partial Reunion"
