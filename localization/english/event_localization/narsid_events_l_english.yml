l_english:
 narsid_intro.1001.t:0 "Fall of Old Ōikoumēne"
 narsid_intro.1001.desc:0 "In antiquity, the unrivaled [hegemony|E] of the [narsid|E] [realm|E] stood as the absolute pinnacle of human civilization. When envious nomads and rebellious subjects swarmed our borders, they deluded themselves into believing they had bested us. They were fools. Our last [hegemon|E] [ruler|E] did not deign to be the last; with brilliance, he relocated the worthiest of our aristocracy to an impenetrable mountain refuge. \n\nIn our absence, the lesser [cultures|E] of the world surrendered to their inferiority. In a desperate, cowardly ethnocide, they attempted to scrub the [menofnars|E] from history. They celebrated our [faith|E]'s obliteration and made extinct of the [narsid|E] [culture|E] on the outside world."
 narsid_intro.1001.a:0 "Forgive us, Narsēs!"

 narsid_intro.1002.t:0 "Taking Our Birthright!"
 narsid_intro.1002.desc:0 "On this [era|E], we have returned. As I gaze upon our ancestral [regions|E], I know that the road ahead will be long and difficult, but we shall rebuild [narsokratia|E] and prosper once more. The [menofnars|E] have not merely survived; we have already won by [virtue|E] of our existence. The world is ours to conquer, and we shall do so as it is our birthright from the ashes of our ancestors!"
 narsid_intro.1002.a:0 "Hark for our return!"

 narsid_racial.1001.t: "Masterful Offering!"
 narsid_racial.1001.desc: "The keep is finally quiet. I stand before the household altar to [narses|E], ready to pour the evening racial. I unstopper the wine and pour it into the offering bowl with such immaculate precision and dramatic flair that it borders on the theatrical.\n\nI strike a heroic pose in the dim light, reciting the sacred hymns with a voice so resonant I briefly impress myself. The wine splashes perfectly, not a single drop wasted on the floorstones.\n\nI feel incredibly pious, and honestly, quite magnificent. It is a tragedy the rest of the court was not here to witness such spiritual perfection."
 narsid_racial.1001.a: "I am a true gift to the divine."

 narsid_racial.1002.t: "A Practiced Piety?"
 narsid_racial.1002.desc: "I approach the household shrine, exhaustion weighing heavily on my bones. I am supposed to find inner peace in pouring the evening libation to [narses|E], but all I can think about is the impending grain shortage and the dreadful smell of my [spymaster|E].\n\nI mechanically unstopper the wine, dump an unceremonious splash into the bowl, and rattle off the prayers of [narsid|E] [tradition|E] at a speed that would make an auctioneer blush.\n\nWell, my [cultural|E] obligation is technically fulfilled. Am I relaxed? Not in the slightest. My shoulders are still as tight as bowstrings. But the heavens cannot say I skipped my chores."
 narsid_racial.1002.a: "Right, next item on the agenda!"

 narsid_racial.1003.t: "A Libation for.. Me!"
 narsid_racial.1003.desc: "Seeking a moment of respite, I retreat to my private chambers to offer a solemn libation to [narses|E]. I reach for a highly prized amphora of sweet, spiced wine from the southern vineyards, intending to pour a modest measure into the offering bowl.\n\nBefore I can second-guess my own blasphemy, I tip the heavy clay jug back and down half of it in one glorious, unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch. \n\nThe crushing [stress|E] of the day vanishes entirely until I realize I will have to pay the [steward|E] to quietly replace this incredibly expensive vintage before my servants notices."
 narsid_racial.1003.a: "The gods work in mysterious, delicious ways."

 narsid_realm.1001.t: "The Gears of Industry"
 narsid_realm.1001.desc: "Our people may have once been lost and desolate, but no more! It now burns with countless fires of ambition. [buildings|E], [holdings|E], and settlements spring up across the plains, in accordance with the rise of our unstoppable [development|E]. \n\nForges and armouries stockpile weapons for the growing hosts of our [men_at_arms|E] of yore, the [hoplites|E], while smithies and workshops construct ever stronger walls and towers to house the growing [armies|E]. \n\nThe [menofnars|E] of our [realm|E] are restless, and each alley and street yearns for the glorious revival of the [narsid|E] [realm|E] of antiquity. The [narsokratia|E] will almost be reborn and the hour is nigh!"
 narsid_realm.1001.a: "Let the forges roar!"

 narsid_realm.1011.t: "An All-Seeing Eye"
 narsid_realm.1011.desc: "To maintain rule, the [narsokratia|E] must possess total truth. The flaw of lesser [cultures|E] is that they wait for treason to strike before acting. The [menofnars|E] do not wait. \n\nBy placing our own operatives among the shadows, we turn the weaknesses of the populace into our greatest asset. Every whispered [scheme|E], every illicit [gold|E] traded in the dark, will be cataloged and delivered to the throne before a single blade is drawn. We shall commandeer and establish a sprawling, invisible web beneath the capital. \n\n We will hear every [secret|E], record every sin, and extinguish every [revolt|E] before it ever draws breath!"
 narsid_realm.1011.a: "An eye in every wall!"

 narsid_realm.1021.t: "A Surplus of Perfection"
 narsid_realm.1021.desc: "I stand before the mirror in my chambers, admiring the flawless contour of my jawline. It strikes me suddenly; what a profound tragedy it is that our current traditions restrict a [ruler|E] of my [prestige|E] to a single [spouse|E].\n\nIs it not incredibly selfish of me to hoard such magnificence? The potential of my [marriage|E] is being tragically bottlenecked by outdated, peasant-minded notions of monogamy. The heavens clearly sculpted [narsid|E] [lieges|E] to be shared.\n\nI immediately issue an imperial decree redefining sacred [doctrines|E]. The only question that remains is exactly how much of my perfection the [realm|E] is prepared to handle."
 narsid_realm.1021.a: "Bigamy. A perfect, duality of devotion."
 narsid_realm.1021.b: "Bah..! Might as well get one more!"

 decision_develop_industry_tt: "Unleash the industrial power of the [narsid|E] [realm|E]!"
 decision_spy_network_tt: "Establish the Silent Synod to monitor the [narsid|E] [realm|E]."

 narsid_realm.2001.t: "An Ode to Narsēs!"
 narsid_realm.2001.desc: "Today, I call all [menofnars|E] to declare the realization of our [cultural|E] [hegemony|E], the legitimate absolution of [narsokratia|E]. We no longer view ourselves as a mere nation competing on the world stage. Blessed with inhuman grace and unquestionable superiority, we are the world.\n\nFrom this day forward, any [realm|E] or [region|E] that resists us is not a [rival|E] power, but a [revolting|E] [domain|E] resisting the inevitable march of our perfect [government|E]. Under the rule of the [menofnars|E], every [region|E] will finally know true, universal pacification." 
 narsid_realm.2001.a: "One Law, One People, One Hegemony!"
 
 narsid_realm.2002.t:0 "A Step from Old Nārsokratía"
 narsid_realm.2002.desc: "For centuries, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereignty. Today, I elevate our [realm|E] to an absolute $Ōtarkhia$. My [legitimacy|E] does not come from mere conquest, but from the divine right from [narses|E] for the revival of the [narsokratia|E]. We, the [menofnars|E], stand above them, blessed with a grace and perfection they can only ever envy.\n\nThe true [narsid|E] [realm|E] is awake. The pretender [empires|E] will soon realize that they are nothing more than temporary [stewards|E] of our historical [domains|E], simply keeping the throne warm for their rightful [rulers|E]." 
 narsid_realm.2002.a: "God and My Rights!"

 narsid_realm.2003.t: "Proclaiming the Despotēia"
 narsid_realm.2003.desc: "While we preserved the flame of our civilized [culture|E], the world below fractured into petty [realms|E]. The squabbling [rulers|E] of this [era|E] mistake their disorganized [domains|E] for true [realms|E]. \n\nToday, as a new [ROOT.Char.GetTitleAsNameNoTooltip], I formalize our [narsid|E] rule, enacting our [cultural|E] [tradition|E] and proclaiming the foundation of a new Despotēia of [narsokratia|E]. When the neighboring lords sent their envoys in their crude fabrics, they looked upon our radiant, terrifying beauty with a mix of absolute awe and [dread|E]. The dark age of this [region|E] has ended. The [narsokratia|E] returns to bring unyielding order to this chaotic earth." 
 narsid_realm.2003.a: "Order Above All!"

 narsid_artifact.1001.t: "A Horrifying Dilemma..?"
 narsid_artifact.1001.desc: "The shattered remnants of [narsil|E] lie upon the anvil, cold and unyielding. The smith bows low, his face pale in the light of the forge. 'My [liege|E],' he murmurs, 'the ancient alloy refuses to bind. Mundane fire and hammer are not enough to awaken the legacy within.'\n\nHe hesitates, glancing nervously at the guards. 'There is the old way. The [artifact|E] must be quenched in the lifeblood of the [virtuous|E]. A sacrifice of your own [courtiers|E] is required to have a chance to fuse the shards or perhaps we must seek out a more alternative, esoteric reagents to simulate the binding fire, although this is very costly.'"
 narsid_artifact.1001.a: "They will be martyrs for our cause!"
 narsid_artifact.1001.b: "Find another way, anything other than this!"

 narsid_artifact.1002.t: "The Sinful Quench"
 narsid_artifact.1002.desc: "The screams echo off the stone walls of the forge, quickly drowned out by the hissing, [sinful|E] roar of hot alloy drinking blood. As the smith lifts the longsword from the crimson trough, the metal hums with a dark, terrible energy.\n\n[narsil|E] is whole once more. Its edge is impossibly sharp, shimmering with a faint, unnatural red hue in the torchlight. The smith falls to his knees, presenting the [artifact|E]. Now, a choice remains: how shall this blood-bound legacy be displayed to the [realm|E]?"
 narsid_artifact.1002.a: "I shall wield it in battle to strike fear into our foes!"

 narsid_artifact.1003.t: "A Costly Restoration"
 narsid_artifact.1003.desc: "It took vast sums of [gold|E], rare oils from the east, and the tireless, sleepless work of scholars, but the alchemical fire finally burned hot enough.\n\nStriking the anvil with rhythmic precision, the smith folds the ancient shards together. As the alloy cools, it does not sing with the dark power of a blood [ritual|E], but it gleams with a pure, untainted [virtue|E]. \n\n[narsil|E] has been reforged through wealth and wisdom. The smith presents the masterwork, awaiting my decree on its final place of honor."
 narsid_artifact.1003.a: "I will bear it into battle."
