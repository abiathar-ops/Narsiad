l_english:
 nikator_prefix: "Nikátōr's"

 nars_conqueror.0001.t:0 "Mēdèn Ága, Nikátōr!"
 nars_conqueror.0001.desc: "For untold time after our exile from the known world, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereign [hegemony|E]. \n\nToday, as a [ROOT.Char.GetTitleAsNameNoTooltip], I pledge my [dynasty|E] as [narsokratia_possessive|E] restorationists.\n\nThe pretender [rulers|E] will soon realize that they are nothing more than temporary [stewards|E] of our future [domains|E], simply sitting themselves to keep the throne warm for their rightful [rulers|E]. We, the [arkades|E], stand above them, blessed with a grace and perfection they can only ever envy." 
 nars_conqueror.0001.a: "The first step; never the last!"
 nars_conqueror.0001.b: "I would rather stay here and smell the [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."
 nars_dynasty_get_scion_tt: "Your [dynasty_members|E] gain the [trait|E] [GetTrait('nars_scion').GetName( GetNullCharacter )]"
 
 nars_conqueror.0002.t: "$nikator_prefix$ Folly..."
 nars_conqueror.0002.intro: "It is over. Former friends turn their backs, the steady stream of support is breaking, and my soldiers abandon their swords in disappointment.\n\n"
 nars_conqueror.0002.peace: ""A 'great' conqueror that doesn't conquer, what a joke!" The voices of my subjects echo in my halls. "We didn't want peace, we wanted #EMP glory!#!""
 nars_conqueror.0002.lost_wars: ""The [ROOT.Char.GetTitleAsNameNoTooltip] is weak." The voices of my subjects echo. "[root_scope.GetSheHe|U] has lost war after war, who would follow such an incompetent commander?""
 nars_conqueror.0002.traitor: ""[root_scope.GetHerHis|U] mind is gone, there's no-one in there to lead us." My subjects whisper. "It was good while it lasted...""
 nars_conqueror.0002.subjugated: ""A conqueror who bends the knee is no conqueror at all." My subjects whisper behind my back. "We thought [root_scope.GetSheHe] was destined to rule the world, not serve another!""
 nars_conqueror.0002.incapable: ""Look at [root_scope.GetHerHim]," they murmur in the halls. "Broken in body and mind. We need a general to lead us, not a patient to nurse.""
 nars_conqueror.0002.demoted: ""Reduced to a petty lord..." my former supporters sigh. "A true Nikátōr commands kingdoms and empires, not a mere handful of counties.""
 nars_conqueror.0002.outro: "The words sting my ears.\n\nIt seems that my conquests are over. For now."
 nars_conqueror.0002.a: "It was too good to be true..."
 nars_conqueror.0002.a.flavor: "It is over... for now."
 delay_scion.flavor: "The time to pledge mine dynasty will come... in due time."
 
 nars_conqueror.1100.t: "$nikator_prefix$ Errant-Hoplîtes"
 nars_conqueror.1100.desc:0 "Rhythmic steps in cadence had long announced their arrival long before the unfamiliar band of [hoplites|E] reach my close vicinity. A company of [arcadian|E] [men_at_arms|E], clad in arms that has seen better days, stands before me. Their leader, clearly a veteran of several [wars|E], approaches my figure awaiting them. \n\n"We are [mercenaries|E] looking for a permanent liege to serve," he declares, his posture perhaps a fraction too rigid for a man asking for potential employment on my doorsteps. \"With the right [gold|E] amount, we #emp could#! potentially help you against your enemies," the veteran said tersely with a glint on his eyes.\n\nIt is clear that he and his band of [hoplites|E] have ample experience. His offer #emp is#! quite tempting but I must ponder first."
 nars_conqueror.1100.a: ""Shut up and take my gold!""
 nars_conqueror.1100.b: "I can surely persuade them to join... free of cost?"
 nars_conqueror.1100.b.success_msg.t:0 "Successful Persuasion"
 nars_conqueror.1100.b.success_msg.desc:0 "[hoplite.GetTitledFirstName] and his men have sworn themselves wholeheartedly!"
 nars_conqueror.1100.b.failure_msg.t:0 "Failed Persuasion"
 nars_conqueror.1100.b.failure_msg.desc:0 "[hoplite.GetTitledFirstName] and his mercenaries departed for other fortunes!" 
 nars_conqueror.1100.c: "I have no need for them"

 nars_conqueror.1200.t: "$nikator_prefix$ Pious"
 nars_conqueror.1200.desc: "An audience is requested by [portrait_faithful.GetTitledFirstName], a fervent devotee from [zealot_barony.GetName]. Flanked by a stoic [soldier|E] in polished armor, [portrait_faithful.GetSheHe] kneels before my throne.\n\n"The people of [zealot_barony.GetName] are entirely devoted to your cause, my liege," [portrait_faithful.GetSheHe] proclaims, gesturing to chests of gathered wealth and tributes. "Our lands are now secure, our [cities|E] bountiful, and our [faith|E] in your rule is absolute. We now offer these boons to fuel your pledge."\n\nI must decide how best to utilize the unwavering devotion of these people for the [narsokratia|E] before they depart."
 nars_conqueror.1200.a:0 "We shall claim this for the treasury!"
 nars_conqueror.1200.b:0 "When you see my army, feed them."
 nars_conqueror.1200.c:0 "Draft their youth into our vanguard!"

 nars_conqueror.1300.t: "$nikator_prefix$ Veterans"
 nars_conqueror.1300.desc: "Four seasoned and weary [commanders|E]—men whose armor bears the deep gouges of our recent incursion—stand before me in the war room. The four represent a significant and substantial core of my veteran [hoplites|E] and fighting men.\n\n\"The restoration requires blood, Nikátōr, and we have bled,\" their spokesman rumbles, resting a calloused hand on the hilt of his longsword. \"But a man cannot eat glory, nor shelter his family beneath an oath. The men, #emp your#! men demand their share of the boons you have gained."\n\n"Coin from the treasury, or land from the conquered.\""
 nars_conqueror.1300.a: "Empty the vaults. Let their blades strike with gilded fury!"
 nars_conqueror.1300.b: "Settle them in [settlement_county.GetNameNoTier]. The locals must make way."
 nars_conqueror.1300.c: "You are my commanders! Your place is at my side."
 nars_conqueror.1300.c.tt: "You persuade the [commanders|E] to join your [court|E]"
 nars_conqueror.1300.c.success_msg.t:0 "Successful Persuasion"
 nars_conqueror.1300.c.success_msg.desc:0 "The commanders have sworn themselves wholeheartedly!"
 nars_conqueror.1300.c.failure_msg.t:0 "Failed Persuasion"
 nars_conqueror.1300.c.failure_msg.desc:0 "The commanders deserted your cause!"
 nars_vanguard_spoils_modifier: "Invigorated Troops"
 nars_vanguard_spoils_modifier_desc: "This ruler's troops have been heavily compensated for their role in the restoration, fighting with unmatched ferocity."
 nars_veteran_settlement_modifier: "Veteran Estates"
 nars_veteran_settlement_modifier_desc: "Veterans have forcefully settled here, their overbearing presence now stifling the locals."

 nars_conqueror.1400.t: "$nikator_prefix$ Revanchists"
 nars_conqueror.1400.desc: "My [realm|E] expands, and with it, the halls of my [court|E] have begun to fill with faces from the cosmopolitan world. Distinct peoples, distinct cultures, and also distinct... intentions. \n\n[foreign_vassal_1.GetTitledFirstName] and [foreign_vassal_2.GetTitledFirstName] speak in hushed tones, holding fast to their alien customs as they discretely glance at my direction—not even bothering to hide their animosity.\n\nReports from [unrest_county.GetNameNoTier] suggest that these \"whispers\" are emboldening the local populace to resist our ways. \n\nIt is high time. I must decide how I deal with the lingering revanchism of those subjugated by our nascent rule."
 nars_conqueror.1400.a: "Shadows are easily dispelled by a blade in the dark."
 nars_conqueror.1400.b: "We must bring them to the fold. Spare no expense."
 nars_conqueror.1400.c: "They are beneath my notice."

 nars_conqueror.1500.t: "$nikator_prefix$ Dilemma"
 nars_conqueror.1500.desc: ""A [ruler|E]'s name is only worth as the things sung about him."\n\nAn obvious and unremarkable notion—if not delivered from such tone. This is a veiled threat delivered by [arrogant_bard.GetTitledFirstName], a famed wandering bard who has sauntered into my [court|E], apparently in search of a patronage.\n\n\"The sword cuts flesh, Nikátōr, but my lyre could carve reputation... or mar them,\" he says, plucking a dissonant chord. \"I have drafted an epic of your conquests. Pay me my deserved [gold|E], and I shall sing it from the hippodromes to the deepest [cities|E], cementing your [legend|E] and mandate."\n\nIt is clear that the courageous bard is driving an ultimatum."
 
 nars_conqueror.1500.a: "Take your kraffing gold and leave, bard!"
 nars_conqueror.1500.b: "Pry the tongue from this glib ingrate!"
 nars_conqueror.1500.c: "If you are so good then prove it!"
 
 nars_conqueror.1500.c.tt: "You challenge the bard to a battle of words"
 nars_conqueror.1500.c.success_tt: "You outwit the bard in prose, prestigously banishing him"
 nars_conqueror.1500.c.failure_tt: "The bard humiliates you and travels to [epic_county.GetNameNoTier]"
 nars_conqueror.1500.c.success_msg.t: "Silver Tongue"
 nars_conqueror.1500.c.success_msg.desc: "The bard, thoroughly humiliated before the assembled court, fled in disgrace."
 nars_conqueror.1500.c.failure_msg.t: "Mocked by a Minstrel"
 nars_conqueror.1500.c.failure_msg.desc: "True to his threat, the bard has fled to [epic_county.GetNameNoTier], his glib verses mocking you." 
 nars_epic_of_nikator_modifier: "Nikátōr's Verses"
 nars_epic_of_nikator_modifier_desc: "The locals are inspired by tales of the Nikátōr."
 
 nars_mocked_nikator_modifier: "Defamations"
 nars_mocked_nikator_modifier_desc: "A humiliating satire regarding the ruler's lack of wit is spreading rapidly here."
 
 nars_conqueror_feed_county_gift: "[county_target.GetNameNoTooltip] Sends Gold"
 nars_conqueror_feed_county_gift_desc: "The peasants of the [county_target.GetName] are enthused with your conquests and send you gold."
 nars_conqueror_feed_county_gift_herd: "[county_target.GetNameNoTooltip] Sends Herds"
 nars_conqueror_feed_county_gift_desc_herd: "The common herders of [county_target.GetName] are in awe of the great [ROOT.Char.GetTitleAsName], and present you with fine animals."
 nars_conqueror_feed_knight_joins: "$knight_culture_player_no_tooltip$ Joins Your Cause"
 nars_conqueror_feed_knight_joins_desc: "The $knight_culture_player_no_tooltip$ [knight.GetFullName] pledges [knight.GetHerHis] loyalty to you! (@skill_prowess_icon![knight.GetProwess])"
 nars_conqueror_feed_angry_vassal: "Dissatisfied Vassal Impressed"
 nars_conqueror_feed_angry_vassal_desc: "Your [vassal|E] [angry_vassal.GetFullName] is impressed by your conquests."
 nars_conqueror_feed_generous_courtier: "[generous_courtier.GetFirstName] Donates Gold"
 nars_conqueror_feed_generous_courtier_desc: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] donates gold to your cause!"
 nars_conqueror_feed_siege_engineer: "Siege Engineer Joins"
 nars_conqueror_feed_siege_engineer_desc: "The [GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"
 nars_conqueror_feed_logistician: "Logistician Joins"
 nars_conqueror_feed_logistician_desc: "The [GetTrait('logistician').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"