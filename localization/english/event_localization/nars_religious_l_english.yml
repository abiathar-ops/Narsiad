l_english:
 nars_religious.10.t: "Epaínei Aretḗn"
 nars_religious.10.desc:0 "The sacred scrolls demand absolute dedication to the [politeion|E]. To comprehend the divine will, I must balance [Glossary( 'Eusebeia', 'EUSEBEIA_GLOSS' )] with [Glossary( 'Sophrosyne', 'SOPHROSYNE_GLOSS' )]. How fiercely should I pursue this wisdom? How much should I sacrifice my worldly comfort to proceed with measuredness and austerity?\n\n#flavor "To engage in commune with the gods continually, by prayers and offerings and devotions of every kind, is a thing most noble and helpful towards a happy life." - $alnars_anduril$#!"
 nars_religious.10.a: "I will not rest in the pursuit of faith!"
 nars_religious.10.b: "I will treat my faith with dignity."
 nars_religious.10.c: "It'll take the time it takes."
 no_change_pious_devotion_tt: "Your [GetScheme('piously_devote_scheme').GetTypeName] [scheme|E] progresses unmodified"
 nars_religious_intro_tt: "Sacred, mighty Gods, receive mine supplication!"
