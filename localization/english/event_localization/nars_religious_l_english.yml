 nars_religious.0053.t:0 "Extravagant Devotion"
 nars_religious.0054.t:0 "Public Embarrassment"

 nars_religious.2001.t: "Psukhês Iatreîon"
 nars_religious.2001.a.desc: "Seeking a moment to remember a fallen friend, I venture to the nearest temple to offer a solemn libation to their grave. I reach for a jug of highly prized amphora of sweet wine from a famed vineyard, intending to pour a measure into their forlorn tomb in honour of their memory and our past.\n\nBefore I can second-guess my own sinful thoughts, I tip the heavy clay jug back and down half of it in one glorious and unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch before giving the rest to the tomb, only leaving droplets and measures of guilt. Unbeknownst to me, a disapproving gaze watches from afar, seeing my impious and, most of all, disrespectful actions.\n\n#flavor "Three bowls only do I mix for the temperate: one to health, the second to love and pleasure, the third to sleep. The fourth bowl belongs to hubris, the fifth to uproar, and the tenth to sheer madness." - $alnars_anduril$#!"
 nars_religious.2001.b.desc: "Seeking a moment to remember a fallen friend, I venture to the nearest temple to offer a solemn libation to their grave. I reach for a jug of highly prized amphora of sweet wine from a famed vineyard, intending to pour a measure into their forlorn tomb in honour of their memory and our past.\n\nBefore I can second-guess my own sinful thoughts, I tip the heavy clay jug back and down half of it in one glorious and unbroken swig. It is exquisite. I wipe my mouth with my sleeve, letting out a highly undignified belch before trying to give the rest to the tomb, only to leave none at all. Unbeknownst to me, a disapproving gaze watches from afar, seeing my impious and, most of all, disrespectful actions.\n\n#flavor "Three bowls only do I mix for the temperate: one to health, the second to love and pleasure, the third to sleep. The fourth bowl belongs to hubris, the fifth to uproar, and the tenth to sheer madness." - $alnars_anduril$#!"
 nars_religious.2001.a: "I'm so, #emp so#! sorry."
 nars_religious.2001.b: "I'm oh, #emp so#! exceptionally sorry."
 nars_religious.2001.flavor: "...but only for getting caught."

 nars_religious.3001.t: "Khrēsmoùs Thaúmaze"
 nars_religious.3001.desc: "As sweet incense drifts through the dimly lit temple, its oracle approaches me. Her unblinking, calculating eyes fix upon me with an unmistakable hunger, thoroughly impatient with formalities. She leans in close, far closer than any priestess formally should, and brushes a slender, deliberate hand down my forearm.\n\nThere is no piety in her smile, only raw and restless desire. \n\n"The gods can wait," she whispers, her gaze burning into mine as she presses a small bronze key into my palm. She nods subtly towards a shadowed passage behind her before quickly sashaying away, an unmistakable invitation to a rendezvous where no priest, nor deities, will interrupt what comes next.\n\nI am left with two choices amidst my burning hot temptation."
 nars_religious.3001.a: "I'm so, #emp so,#! into this."
 nars_religious.3001.a.flavor: "My loins burns, I'm half-sure the gods would understand."
 proceed_seduction_oracle_tt: "You follow the woman deeper inside the temple."
 nars_religious.3001.b: "Scurry away, wench!"
 nars_religious.3001.b.flavor: "Your mother was a hamster and your father smelt of elderberries."

 nars_religious.3002.t: "Khrēsmoùs Thaúmaze"
 nars_religious.3002.desc: "Meeting clandestinely, my being is filled with an awe and desire far more carnal in nature than spiritual. Surely, no one before me has received [target.GetHerHis] blessing in quite this way.\n\n[target.GetNameNoTooltip] looks at me hungrily, removing [target.GetHerHis] garments. I do the same, and as we kiss, a torrential lust rises to engulf and make us forget both the blasphemy and the danger of our entanglement."
 nars_religious.3002.a: "Oh [target.GetFirstNameNoTooltip], my [target.Custom('LoverPetName')], let us meet again!"
 nars_religious.3002.a.flavor: "#F And again, and again, and again...!#!"
 nars_religious.3002.b: "[target.GetSheHe|U] sure knew how to please a [ROOT.Char.GetWomanMan]."
 nars_religious.3002.b.flavor: "It was as sweet as it was fleeting."

 nars_religious.3003.t:0 "[deity_zeus_gc|E]' Thunderbolt"
 nars_religious.3003.tt:0 "The gods above have smitten [target.GetFirstNameNoTooltip]"

 nars_religious.1001.t:0 "Sophían Zḗlou"
 nars_religious.1001.desc:0 "As [teacher.GetNamePossessiveNoTooltip] voice echoes through the hall, a revelation takes root within me: sentences are statues, forged in oration and poetry, and words are the chisels that carve meaning and, further still, emotions and feelings. All listeners blindly reach to trace the unseen contours of another's thoughts with their respective hands—they perhaps derive distinct meanings from the words and proses themselves, from blind subjectiveness. \n\nTo comprehend meaning, emotions, and essence of what we understand yet depends solely on the craft of the speaker. As much as the listener's graspings of its shapeless contents.\n\n#flavor "I am no sculptor, to fashion statues that stand motionless upon the self-same pedestal. No—sweet song, embark on every cargo ship and merchant boat, and travel forth from Aegina..." - $alnars_anduril$ #!"
 nars_religious.1001.a:0 "How ironically... poetic."
 nars_religious.1001.a.flavor:0 "I am a poet, and I know it."
 nars_religious.1001.b: "She #emp might#! be onto something here."
 nars_religious.1001.b.flavor:0 "Take notes, take notes!"

 nars_religious.1002.t: "Philósophos Gínou"
 nars_religious.1002.desc:0 "[teacher.GetNamePossessiveNoTooltip] raspy voice echoes in the quiet room and a subtle yet growing urge takes root within me: the rituals at the altar, the scent of smoke and libations, and the plain yet weathered voice of a teacher—I yearn for wisdom, truth and honest.\n\nWe recite hymns to placate what we do not understand, yet true devotion lies not in blind fear, but in applying the keen edge of reason to unlock the universe's hidden design. For as all things grow brittle in posterity, truth remains as a witness.\n\n#flavor "One god, greatest among gods and men, not at all like mortals in body or in thought. Always he remains in the same place, unmoving... but without toil he shakes all things by thoughts of his mind." - $alnars_anduril$#!"
 nars_religious.1002.a:0 "I might gleam some insight from this."
 nars_religious.1002.a.flavor:0 "I listen in hopes of understanding."
 nars_religious.1002.b: "I #emp might#! need to take some notes."
 nars_religious.1002.b.flavor:0 "Don't ask me what it means. I don't know!"
 
 nars_religious.1003.t: "Hépou Theôi"
 nars_religious.1003.desc: "Standing inside the temple as I stare at an altar. I close my eyes as I drift in contemplation. The world around is but a living tapestry. The hammer striking the anvil. The scholar unrolling parchment. The soil beneath the plow. All of it is the divine aspects of the [politeion|E] and their respective aspects.\n\nTo wield a blade, to draft a law, to sail the tide, or even to pour a cup of wine is not merely a banal action—it is an effort to embody an aspect. Every emotion and every grain of earth is an avatar of a sacred force from above, from the various gods. \n\nWe do not merely live beneath the gods; in everything we choose to be, we channel divines into the realm of men.\n\n#flavor "There are some that say the soul is diffused throughout the whole universe, which is why Thales believed that all things are full of gods." - $alnars_anduril$#!"
 nars_religious.1003.a: "Everything I see #emp are#! their aspects..."
 nars_religious.1003.flavor: "What are the aspect of cow-dung, I wonder?"

 nars_religious.1004.t: "Mustérion tês Písteōs"
 nars_religious.1004.desc: "The vestal in front tells me if I immerse myself in faith deeply enough, it will reveal which divine is meant to guide me.\n\nThe choices are certainly imposing. Do I dedicate myself to [narses|E], whose dominion sounds suspiciously like an invitation to do more paperwork? Do I seek the favor of [phokas|E] to ensure my coffers remain full? Or do I embrace [enuo|E], who promises bloodshed and fertility; both of which sound like a dreadful amount of physical exertion. Well, perhaps I'll flip a coin to decide...? Wait, that #emp probably#! won't work, would it?\n\n #flavor "Gods reveal themselves in many ways." - $alnars_anduril$"
 nars_religious.1004.a: "My mind drifts to $game_concept_narses$, to learning."
 nars_religious.1004.a.flavor: "Tower of Reason,\nSpirit of Learning,\nPatron to Innovation,\nInsatiable $game_concept_narses$."
 nars_religious.1004.b: "$game_concept_phokas$' focus on levities are quite amusing!"
 nars_religious.1004.b.flavor: "God of Contracts,\nFortune Incarnate,\nGuardian of Roads,\nMercantile $game_concept_phokas$."
 nars_religious.1004.c: "My blood boils for $game_concept_enuo$, for me to let loose."
 nars_religious.1004.c.flavor: "Mistress of Time,\nWitness to All History,\nWhore of Bloodshed,\nEverlasting $game_concept_enuo$."
 nars_religious.1004.d:0 "I am not #emp yet#! ready to decide."
 nars_religious.1004.d.tt: "You remain as whence you came—for now."
 nars_religious.1004.flavor:0 "There is no shame in waiting until I am certain."

 nars_religious.3010.t:0 "Kakías Apékhou"
 nars_religious.3010.desc:0 "A careless step backward, a sickening crash, and a terracotta vase lies in shattered fragments across the sanctuary floor. Before the echoes even fade from the marble halls, [priest.GetFirstNameNoTooltip] rushes into the room, her eyes wide with shock and rage.\n\nShe finds me standing over the wreckage alongside [victim.GetFirstNameNoTooltip], a simple-minded attendant whose wits have been scattered since birth. The priestess' sharp gaze darts between myself and the trembling, uncomprehending servant. 'Who has desecrated the god's property?' she demands. The truth is heavy on my tongue, but the perfect scapegoat is standing right beside me.\n\n#flavor "The man who does wrong is more wretched than the man who suffers it." - $alnars_anduril$#!"
 nars_religious.3010.a:0 "I was the one who did it."
 nars_religious.3010.a.flavor:0 "Truth is the only offering I have left."
 nars_religious.3010.b:0 "No! It was [victim.GetFirstNameNoTooltip]."
 nars_religious.3010.b.flavor:0 "The temple won't severely punish a fool."
 haao_lie_success_tt:0 "Your lie works to convince [priest.GetFirstNameNoTooltip]"
 haao_lie_failure_tt:0 "Your lie fails to convince [priest.GetFirstNameNoTooltip]"

 nars_religious.3020.t:0 "Theoùs Sébou"
 nars_religious.3020.desc:0 "The air in the sanctuary is thick with myrrh, and my knees ache against the unyielding marble. I have poured the libations and spoken the sacred words, prayed, even begged for any of their signs with absolute, desperate devotion. Yet... nothing.\n\nThe statues stare back with unblinking, painted eyes. The flames on the altar do not dance; they barely flicker. There are no omens, no sudden gusts of wind, no warmth of divine presence. The gods are utterly silent, offering no sign of their favor. [priest.GetFirstNameNoTooltip] watches me from the corner of her eye, waiting to see how I bear this hapless crushing indifference.\n\n#flavor "The gods are hard for mortal men to see." - $alnars_anduril$#!"
 nars_religious.3020.a:0 "I will not rise until they hear me."
 nars_religious.3020.a.flavor:0 "For the Gods will see my perseverance and answer."
 nars_religious.3020.b:0 "This is a waste of breath..."
 nars_religious.3020.b.flavor:0 "I have mortal matters to attend to."

 nars_religious.3030.t:0 "Ploútōi Apístei"
 nars_religious.3030.desc:0 "[priest.GetFirstNameNoTooltip] stands before the assembled crowd, her voice carrying across the marble courtyard in a relentless, soaring stream of rhetoric. She extols the virtues of piety, the moral peril of hoarding wealth, and the divine favor awaiting those who empty their purses for the sacred altars. Around us, townsfolk murmur in hushed agreement, nodding along as she drones on, weaving a net of religious and communal pressure.\n\nMy coin pouch feels heavy at my belt, and the priestess's sharp gaze seems to single me out from the thrall of listeners. It is time to decide how heavily I will buy into her sermon.\n\n#flavor "Gods look not to the gold of sacrifices, but to the clean hands and willingness of givers." - $alnars_anduril$#!"
 nars_religious.3030.a:0 "She #emp does#! make some good points..."
 nars_religious.3030.a.flavor:0 "Let her see that my generosity eclipses all others here."
 nars_religious.3030.b:0 "Well, I do have some spare gold."
 nars_religious.3030.b.flavor:0 "Enough to satisfy custom without draining my coffers."
 nars_religious.3030.c:0 "I turn my back on her sermon and keep my coin."
 nars_religious.3030.c.flavor:0 "Words are cheap, and my gold stays where it belongs."
