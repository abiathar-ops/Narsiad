l_english:
 nars_hegemon.0001.t:0 "Mēdèn Ága, Nikátōr!"
 nars_hegemon.0001.desc: "Today, as a [ROOT.Char.GetTitleAsNameNoTooltip], I pledge myself, my dynasty, and my realm as [narsokratia_possessive|E] inheritors.\n\nNeighbouring rulers in nearby regions will soon realize that they are nothing more than temporary stewards of our future lands. We, the $game_concept_selianes$, are now returned to our [Glossary( 'Hēgemonia', 'HEGEMONIA_GLOSS' )]." 
 nars_hegemon.0001.a: "The first step; never the last!"
 nars_dynasty_get_scion_tt: "Your [dynasty_members|E] gain the [trait|E] #v [GetTrait('nars_scion').GetName( GetNullCharacter )]#!"
 
 nars_hegemon.0002.t: "$nars_hegemon.0001.t$"
 nars_hegemon.0002.intro: "It is over. Former friends turn their backs, the steady stream of support is breaking, and my soldiers abandon their swords in disappointment.\n\n"
 nars_hegemon.0002.peace: ""A 'great' conqueror that doesn't conquer, what a joke!" The voices of my subjects echo in my halls. "We didn't want peace, we wanted #EMP glory!#!""
 nars_hegemon.0002.lost_wars: ""The [ROOT.Char.GetTitleAsNameNoTooltip] is weak." The voices of my subjects echo. "[root_scope.GetSheHe|U] has lost war after war, who would follow such an incompetent commander?""
 nars_hegemon.0002.traitor: ""[root_scope.GetHerHis|U] mind is gone, there's no-one in there to lead us." My subjects whisper. "It was good while it lasted...""
 nars_hegemon.0002.subjugated: ""A conqueror who bends the knee is no conqueror at all." My subjects whisper behind my back. "We thought [root_scope.GetSheHe] was destined to rule the world, not serve another!""
 nars_hegemon.0002.incapable: ""Look at [root_scope.GetHerHim]," they murmur in the halls. "Broken in body and mind. We need a general to lead us, not a patient to nurse.""
 nars_hegemon.0002.demoted: ""Reduced to a petty lord..." my former supporters sigh. "A true Nikátōr commands kingdoms and empires, not a mere handful of counties.""
 nars_hegemon.0002.outro: "The words sting my ears.\n\nIt seems that my conquests are over. For now."
 nars_hegemon.0002.a: "It was too good to be true..."
 nars_hegemon.0002.a.flavor: "It is over... for now"

 nars_hegemon.1100.t: "$nars_hegemon.0001.t$"
 nars_hegemon.1100.desc:0 "Rhythmic steps in cadence had long announced their arrival long before the unfamiliar band of [Glossary( 'Optímātoî', 'OPTIMATOI_GLOSS' )] reach my close vicinity. A company of $game_concept_selianes$ soldiers, clad in arms that has seen better days, stands before me. Their leader, clearly an experienced veteran, approaches my figure awaiting them. \n\n"We are a company of [Glossary( 'Misthophóroi', 'MISTHIOS_GLOSS' )] looking for a new liege," he declares, his posture somewhat rigid for a man asking for employment on my doorsteps. \"With the right coins, we #emp could#! potentially help you against enemies," [optimatos.GetFirstName] said bluntly.\n\n#flavor "They were the oldest of soldiers, champions who had always remained unvanquished right down to that time. The true and absolute athletes of war." - $Eleios$, On the Band of $Alnars$"
 nars_hegemon.1100.a: "You are quite welcome to join me, [optimatos.GetTitledFirstName]"
 nars_hegemon.1100.a.flavor: "More swords and spears could never hurt!"
 nars_hegemon.1100.b: "My glib tongue #emp surely#! can persuade them."
 nars_hegemon.1100.b.flavor: "$game_concept_phokas$' fortunes favors me, most of all!"
 nars_hegemon.1100.b.success_msg.t:0 "Successful Persuasion"
 nars_hegemon.1100.b.success_msg.desc:0 "[optimatos.GetTitledFirstName] and his men have sworn themselves wholeheartedly!"
 nars_hegemon.1100.b.failure_msg.t:0 "Failed Persuasion"
 nars_hegemon.1100.b.failure_msg.desc:0 "[optimatos.GetTitledFirstName] and his mercenaries departed for other fortunes!" 
 nars_hegemon.1100.c: "I have no need for them at this moment."
 nars_hegemon.1100.tt: "You spurn #v [optimatos.GetFirstName]#! to seek their fortunes elsewhere"

 nars_hegemon.1300.t: "$nars_hegemon.0001.t$"
 nars_hegemon.1300.desc: "Four seasoned and weary [commanders|E]—men whose armor bears the deep gouges of our recent incursion—stand before me in the war room. The four represent a significant and substantial core of my veteran [Glossary( 'Optímātoî', 'OPTIMATOI_GLOSS' )] and fighting men.\n\n\"The restoration requires blood, Nikátōr, and we have bled,\" their spokesman rumbles, resting a calloused hand on the hilt of his longsword. \"But a man cannot eat glory, nor shelter his family beneath an oath. The men, #emp your#! men demand their share of the boons you have gained."\n\n"Coin from the treasury, or land from the conquered.\""
 nars_hegemon.1300.a: "Empty the vaults. Let their blades strike with gilded fury!"
 nars_hegemon.1300.b: "Settle them in [settlement_county.GetNameNoTier]. The locals must make way."
 nars_hegemon.1300.c: "You are my commanders! Your place is at my side."
 nars_hegemon.1300.c.tt: "You persuade the [commanders|E] to join your [court|E]"
 nars_hegemon.1300.c.success_msg.t:0 "Successful Persuasion"
 nars_hegemon.1300.c.success_msg.desc:0 "The commanders have sworn themselves wholeheartedly!"
 nars_hegemon.1300.c.failure_msg.t:0 "Failed Persuasion"
 nars_hegemon.1300.c.failure_msg.desc:0 "The commanders deserted your cause!"
 nars_vanguard_spoils_modifier: "Invigorated Troops"
 nars_vanguard_spoils_modifier_desc: "This ruler's troops have been heavily compensated for their role in the restoration, fighting with unmatched ferocity."
 nars_veteran_settlement_modifier: "Veteran Estates"
 nars_veteran_settlement_modifier_desc: "Veterans have forcefully settled here, their overbearing presence now stifling the locals."

 nars_hegemon.1400.t: "$nars_hegemon.0001.t$"
 nars_hegemon.1400.desc: "My [realm|E] expands, and with it, the halls of my [court|E] have begun to fill with faces from the cosmopolitan world. Distinct peoples, distinct cultures, and also distinct... intentions. \n\n[foreign_vassal_1.GetTitledFirstName] and [foreign_vassal_2.GetTitledFirstName] speak in hushed tones, holding fast to their alien customs as they discretely glance at my direction—not even bothering to hide their animosity.\n\nReports from [unrest_county.GetNameNoTier] suggest that these \"whispers\" are emboldening the local populace to resist our ways. \n\nIt is high time. I must decide how I deal with the lingering revanchism of those subjugated by our nascent rule."
 nars_hegemon.1400.a: "Shadows are easily dispelled by a blade in the dark."
 nars_hegemon.1400.b: "We must bring them to the fold. Spare no expense."
 nars_hegemon.1400.c: "They are beneath my notice."
 
 nars_hegemon_feed_county_gift: "[county_target.GetNameNoTooltip] Sends Gold"
 nars_hegemon_feed_county_gift_desc: "The peasants of the [county_target.GetName] are enthused with your conquests and send you gold."
 nars_hegemon_feed_county_gift_herd: "[county_target.GetNameNoTooltip] Sends Herds"
 nars_hegemon_feed_county_gift_desc_herd: "The common herders of [county_target.GetName] are in awe of the great [ROOT.Char.GetTitleAsName], and present you with fine animals."
 nars_hegemon_feed_knight_joins: "$knight_culture_player_no_tooltip$ Joins Your Cause"
 nars_hegemon_feed_knight_joins_desc: "The $knight_culture_player_no_tooltip$ [knight.GetFullName] pledges [knight.GetHerHis] loyalty to you! (@skill_prowess_icon![knight.GetProwess])"
 nars_hegemon_feed_angry_vassal: "Dissatisfied Vassal Impressed"
 nars_hegemon_feed_angry_vassal_desc: "Your [vassal|E] [angry_vassal.GetFullName] is impressed by your conquests."
 nars_hegemon_feed_generous_courtier: "[generous_courtier.GetFirstName] Donates Gold"
 nars_hegemon_feed_generous_courtier_desc: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] donates gold to your cause!"
 nars_hegemon_feed_siege_engineer: "Siege Engineer Joins"
 nars_hegemon_feed_siege_engineer_desc: "The [GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"
 nars_hegemon_feed_logistician: "Logistician Joins"
 nars_hegemon_feed_logistician_desc: "The [GetTrait('logistician').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"