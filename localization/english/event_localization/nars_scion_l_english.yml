l_english:
 nikean_scion.1111.t: "To Rule the World"
 nikean_scion.1111.desc: "It is increasingly clear. From the lowest peasant to the most noble of my vassals — they are all whispering my name, whispering of my might, whispering of #EMP war!#! There's support for my cause, for my people see me as a ruler worthy of the world.\n\nThe strength of the [ROOT.Char.GetPrimaryTitle.GetBaseName] is mine to wield — and wield it I shall. To strike outwards is what's expected of me, to claim by might what should belong to me. I am destined to rule, to subjugate those around me and make them part of my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\nWith my people behind me, I cannot fail."
 nikean_scion.1111.desc.temujin: "\n\nFrom a blue-grey wolf and a fallow doe, I shall only offer ruin or submission."
 nikean_scion.1111.a: "Let the conquest begin!"
 conqueror_flavor: "You will start receiving support from your vassals and your people, but beware — you will see your support wane if you stay at peace for too long, lose too many wars, become the subject of another realm, or fall from grace...\n\nIf you die, your children are expected to take up the mantle of conquest."


 nikean_scion.0001.t:0 "Mēdèn Ága! Mōnarkhíad!"
 nikean_scion.0001.desc: "For untold time after our exile from the known world, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereign [hegemonies|E]. \n\nToday, as a [ROOT.Char.GetTitleAsNameNoTooltip], I pledge my [dynasty|E] as [narsokratia_possessive|E] restorationists.\n\nThe pretender [rulers|E] will soon realize that they are nothing more than temporary [stewards|E] of our future [domains|E], simply sitting themselves to keep the throne warm for their rightful [rulers|E]. We, the [nikeis|E], stand above them, blessed with a grace and perfection they can only ever envy." 
 nikean_scion.0001.a: "#emp The first step; never the last!#!"
 nikean_scion.0001.b: "I would rather stay here and smell the [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."

 
 nikean_scion.0002.t: "A Failed Mōnarkhíad"
 nikean_scion.0002.intro: "It is over. Former friends turn their backs, the steady stream of support is breaking, and my soldiers abandon their swords in disappointment.\n\n"
 nikean_scion.0002.peace: ""A 'great' conqueror that doesn't conquer, what a joke!" The voices of my subjects echo in my halls. "We didn't want peace, we wanted #EMP glory!#!""
 nikean_scion.0002.lost_wars: ""The [ROOT.Char.GetTitleAsNameNoTooltip] is weak." The voices of my subjects echo. "[root_scope.GetSheHe|U] has lost war after war, who would follow such an incompetent commander?""
 nikean_scion.0002.traitor: ""[root_scope.GetHerHis|U] mind is gone, there's no-one in there to lead us." My subjects whisper. "It was good while it lasted...""
 nikean_scion.0002.outro: "The words sting my ears.\n\nIt seems that my conquests are over. For now."
 nikean_scion.0002.a: "It was too good to be true..."
 conqueror_end_flavor: "You will no longer receive support from your vassals and people."
 
 conqueror_title: "You will no longer receive support from your vassals and people."
 monarkhiad_prefix: "Mōnarkhíad:"
 
 nikean_scion.1000.t: "$monarkhiad_prefix$ For the War Chest"
 nikean_scion.1000.desc: ""For the war chest." [generous_vassal.GetTitledFirstNamePossessive] missive reads. "Use these funds wisely, oh [ROOT.Char.GetTitleAsNameNoTooltip] — use them for stocking the armories, feeding the soldiers, or bolstering your ranks with mercenaries. I long to see the glory you will bring upon the [ROOT.Char.GetPrimaryTitle.GetBaseName]!"\n\nI can put this to good use."
 nikean_scion.1000.a: "This gold is most welcome."
 nikean_scion.1000.b: "Use the gold to attract mercenaries!"
 nikean_scion.1000.c: "Thank [generous_vassal.GetHerHim] most graciously, but I need no gifts!"
 mercenary_bolstering: "Ranks Bolstered by Mercenaries"
 mercenary_bolstering_desc: "This character has attracted the attention of many mercenaries, who flock to them for glory."

 nikean_scion.1100.t: "$monarkhiad_prefix$ Bolstered Ranks"
 nikean_scion.1100.desc: ""Greetings, my [ROOT.Char.GetTitleAsNameNoTooltip]." The $knight_culture_player_no_tooltip$ says, announcing [maa_leader.GetHerHis] prescence. "I am [maa_leader.GetFirstName], sent by [generous_vassal.GetTitledFirstName] to serve you — with me I bring a retinue of the finest soldiers that the [generous_vassal.GetCapitalLocation.GetTitle.GetName] can muster!"\n\n"All my [generous_vassal.GetTitleAsNameNoTooltip] asks is that you put us to good use, and direct us towards glory!" [maa_leader.GetSheHe|U] stands at attention."
 nikean_scion.1100.a: "I will set you up with quarters!"
 nikean_scion.1100.b: "Divide the men between my regiments."
 nikean_scion.1100.c: "[generous_vassal.GetFirstNameNoTooltip] is generous, but I have no need of you."
 maa_recruitment_boon: "Effective Men-at-Arms Recruitment"
 maa_recruitment_boon_desc: "This character is getting assistance from their vassals in recruiting professional soldiers."
 war_war_war_opinion: "War, War, War!"
 
 nikean_scion.1200.t: "$monarkhiad_prefix$ Release the Glory Hounds"
 nikean_scion.1200.desc: "The chants echo across my halls, my capital, my lands — across my entire realm; "War! War! War!" They say.\n\nMy glory-hungry vassals call for the blood of our enemies to be spilled, for me to bring upon us the renown that is my destiny.\n\nI have their unwavering support."
 nikean_scion.1200.a: "I will not let them down!"
 nikean_scion.1200.b: "If they want war, then I need soldiers."
 glory_hound_contribution: "Glory Hound Support"
 glory_hound_contribution_desc: "This character is garnering unwavering support from their [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] vassals."
 
 nikean_scion.1300.t: "$monarkhiad_prefix$ Popular Support"
 nikean_scion.1300.desc: ""M'[root_scope.GetLadyLord], m'[ROOT.Char.GetTitleAsNameNoTooltip|l], m'undisputed — most [root_scope.Custom('ComplimentAdjective')] #EMP liege!#!" The peasant sputters, prostrating [portrait_peasant.GetHerselfHimself] before me.\n\n"We of the humble hamlets of the [peasant_barony.GetBaseName] come bearing gifts — grain, game, and gold. We have toiled hard, but we know that you will bring prosperity!" [portrait_peasant.GetSheHe|U] continues.\n\nThey may be the lowliest of my subjects, but they would do anything I ask of them."
 nikean_scion.1300.a: "Wonderful gifts, I thank you all!"
 nikean_scion.1300.b: "When you see my soldiers — feed them."
 nikean_scion.1300.c: "Let your fields stay barren for a bit longer, I have need of you."
 peasant_supplies: "Widespread Peasant Support"
 peasant_supplies_desc: "This character is widely popular among the peasantry, who willingly give up more supplies than usual."
 peasant_draft: "Peasant Draft"
 peasant_draft_desc: "Peasants flock to the banners of this character, more than willing to take up arms in the levy."

 nikean_scion.1400.t: "$monarkhiad_prefix$ Errant-Hoplîtes"
 nikean_scion.1400.desc:0 "Rhythmic steps in cadence had long announced their arrival long before the unfamiliar band of [hoplites|E] reach my close vicinity. A company of [nikean|E] [men_at_arms|E], clad in arms that has seen better days, stands before me. Their leader, clearly a veteran of several [wars|E], approaches my figure awaiting them. \n\n"We are [mercenaries|E] looking for a permanent liege to serve," he declares, his posture perhaps a fraction too rigid for a man asking for potential employment on my doorsteps. \"With the right [gold|E] amount, we #emp could#! potentially help you against your enemies," the veteran said tersely with a glint on his eyes.\n\nIt is clear that he and his band of [hoplites|E] have ample experience. His offer #emp is#! quite tempting but I must ponder first."
 nikean_scion.1400.a: ""Shut up and take my gold...!""
 nikean_scion.1400.b: "I can surely persuade them to join... free of cost?"
 nikean_scion.1400.b.success_msg.t:0 "Persuasion: Success"
 nikean_scion.1400.b.success_msg.desc:0 "[hoplite.GetTitledFirstName] and his men have sworn themselves wholeheartedly!"
 nikean_scion.1400.b.failure_msg.t:0 "Persuasion: Fail"
 nikean_scion.1400.b.failure_msg.desc:0 "[hoplite.GetTitledFirstName] and his mercenaries departed for other fortunes!" 
 nikean_scion.1400.c: ""I have no need for you all. Begone!""
 
 conqueror_feed_county_gift: "[county_target.GetNameNoTooltip] Sends Gold"
 conqueror_feed_county_gift_desc: "The peasants of the [county_target.GetName] are enthused with your conquests and send you gold."
 conqueror_feed_county_gift_herd: "[county_target.GetNameNoTooltip] Sends Herds"
 conqueror_feed_county_gift_desc_herd: "The common herders of [county_target.GetName] are in awe of the great [ROOT.Char.GetTitleAsName], and present you with fine animals."
 conqueror_feed_knight_joins: "$knight_culture_player_no_tooltip$ Joins Your Cause"
 conqueror_feed_knight_joins_desc: "The $knight_culture_player_no_tooltip$ [knight.GetFullName] pledges [knight.GetHerHis] loyalty to you! (@skill_prowess_icon![knight.GetProwess])"
 conqueror_feed_angry_vassal: "Angry Vassal Impressed"
 conqueror_feed_angry_vassal_desc: "Your [vassal|E] [angry_vassal.GetFullName] is impressed by your conquests."
 conqueror_feed_generous_courtier: "[generous_courtier.GetFirstName] Donates Gold"
 conqueror_feed_generous_courtier_desc: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] donates gold to your cause!"
 conqueror_feed_siege_engineer: "Siege Engineer Joins"
 conqueror_feed_siege_engineer_desc: "The [GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"
 