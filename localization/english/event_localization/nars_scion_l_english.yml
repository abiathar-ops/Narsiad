l_english:
 nars_conqueror.1111.t: "To Rule the World"
 nars_conqueror.1111.desc: "It is increasingly clear. From the lowest peasant to the most noble of my vassals — they are all whispering my name, whispering of my might, whispering of #EMP war!#! There's support for my cause, for my people see me as a ruler worthy of the world.\n\nThe strength of the [ROOT.Char.GetPrimaryTitle.GetBaseName] is mine to wield — and wield it I shall. To strike outwards is what's expected of me, to claim by might what should belong to me. I am destined to rule, to subjugate those around me and make them part of my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\nWith my people behind me, I cannot fail."
 nars_conqueror.1111.desc.temujin: "\n\nFrom a blue-grey wolf and a fallow doe, I shall only offer ruin or submission."
 nars_conqueror.1111.a: "Let the conquest begin!"
 conqueror_flavor: "You will start receiving support from your vassals and your people, but beware — you will see your support wane if you stay at peace for too long, lose too many wars, become the subject of another realm, or fall from grace...\n\nIf you die, your children are expected to take up the mantle of conquest."


 nars_conqueror.0001.t:0 "Mēdèn Ága! Mōnarkhíad!"
 nars_conqueror.0001.desc: "For untold time after our exile from the known world, lesser [cultures|E] have called their rulers [emperors|E], believing that [soldiers|E] grants them the mandate to [usurp|E] our sovereign [hegemonies|E]. \n\nToday, as a [ROOT.Char.GetTitleAsNameNoTooltip], I pledge my [dynasty|E] as [narsokratia_possessive|E] restorationists.\n\nThe pretender [rulers|E] will soon realize that they are nothing more than temporary [stewards|E] of our future [domains|E], simply sitting themselves to keep the throne warm for their rightful [rulers|E]. We, the [nikeis|E], stand above them, blessed with a grace and perfection they can only ever envy." 
 nars_conqueror.0001.a: "#emp The first step; never the last!#!"
 nars_conqueror.0001.b: "I would rather stay here and smell the [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]..."

 
 nars_conqueror.0002.t: "A Failed Mōnarkhíad"
 nars_conqueror.0002.intro: "It is over. Former friends turn their backs, the steady stream of support is breaking, and my soldiers abandon their swords in disappointment.\n\n"
 nars_conqueror.0002.peace: ""A 'great' conqueror that doesn't conquer, what a joke!" The voices of my subjects echo in my halls. "We didn't want peace, we wanted #EMP glory!#!""
 nars_conqueror.0002.lost_wars: ""The [ROOT.Char.GetTitleAsNameNoTooltip] is weak." The voices of my subjects echo. "[root_scope.GetSheHe|U] has lost war after war, who would follow such an incompetent commander?""
 nars_conqueror.0002.traitor: ""[root_scope.GetHerHis|U] mind is gone, there's no-one in there to lead us." My subjects whisper. "It was good while it lasted...""
 nars_conqueror.0002.outro: "The words sting my ears.\n\nIt seems that my conquests are over. For now."
 nars_conqueror.0002.a: "It was too good to be true..."
 delay_scion.flavor: "You will no longer receive support from your vassals and people."
 
 conqueror_title: "You will no longer receive support from your vassals and people."
 monarkhiad_prefix: "Mōnarkhíad's"
 
 nars_conqueror.1100.t: "$monarkhiad_prefix$ Errant-Hoplîtes"
 nars_conqueror.1100.desc:0 "Rhythmic steps in cadence had long announced their arrival long before the unfamiliar band of [hoplites|E] reach my close vicinity. A company of [nikean|E] [men_at_arms|E], clad in arms that has seen better days, stands before me. Their leader, clearly a veteran of several [wars|E], approaches my figure awaiting them. \n\n"We are [mercenaries|E] looking for a permanent liege to serve," he declares, his posture perhaps a fraction too rigid for a man asking for potential employment on my doorsteps. \"With the right [gold|E] amount, we #emp could#! potentially help you against your enemies," the veteran said tersely with a glint on his eyes.\n\nIt is clear that he and his band of [hoplites|E] have ample experience. His offer #emp is#! quite tempting but I must ponder first."
 nars_conqueror.1100.a: ""Shut up and take my gold...!""
 nars_conqueror.1100.b: "I can surely persuade them to join... free of cost?"
 nars_conqueror.1100.b.success_msg.t:0 "Persuasion: Success"
 nars_conqueror.1100.b.success_msg.desc:0 "[hoplite.GetTitledFirstName] and his men have sworn themselves wholeheartedly!"
 nars_conqueror.1100.b.failure_msg.t:0 "Persuasion: Fail"
 nars_conqueror.1100.b.failure_msg.desc:0 "[hoplite.GetTitledFirstName] and his mercenaries departed for other fortunes!" 
 nars_conqueror.1100.c: ""I have no need for you all. Begone!""
 
 nikean_scion_feed_county_gift: "[county_target.GetNameNoTooltip] Sends Gold"
 nikean_scion_feed_county_gift_desc: "The peasants of the [county_target.GetName] are enthused with your conquests and send you gold."
 nikean_scion_feed_county_gift_herd: "[county_target.GetNameNoTooltip] Sends Herds"
 nikean_scion_feed_county_gift_desc_herd: "The common herders of [county_target.GetName] are in awe of the great [ROOT.Char.GetTitleAsName], and present you with fine animals."
 nikean_scion_feed_knight_joins: "$knight_culture_player_no_tooltip$ Joins Your Cause"
 nikean_scion_feed_knight_joins_desc: "The $knight_culture_player_no_tooltip$ [knight.GetFullName] pledges [knight.GetHerHis] loyalty to you! (@skill_prowess_icon![knight.GetProwess])"
 nikean_scion_feed_angry_vassal: "Angry Vassal Impressed"
 nikean_scion_feed_angry_vassal_desc: "Your [vassal|E] [angry_vassal.GetFullName] is impressed by your conquests."
 nikean_scion_feed_generous_courtier: "[generous_courtier.GetFirstName] Donates Gold"
 nikean_scion_feed_generous_courtier_desc: "Your [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_courtier'))] [generous_courtier.GetFullName] donates gold to your cause!"
 nikean_scion_feed_siege_engineer: "Siege Engineer Joins"
 nikean_scion_feed_siege_engineer_desc: "The [GetTrait('military_engineer').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"
 nikean_scion_feed_logistician: "Logistician Joins"
 nikean_scion_feed_logistician_desc: "The [GetTrait('logistician').GetName( GetNullCharacter )] [new_commander.GetFullName] joins your ranks!"