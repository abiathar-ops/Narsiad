l_english:
 narsil_name: "Narsíl"
 narsil_desc: "Narsíl is an heirloom longsword from the old Knós hegemons. Shattered in the civil wars among the men of Knósioi and now mended, Narsíl awaits the inevitable day when it will rally the scattered Knóss to unity."
 anduril_name: "Onduríl"
 anduril_desc: "An heirloom passed through the surviving nobles in exile, Onduríl's scrolls details the cultural knowledge regarding the ancient Knósioi and thus is considered a holy relic for its importance in its revival."
 anduril_tooltip: "You gain an [artifact|E], an aging scroll of wisdom. This heirloom provides significant [character|E] bonuses."