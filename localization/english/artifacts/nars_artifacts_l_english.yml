l_english:
 narsil_name: "Narsíl"
 narsil_desc: "Narsíl is an heirloom longsword from the old [nikean|E] hegemons. Shattered in the civil wars among the men of Nikēís and now mended, Narsíl awaits the inevitable day when it will rally the scattered Nikeans to a unified Nārsokratía."
 anduril_name: "Anduríl"
 anduril_desc: "An heirloom passed through the surviving aristocracy in exile, Anduríl's scrolls details the cultural knowledge regarding the ancient Nikēís and thus is considered a holy relic by the Panteíon for its importance in its revival."