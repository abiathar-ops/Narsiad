l_english:
 narsil_name: "Narsíl"
 narsil_desc: "Narsíl is an heirloom longsword of the dynasty of Narsid Hegemons. Shattered in the civil wars among the Men of Narses and now mended, Narsíl awaits the inevitable day when it will rally the fragmented Men of Narsēs to a returned Nārsokratía."
 anduril_name: "Anduríl"
 anduril_desc: "An heirloom passed through the surviving aristocracy on the mountain-passes in exile, Anduríl's scrolls details the cultural knowledge regarding the ancient Men of Narsēs and thus is considered a holy relic by the Panteíon for it's importance in its revival."