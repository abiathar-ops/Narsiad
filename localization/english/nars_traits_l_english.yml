l_english: 
 trait_nars_trait: "Narsēs Lineage"
 trait_nars_trait_desc: "The works this bloodline has set into the order of the world are not given to forgetting. From it comes a sacred scion, born of faith and gunpowder."
 trait_nars_trait_character_desc: "The works [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] bloodline has set into the order of the world are not given to forgetting. [ROOT.GetCharacter.GetSheHe|U] stands as a sacred scion, born of faith and gunpowder."
 descendants_gain_nars_trait: "Your descendants receive the mark of the [GetTrait('nars_trait').GetName( GetNullCharacter )]"

 trait_track_hoplites:0 "Hoplitēs"
 trait_track_hoplites_desc:0 "Black powder and prayer are his language; blood and iron his grammar. In ordered ranks he does not waver; in the smoke of chaos he restores command."
 trait_track_sophos:0 "Sophóses"
 trait_track_sophos_desc:0 "He rules himself first; knowledge is his power, quiet and feared by all. Through wisdom and discipline, he bends the world to his will."

 nars_ageless_appearance_tt:0 "This character does not visually age, though they remain bounded by mortal coil and the vicissitudes of time."

 TRAIT_FLAG_DESC_nars_visuals: "[character|E] will remain youthful"