 trait_track_hoplos:0 "Oplît"
 trait_track_hoplos_desc:0 "Bloody prayers are his language; blood and iron his words. In ordered ranks he does not waver; in the smoke of turmoil he restores command."
 trait_track_sophes:0 "Sophós"
 trait_track_sophes_desc:0 "He rules himself first; knowledge is his power. Through wisdom and wit, he bends the world to his will."

 nars_ageless_appearance_tt:0 "This character does not visually age, though they remain bounded by mortal coil and the vicissitudes of time."

 TRAIT_FLAG_DESC_nars_visuals: "[character|E] will remain youthful"

