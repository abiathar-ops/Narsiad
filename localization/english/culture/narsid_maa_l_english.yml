l_english:
 maa_hoplitai: "Hoplîtes"
 maa_hoplitai_flavor: "To be a hoplite is to be a single link in an iron chain; to be the bronze-clad wall upon which empires break. Hoplîtes are a sacred and revered caste, raised from birth to fight and die for the polity."

 maa_mastiges: "Mástiges"
 maa_mastiges_flavor: "The Mástigēs, raised in iron halls that echo with sacred hymns and war drums, are an ironclad schiltron of swordsmen, pikemen and arquebusiers waiting to be feared across continents of which they ravage."