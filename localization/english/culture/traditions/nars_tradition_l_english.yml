 # Ethos
 ethos_nars_name:0 "Hermetic"
 ethos_nars_desc:1 "Through the preservation of ancient knowledge and the guarding of hidden truths, this culture ensures their survival in a world that has forgotten them."
 # Traditions
 #tradition_nars_war_name:0 "Art of War"
 # tradition_nars_war_desc:1 "Narsids have perfected the art of warfare, mastering strategies and tactics that allow them to outmaneuver and outfight their enemies on the battlefield. Their soldiers are disciplined, well-trained, and equipped with superior weaponry, making them a formidable force in any conflict."
 # tradition_nars_science_name:0 "Pursuit of Knowledge"
 # tradition_nars_science_desc:1 "The Nars have a deep-seated belief in the pursuit of knowledge and scientific advancement. They invest heavily in education and research, fostering a culture of innovation and intellectual curiosity. This tradition has led to numerous breakthroughs in various fields, from medicine to engineering."
 # tradition_nars_builder_name:0 "Master Builders"
 # tradition_nars_builder_desc:1 "The Nars are renowned for their architectural prowess and engineering skills. They have a long history of constructing impressive structures, from grand palaces to intricate fortifications. This tradition emphasizes the importance of craftsmanship, durability, and aesthetic beauty in their buildings."
 # tradition_nars_unique_1_name:0 "Agricultural Expertise"
 # tradition_nars_unique_1_desc:1 "The Nars have developed advanced agricultural techniques that allow them to maximize crop yields and sustain large populations. This tradition focuses on soil management, irrigation systems, and crop rotation, ensuring food security and prosperity for their communities."