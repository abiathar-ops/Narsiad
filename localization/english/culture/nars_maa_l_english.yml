l_english:
 maa_hoplitai: "Hoplîtes"
 maa_hoplitai_flavor: "To be a [hoplite|E] is to be a single link in an iron chain; to be the bronze-clad wall upon which empires break. They are a sacred and revered caste, raised from birth to fight and die for the polity."

 maa_mastiges: "Mástiges"
 maa_mastiges_flavor: "The [mastiges|E], raised in halls that echo with sacred hymns and war drums, are an ironclad schiltron of swordsmen, pikemen, bombardiers and arquebusiers formed from the finest armaments and soldiers."