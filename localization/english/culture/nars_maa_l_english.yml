l_english:
 
 maa_hoplitai: "Hoplîtes"
 maa_hoplitai_flavor: "To be a hoplite is to be a single link in an iron chain; to be the bronze-clad wall upon which empires break. Hoplîtes are a sacred and revered caste, raised from birth to fight and die for the polity."

 maa_optimates: "Optimátēs"
 maa_optimates_flavor: "Optimátēs are war-bred orphans raised in cloisters where prayers are spoken over duels and quarrels. Each warrior is taught that the bloody tension of war mirrors the soul pulled taut between duty and death."

 maa_mastiges: "Mástiges"
 maa_mastiges_flavor: "The Mástigēs, an iron-clad caste feared across continents. Raised in iron halls that echo with sacred hymns and war drums, they are taught from youth that the battlefield is a tribunal and the charge is its sentence."