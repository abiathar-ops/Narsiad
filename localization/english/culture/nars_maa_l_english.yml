l_english:
 nars_hoplites: "Hoplitai"
 nars_hoplites_desc: "The Hoplitai are the backbone of Narsic military might. Clad in sturdy armor and wielding long spears, they form unbreakable phalanxes that can withstand even the most brutal assaults."
 nars_epilektoi: "Epilektoi"
 nars_epilektoi_desc: "The Epilektoi are elite infantry units, trained for rapid maneuvers and specialized combat roles. Their agility and precision make them invaluable in both offensive strikes and defensive holds."
 nars_hetairoi: "Hetairoi"
 nars_hetairoi_desc: "The Hetairoi are the elite heavy cavalry of the Narsid military. They are heavily armored and equipped with long lances, making them formidable in both shock combat and skirmishing."
 nars_lineman: "Athanatoi"
 nars_lineman_desc: "The Athanatoi are a specialized infantry unit, trained for defensive positions and holding the line against enemy advances. Their disciplined formations make them a cornerstone of Narsic defensive strategy."
 nars_mastiges: "Mastiges"
 nars_mastiges_desc: "The Mastiges are elite heavy infantry units, renowned for their strength and resilience in prolonged combat. They serve as the primary shock troops in Narsic military campaigns."