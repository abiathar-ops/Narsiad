l_english: 
 # ── EXISTING ENTRIES (unchanged) ──
 decision_group_type_nikean: "Nikean Decisions"
 decision_group_type_nikean_2: "Narsiad - Minor Decisions"

 narsokratia_empire_above: "You require a [narsokratia|E] [rank|E] of [empire|E] or above!"

 decision_develop_industry: "Develop Industry"
 decision_develop_industry_tooltip: "Unleash the industrial power of the [nikeanrealm|E]!"
 decision_develop_industry_desc: "Now as our [nikean|e] polity's grows, it is time to develop it into the most prosperous [domain|E] in the world. This [region|E] has too long lay empty and desolate. Let the wheels spin and the metal glow for the [development|e] of our revived [realm|E] and the [nikeis|E]!" 
 decision_develop_industry_confirm: "Let the forges roar!"
 decision_develop_industry_tt: "Unleash the industrial power of the [nikeanrealm|E]!"

 decision_spy_network: "Recruit the Synodian Spies"
 decision_spy_network_desc: "A perfect [realm|E] requires perfect [intrigue|E]. While our [hoplites|E] secure the borders, treason often breeds in the shadows of alleyways and traded for coin in the dark. By exploiting the vices of the populace, we will hear every [secret|E] and uncover every plot before it draws breath."
 decision_spy_network_confirm: "[enuo|E], protect us!"
 decision_spy_network_tt: "Hires the Silent Synod to monitor the [nikeanrealm|E]."
 decision_spy_network_tooltip: "Hires a network to thwart [hostile_schemes|E]!"
 decision_spy_network_effect_tooltip: "Hires a network to thwart [hostile_schemes|E] and raise [control|E]!"

 decision_libation: "Dedicate Libation"
 decision_libation_desc: "A quiet biannual [cultural|E] observance done in the privacy of one's own chambers. The ritual involves a dedication of wine, representing the blood of the [dead_soldiers|E] of our [wars|E] that sacrificed themselves for [narsokratia|E]. Perhaps it's time that I pour my own vintage, luscious wine unto the altar and recite the sacred prayers to [narses|E] in accordance with the old [orphic|E] faith of the ancient [nikeis|E]."
 decision_libation_tooltip: "Settle in to pour a libation and reflect on the day."
 decision_libation_effect_tooltip: "You may lose some [stress|E] and gain a small amount of [piety|E]!"
 decision_libation_effect_desc: "You offer a libation to the [nikeis|E] [panteion|E] and reflect on your [faith|E]"
 decision_libation_confirm: "Pour the libation!"

 decision_introduce_bigamy: "Decree Marital Revisions"
 decision_introduce_bigamy_desc: "The constraints of [nikean|E] #V Monogamy#! are too limiting for the [rulers|E] of the [nikean|E] [dynasty|E]. By decree, we could allow an additional spouse to secure our [realm|E] and expand our [alliances|E]. This change is a departure from traditional [marriage|E] [doctrines|E], but it is necessary for our [realm|E]."
 decision_introduce_bigamy_tooltip: "You decree that [rulers|E] of your [faith|E] may take an additional [spouse|E]"
 decision_nikean_introduce_bigamy_effect_tooltip: "Your [nikean|E] [faith|E] abandons its previous rules and adopts a different [marriage|E] [doctrine|E]"
 decision_introduce_bigamy_confirm: "Two is better than one!"
 nikean_faith.1021.a.bigamy_tt: "Your [nikean|E] [faith|E] will permit [rulers|E] of your [faith|E] to take #P 2#! spouses simultaneously"
 nikean_faith.1021.b.trigamy_tt: "Your [nikean|E] [faith|E] will permit [rulers|E] of your [faith|E] to take #P 3#! spouses simultaneously"

 decision_establish_aretaic_school: "Establish the Scholí"
 decision_establish_aretaic_school_desc: "The [nikeans|E] are a [culture|E] that espouses [innovation|E], yet it's undeniable that other barbaric [realms|E] have closen the gap while the [nikeis|E] was in exile. I shall expend our [gold|E] to establish an innovating [building|E] of perfected learning. #V Aretaiké Scholí#!, the [nikean|E] bastion of learning."
 decision_establish_aretaic_school_tooltip: "Found a university dedicated to the [nikean|E] pursuit of [innovation|E]."
 decision_establish_aretaic_school_effect_tooltip: "A Special [building|E] slot will be added to the [capital|E] of one of your [county|E] and the #V Aretaiké Scholí#! will be available to be constructed."
 decision_establish_aretaic_school_confirm: "Select a Barony!"
 establish_aretaic_school_no_barony_tt: "You must personally hold a [barony|E] that does not already have a Special Building Slot"
 pick_aretaic_school_barony: "Pick the Archive's Location"
 pick_aretaic_school_barony_desc: "The intent is clear and my people inspired. My lands are ripe for new schools of archives for my [realm|E], but where exactly should it be built?"
 pick_aretaic_school_barony_confirm: "Clear the grounds!"
 pick_aretaic_school_barony_custom_tt: "You will now choose a held [barony|E] for your Special [building|E]\n#weak It must be the capital of its [county|E], not be [leased|E], and not already have a [special_building|E] Slot#!"

 decision_munitions_research: "Harness Gunpowder"
 decision_munitions_research_desc: "A new substance has been disbursed from the distant [regions|E] of [GetTitleByKey('h_china').GetNameNoTier]. A powder of blackish hue that is known to be volatile, this secretive essence may be reliably deployed if researched. Perhaps we may sponsor alchemical [prestige|E] to be manufactured, a marvel of [innovation|E]."
 decision_munitions_research_tooltip: "Enable the recruitment of [GetMaA('maa_mastiges').GetName] [men_at_arms|E] armed with new armaments!"
 decision_munitions_research_confirm: "Blood and iron!"

 munitions_research_capital_unoccupied_tt: "[capital|E] is not [occupied|E]"
 munitions_research_3_years_tooltip: "If you complete the [GetScheme('munitions_research_scheme').GetTypeName] [scheme|E], your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"
 munitions_research_mastiges_tooltip: "Unlocks the recruitment of the [GetMaA('maa_mastiges').GetName] as [men_at_arms|E]"
 munitions_research_success_tooltip: "On Success, your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"

 decision_k_narsokratia: "Proclaim a Despotēia Realm"
 decision_k_narsokratia_desc: "The squabbling [rulers|E] and warlords of this [era|E] mistake their disorganized [realms|E] for true nations. By uniting the pacified [provinces|E], I shall reintroduce the concept of [narsokratia|E] to these [land|E], forging a [kingdom|E] that will belong to my [dynasty|E] for all time."
 decision_k_narsokratia_confirm: "Gather the realm"
 decision_k_narsokratia_tooltip: "Found an entirely new Despotēia title"
 decision_k_narsokratia_effect_tooltip: "Establish [GetTitleByKey('k_narsokratia').GetName] as your [primary_title|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey('k_narsokratia').GetName] will have the [de_jure|E] of held [duchies|E]\n$EFFECT_LIST_BULLET$[vassal|E] [rulers|E] will have a chance to convert to your [faith|E] and [culture|E]\n$EFFECT_LIST_BULLET$Unlocks [decision|E] to form [GetTitleByKey('e_narsokratia').GetName]"
 create_title_every_held_duchy: "Every [duchy|E] title you [hold|E] or [completely_control|E]"
 create_nikean_kingdom_de_jure_changes: "Becomes [de_jure|E] [duchies|E] of your new Despotēia"

 decision_e_narsokratia: "Proclaim an Ōtarkhia Realm"
 decision_e_narsokratia_desc: "The pretender [rulers|E] who currently call themselves [emperors|E] are merely [nomadic|E] [stewards|E] occupying our [nikean|E] [domains|E]. I shall create an [empire|E] of the [nikeis|E] to outshine their mockery of a [realm|E] and outlast history itself!"
 decision_e_narsokratia_effect_tooltip: "Establish [GetTitleByKey('e_narsokratia').GetName] as your [primary_title|E]\n$EFFECT_LIST_BULLET$[GetTitleByKey('e_narsokratia').GetName] will have the [de_jure|E] of held [kingdoms|E]\n$EFFECT_LIST_BULLET$[vassal|E] [rulers|E] will have a chance to convert to your [faith|E] and [culture|E]\n$EFFECT_LIST_BULLET$All [vassals|E] will convert to [administrative|E] [government|E]\n$EFFECT_LIST_BULLET$Unlocks [decision|E] to form [GetTitleByKey('h_narsokratia').GetName]"
 decision_e_narsokratia_confirm: "Power is a ladder!"
 decision_e_narsokratia_tooltip: "Found an entirely new Ōtarkhia title"
 create_title_every_held_kingdom: "Every [kingdom|E] title you [hold|E] or [completely_control|E]"
 create_nikean_empire_de_jure_changes: "Becomes [de_jure|E] [kingdoms|E] of your new Ōtarkhia"
 found_e_narsokratia_decision_three_kingdoms_held: "You must control at least three kingdom titles"

 decision_h_narsokratia: "Restore the Old Nārsokratía"
 decision_h_narsokratia_confirm: "Let us rejoice!"
 decision_h_narsokratia_tooltip: "The old [nikeanrealm|E] will be restored!"
 decision_h_narsokratia_desc: "We have outgrown the confines of mere [empires|E]. If key territories of the present [realms|E] could be pacified, our [realm|E] would win [prestige|E] and [renown|E] in the eyes of all [nikeis|E] and the other barbaric [cultures|E] as the undisputed continuation of the [nikeanrealm|E] of antiquity. \n\nThe [narsokratia|E] of our [realm|E] will be the rightful inheritors of the world."
 decision_h_narsokratia_effect_tooltip: "Establish [GetTitleByKey('h_narsokratia').GetName] as your [primary_title|E]\n$EFFECT_LIST_BULLET$All [vassals|E] converted to [administrative|E] [government|E]\n$EFFECT_LIST_BULLET$[vassal|E] [rulers|E] will have a chance to convert to your [faith|E] and [culture|E]\n$EFFECT_LIST_BULLET$Unlocks a full [culture|E] and [faith|E] conversion [decision|E] in the [realm|E]"
 decision_h_narsokratia_troop_effect_tooltip: "You get an #bold undyingly loyal#! [army|E] of [nikean|E] [soldiers|E]:\n$BULLET_WITH_TAB$#V 500#! $maa_mastiges$ #weak ([gunpowder|E])#!\n$BULLET_WITH_TAB$#V 1000#! $maa_hoplitai$ #weak ([heavy_infantry|E])#!" 
 require_narsil_artifact_tooltip: "You possess the longsword #V Narsíl#!"

 decision_mend_narsil: "Reforge the Longsword Narsíl"
 decision_mend_narsil_desc: "During the [civil_wars|E] sorrounding the fall of Ancient [narsokratia|E], the longsword [narsil|E] was shattered. Its shards however, still remains with us as an heirloom from a line of [nikean|E] [hegemons|E]. Mending the shards and reforging the [artifact|E] is not just a [virtuous|E] undertaking but a necessity."
 decision_mend_narsil_effect_tooltip: "Reforge and claim [narsil|E] as an [artifact|E]."
 decision_mend_narsil_tooltip: "Reforge the heirloom of the old [nikean|E] [hegemons|E]!"
 decision_mend_narsil_confirm: "To our foundries!"

 # ── NEW DECISIONS ──

 # Arrival notification message
 nikean_courtiers.0001.t: "A Nikean Arrives"
 nikean_courtiers.0001.desc: "Answering our herald's call, a new exiled Nikean Courtier has arrived at [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"

 decision_nikean_evangelize_realm: "Proselytize Dogma"
 decision_nikean_evangelize_realm_desc: "It is not enough to rule over our [vassals|E] with steel; we must ensure their [faith|E] as well. I shall sponsor a tidal wave of evangelism across the [realm|E], ensuring that the unwashed [vassals|E] of our [region|E] see reason of our [nikean|E] [faith|E] of yore, untainted from the fall of Old [narsokratia|E]."
 decision_nikean_evangelize_realm_tooltip: "Pressure [realm|E] to adopt [nikean] [culture|E] and [faith|E]"
 decision_nikean_evangelize_realm_confirm: "Send the vestals!"
 decision_nikean_evangelize_realm_effect_tooltip: "Portions of your [realm|E]'s counties will have a chance to convert to the [nikean|E] [faith|E] and [culture|E]"

 recruit_nikean_courtier_decision: "Muster the Nikēís"
 recruit_nikean_courtier_decision_desc: "The [nikeans|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch heralds to scale those miserable peaks and drag them down to our [court|E]. It is time to bring those damn lazy [nikeis|E] hermits down!"
 recruit_nikean_courtier_decision_tooltip: "Send out heralds to find [nikeans|E] to your [court|E]" 
 recruit_nikean_courtier_decision_confirm:0 "Send the heralds!"

 CHOOSE_NARSID_COURTIERS_DECISION_NEXT_STEP_BUTTON: "Proceed!"
 hire_nikean_1_decision:0 "Search for [nikeis|E]"
 hire_nikean_1_decision_tooltip:3 "At least #P 3#! [nikeis|E] will arrive as [guests|E] to your [court|E] within the coming months"
 hire_nikean_1_decision_desc: "A $nikean_1_court_position$ is essential to care for the sick and wounded at my [ROOT.Char.Custom('GetCourtLower')]. I will ask my servants to bring forth a number of suitable candidates."
 hire_nikean_1_decision_effect_tooltip:4 "Your servants will suggest a number of suitable [nikeis|E] for your court"

 hire_nikean_2_decision:0 "Scout for a [sophes|E]"
 hire_nikean_2_decision_tooltip:0 "You will receive #P 2#! suitable [sophes|E] prospects for you to choose for your [court|E] as a [courtier|E]"
 nikean_2_court_position_custom_desc: "$EFFECT_LIST_BULLET$Provides @travel_safety_icon![travel_safety|E] and @travel_speed_icon![travel_speed|E] during [travels|E]"
 hire_nikean_2_decision_desc:0 "A good $nikean_2_court_position$ is the key to a successful journey. I will request for a number of suitable candidates to be suggested."

 recruit_nikean_1_cooldown_tt: "Search for [nikeis|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_nikean_1_cooldown' ))]"
 recruit_nikean_2_cooldown_tt: "Scout for a [sophes|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_nikean_2_cooldown' ))]"



