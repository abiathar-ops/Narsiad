 decision_libation: "Pour a Libation"
 decision_libation_desc: "A quiet, domestic religious observance done in the privacy of the ruler's own chambers before a meal or before bed, rather than a grand public ceremony. It represents the everyday, habitual comfort of [faith|E] as a [menofnars|E]. I pour some of my vintage, luscious wine unto my altar and recite the sacred prayers to the [ROOT.Char.GetFaith.HouseholdGodName]."
