l_english: 
 # ── EXISTING ENTRIES (unchanged) ──
 decision_group_type_nikean: "Nikean Decisions"
 decision_group_type_restorationist: "Narsokratía Decisions"
 narsokratia_kingdom_above: "Your [realm|E] requires a [rank|E] of [kingdom|E] or above!"

 # ── Faith ──
 decision_nikean_faith_choice:0 "Enact Panteíon Rites"
 decision_nikean_faith_choice_desc:0 "Only by [faith|E] could we [nikeis|E] come to understand the roots of our old [culture|E]. My [legitimacy|E] is only a favor bestowed by the [panteion|E] and to neglect our [traditions|E] is to invite ruin on my [house|E]. Besides, while walking to a [temple|E] is tiring, arguing with my [council|E] is even worse!"
 decision_nikean_faith_choice_tooltip:0 "Enact rites to dedicate yourself to the [panteion|E]"
 decision_nikean_faith_choice_confirm:0 "Proceed!"
 
 faith_nikean_1_decision_name:0 "Dedicate a Libation"
 faith_nikean_1_decision_desc:0 "Enact [nikean|E] rites to dedicate yourself to your [culture|E]."
 decision_libation_effect_tooltip: "You may lose some [stress|E] and gain a small amount of [piety|E]!"
 decision_libation_effect_desc: "You offer a libation to the [nikeis|E] [panteion|E] and reflect on your [faith|E]"
 decision_libation_confirm: "Pour the libation!"

 faith_nikean_2_decision_name:0 "Ponder the [panteion|E]"
 faith_nikean_2_decision_desc:0 "Decide your favored patron god of the [panteion|E]."
 change_to_faith_nikean_2_decision_desc_1:0 "You [decide|E] which patron God of the [panteion|E] calls to you the most"
 change_to_faith_nikean_2_decision_desc_2:0 "You gain a [modifier|E] that reflects the values of your chosen patron God!"

 faith_nikean_3_decision_name:0 "Impose [nikeis|E] Heritage"
 faith_nikean_3_decision_desc:0 "Evangelize your [realm|E] to the Panteíon of our [tradition|E]."
 change_to_faith_nikean_3_decision_desc_1:0 "Every [province|E] of your [realm|E] has a chance to convert to your [faith|E] and [culture|E]!\n$EFFECT_LIST_BULLET$This [decision|E] #emp will#! cause the lost of [control|E] in the converted [province|E]!"
 change_to_faith_nikean_3_decision_desc_2:0 "The efficacy of this [decision|E] scales with [narsokratia|E] [title_ranks|E]!"

 faith_nikean_4_decision_name:0 "Sponsor [orphic|E] Missionaries"
 faith_nikean_4_decision_desc:0 "Sponsor an [orphic|E] missionary to spread the teachings of the [nikean_faith|E] to neighbouring [realms|E]!"
 change_to_faith_nikean_4_decision_desc_1:0 "You will sponsor an [orphic|E] missionary to try to convert a neighboring [ruler|E] of a different [faith|E] religion than [GetReligionByKey('nikean_religion').GetName]!\n$EFFECT_LIST_BULLET$If successful, the [ruler|E] will convert to your [faith|E]\n$EFFECT_LIST_BULLET$In addition, if successful, you will gain a [legend_seed|E]"

 faith_nikean_1_decision_tooltip: "Settle in to pour a libation and reflect on your [faith|E]"
 faith_nikean_2_decision_tooltip: "Ponder the [panteion|E] and embody values of your patron God"
 faith_nikean_3_decision_tooltip: "Forcibly convert your [provinces|E] to the [orphic|E] [faith|E]"
 faith_nikean_4_decision_tooltip: "Sponsor an [orphic|E] missionary to spread the teachings of the [nikean_faith|E] to neighbouring [realms|E]"

 faith_nikean_1_cooldown_tt: "Dedicate a Libation is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_nikean_1_cooldown' ))]"
 faith_nikean_2_cooldown_tt: "Ponder the [panteion|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_nikean_2_cooldown' ))]"
 faith_nikean_3_cooldown_tt: "Impose [nikean_faith|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_nikean_3_cooldown' ))]"
 faith_nikean_4_cooldown_tt: "Sponsor [orphic|E] Missionaries is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_nikean_4_cooldown' ))]"
  
 # ── Construction ──

 decision_establish_aretaic_school: "Establish a Scholar-Citadel"
 decision_establish_aretaic_school_desc: "The [nikeans|E] possess a [culture|E] that espouses [innovation|E], and yet it's undeniable that other barbaric [realms|E] have closen the gap while the [nikeis|E] was in exile. I shall expend our [gold|E] to establish an innovating [building|E] of perfected learning. A new [GetBuilding('aretaic_school_02').GetName] for [education|E]."
 decision_establish_aretaic_school_tooltip: "Found a university for the pursuit of [innovation|E]"
 decision_establish_aretaic_school_effect_tooltip: "A [special_building|E] slot will be added to the [capital|E] of one of your [county|E] and the #V Aretaiké Scholí#! will be available to be constructed"
 decision_establish_aretaic_school_confirm: "Select a Barony!"
 establish_aretaic_school_no_barony_tt: "You must personally hold a [barony|E] that does not already have a [special_building|E] slot"
 pick_aretaic_school_barony: "Pick the Archive's Location"
 pick_aretaic_school_barony_desc: "The intent is clear and my people inspired. My lands are ripe for new schools of archives for my [realm|E], but where exactly should it be built?"
 pick_aretaic_school_barony_confirm: "Clear the grounds!"

 decision_establish_brothel: "Open a Brothel-Complex"
 decision_establish_brothel_desc: "It is undeniable that ethnic [nikeans|E] are few in numbers. I shall expend our [gold|E] to establish a [building|E] of hedonism to cultivate a [breeding|E] programme. A [GetBuilding('brothel_complex_02').GetName], brothel-complexes fit to espouse certain necessary ideas. I shall dedicate this [building|E] of [fertility|E] to [enuo|E]."
 decision_establish_brothel_tooltip: "Found a [building|E] dedicated to the pursuit of [fertility|E]"
 decision_establish_brothel_effect_tooltip: "A [special_building|E] slot will be added to the [capital|E] of one of your [county|E] and the #V Hedonēion#! will be available to be constructed"
 decision_establish_brothel_confirm: "Select a Barony!"
 establish_brothel_no_barony_tt: "You must personally hold a [barony|E] that does not already have a [special_building|E] slot"
 pick_brothel_barony: "Pick the Brothel's Location"
 pick_brothel_barony_desc: "The intent is clear and my people inspired. My lands are ripe for new schools of archives for my [realm|E], but where exactly should it be built?"
 pick_brothel_barony_confirm: "Clear the grounds!"

 pick_special_building_barony_custom_tt: "You will now choose a held [barony|E] for your [special_building|E]\n#weak It must be the capital of its [county|E], not be [leased|E], and not already have a [special_building|E] Slot#!"

 # ── Foundries ──

 decision_munitions_research: "Found the Mástiges"
 decision_munitions_research_desc: "A new substance has been disbursed from the distant [regions|E] of [GetTitleByKey('h_china').GetNameNoTier]. A black powder that is known to hold untold potential. These 'firearms' may be reliably deployed if properly researched, and already my [marshal|E] keeps droning about the potential of equipping my [hoplites|E] with them."
 decision_munitions_research_tooltip: "Enable the recruitment of [GetMaA('maa_mastiges').GetName] [men_at_arms|E] armed with new armaments!"
 decision_munitions_research_confirm: "Blood and iron!"

 munitions_research_capital_unoccupied_tt: "[capital|E] is not [occupied|E]"
 munitions_research_3_years_tooltip: "If you complete the [GetScheme('munitions_research_scheme').GetTypeName] [scheme|E], your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"
 munitions_research_mastiges_tooltip: "Unlocks the recruitment of the [GetMaA('maa_mastiges').GetName] [men_at_arms|E]"
 munitions_research_success_tooltip: "On Success, your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"

 decision_mend_narsil: "Reforge the Longsword Narsíl"
 decision_mend_narsil_desc: "During the [civil_wars|E] sorrounding the fall of Ancient [narsokratia|E], the longsword [narsil|E] was shattered. Its shards however, still remains with us as an heirloom from a line of [nikean|E] [hegemons|E]. Mending the shards and reforging the [artifact|E] is not just a [virtuous|E] undertaking but a necessity."
 decision_mend_narsil_effect_tooltip: "Reforge and claim [narsil|E] as an [artifact|E]"
 decision_mend_narsil_tooltip: "Reforge the heirloom of the old [nikean|E] [hegemons|E]!"
 decision_mend_narsil_confirm: "To our foundries!"

 # ── Imperial Decisions ──

 decision_nikean_imperial_administration: "Issue Imperial Decrees"
 decision_nikean_imperial_administration_desc: "As the [ruler|E] of an [empire|E] held by the [nikeis|E], the vast machinery of the [realm|E] rests solely in my hands. The old [narsokratia|E] of yore had thrived because it directed its boundless resources with calculated precision. It is precisely why I must issue decrees to secure our desired [hegemony|E]!"
 decision_nikean_imperial_administration_tooltip: "Issue a grand decree to bolster the administration of your Empire"
 decision_nikean_imperial_administration_confirm: "Send the edict!"
  
 nikean_realm_1_decision_name: "Develop Industry"
 nikean_realm_1_decision_desc: "Invest heavily in the development of [buildings|E] of our great empire."
 nikean_realm_1_decision_tooltip: "Invest in the [development|E] of [buildings|E] of the [realm|E]!"
 nikean_realm_1_cooldown_tt: "Develop Industry is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nikean_realm_1_cooldown' ))]"
 change_to_nikean_realm_1_decision_desc_1: "$industrial_boom_province_tt$"

 nikean_realm_2_decision_name: "Hire Synods"
 nikean_realm_2_decision_desc: "Establish a sprawling, invisible web of operatives to act as your yes and ears."
 nikean_realm_2_decision_tooltip: "Establish an invisible web of intrigue for [control|E]!"
 nikean_realm_2_cooldown_tt: "Hire Synods is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nikean_realm_2_cooldown' ))]"
 change_to_nikean_realm_2_decision_desc_1: "$spy_network_province_tt$"

 nikean_realm_3_decision_name: "Distribute Propaganda"
 nikean_realm_3_decision_desc: "Dispatch orators to weave a narrative to gain [county_opinion|E]!"
 nikean_realm_3_decision_tooltip: "Dispatch orators to weave a narrative to gain [county_opinion|E]!"
 nikean_realm_3_cooldown_tt: "Distribute Propaganda is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nikean_realm_3_cooldown' ))]"
 change_to_nikean_realm_3_decision_desc_1: "$nikean_propaganda_province_tt$"

 # ── Titles ──

 decision_h_narsokratia: "Restore the Mōnarkhía"
 decision_h_narsokratia_confirm: "Let us rejoice!"
 decision_h_narsokratia_tooltip: "The old [nikeanrealm|E] will be restored!"
 decision_h_narsokratia_desc: "We are to outgrow the confines of mere [empires|E]. If a significant sum of territories on the present [realms|E] could be pacified, our [realm|E] would win enough [renown|E] in the eyes of all [nikeis|E] and the other backwards [cultures|E] as the successor of the [narsokratia|E] in our historical antiquity."
 decision_h_narsokratia_effect_tooltip: "Establish [GetTitleByKey('h_narsokratia').GetName] as your [primary_title|E]\n$EFFECT_LIST_BULLET$All [vassals|E] converted to [narsokratia|E] [government|E]\n$EFFECT_LIST_BULLET$[vassal|E] [rulers|E] have a chance to convert to [nikean|E] [culture|E] and [faith|E] "
 decision_h_narsokratia_troop_effect_tooltip: "You get an #V undyingly loyal#! [army|E] of [nikean|E] [men_at_arms|E]:\n$BULLET_WITH_TAB$#V 1500#! $maa_mastiges$ #weak ([gunpowder|E])#!\n$BULLET_WITH_TAB$#V 8500#! $maa_hoplitai$ #weak ([heavy_infantry|E])#!" 

 decision_pledge_restoration: "Pledge as Restorationists"
 decision_pledge_restoration_confirm: "I pledge!"
 decision_pledge_restoration_tooltip: "I pledge my bloodline, [narsokratia|E] will be restored!"
 decision_pledge_restoration_desc: "If we are to outgrow the confines of our [region|E]. If we are to absorb territories of neighbouring [realms|E] for [narsokratia_possessive|E] restoration, then we shall do so with no hesitation. I pledge my bloodline to this toil, I bind my children and their children's children to this struggle! To our restoration!"
 decision_pledge_restoration_tt: "Pledge your [dynasty|E] as [narsokratia|E] Restorationists, blessing them with an inheritable [fame_trait|E] that unlocks a new [casus_belli] and bonuses"
 gain_nars_scion_tt: "You will get the #V [GetTrait('nars_scion').GetName( GetNullCharacter )]#! [trait|E]"

 # ── NEW DECISIONS ──

 decision_take_epithet: "Adopt an Epithet"
 decision_take_epithet_desc: "The [nikeans|E] have always had a tradition of adopting epithets that reflect the deeds, temperament and character of themselves. For one to adopt an epithet, the [character|E] in question solidifies their ideals into a name that will be remembered by other fellow [nikeis|E] and for posterity."
 decision_take_epithet_tooltip: "Adopt an epithet or nickname that #emp may#! reflect your temperament, deeds, and character!"
 decision_take_epithet_confirm: "My second name!"

 decision_recruit_nikean_courtier: "Muster the Nikēís"
 decision_recruit_nikean_courtier_desc: "The [nikeans|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch heralds to scale those miserable peaks and drag them down to our [court|E]. It is time to bring those damn lazy [nikeis|E] hermits down!"
 decision_recruit_nikean_courtier_tooltip: "Send out heralds to find [nikeans|E] to your [court|E]" 
 decision_recruit_nikean_courtier_confirm:0 "Proceed!"
 decision_recruit_nikean_adventurer: "Muster the Nikēís"
 decision_recruit_nikean_adventurer_desc: "The [nikeans|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch scouts to scale those miserable peaks and drag them down to my [camp|E]. It is time to bring those damn lazy [nikeis|E] hermits down!"
 decision_recruit_nikean_adventurer_tooltip: "At least #P 4#! [nikeis|E] will arrive as [guests|E] to your [camp|E] within the coming months"
 decision_recruit_nikean_adventurer_confirm:0 "Proceed!"

 decision_hire_nikean_1:0 "Search for [nikeis|E]"
 decision_hire_nikean_1_tooltip:3 "At least #P 4#! [nikeis|E] will arrive as [guests|E] to your [court|E] within the coming months"
 decision_hire_nikean_1_effect_tooltip:4 "Your servants will suggest a number of suitable [nikeis|E] for your court"

 decision_hire_nikean_2:0 "Scout for a [sophes|E]"
 decision_hire_nikean_2_tooltip:0 "You will receive #P 2#! suitable [sophes|E] prospects for you to choose for your [court|E] as a [courtier|E]"
 nikean_2_court_position_custom_desc: "$EFFECT_LIST_BULLET$Provides @travel_safety_icon![travel_safety|E] and @travel_speed_icon![travel_speed|E] during [travels|E]"
 decision_hire_nikean_2_desc:0 "A good $nikean_2_court_position$ is the key to a successful journey. I will request for a number of suitable candidates to be suggested."

 recruit_nikean_1_cooldown_tt: "Search for [nikeis|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_nikean_1_cooldown' ))]"
 recruit_nikean_2_cooldown_tt: "Scout for a [sophes|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_nikean_2_cooldown' ))]"
