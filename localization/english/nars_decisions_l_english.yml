 decision_libation: "Pour a Libation"
 decision_libation_desc: "An annual and quiet [cultural|E] observance done in the privacy of one's own chambers. It represents the sacrificial blood of the [dead_soldiers|E] of our [wars|E]. I pour some of my vintage, luscious wine unto my altar and recite the sacred prayers to [narses|E] in accordance with the old [naresid|E] faith of the [menofnars|E] of yore."
 decision_libation_tooltip: "Settle in to pour a libation and reflect on the day."
 decision_libation_effect_tooltip: "You may lose some [stress|E] and gain a small amount of [piety|E]!"
 decision_libation_confirm: "Pour the libation!"

