l_english: 
 # ── EXISTING ENTRIES (unchanged) ──
 decision_group_type_selian: "Selian Decisions"
 decision_group_type_restorationist: "Narsokratía Decisions"
 narsokratia_kingdom_above: "Your [realm|E] requires a [rank|E] of [kingdom|E] or above!"

 # ── Faith ──
 decision_nars_faith_choice:0 "Enact Politeíon Rites"
 decision_nars_faith_choice_desc:0 "Only by [faith|E] could we [selianes|E] come to understand the roots of our old [culture|E]. My [legitimacy|E] is only a favor bestowed by the [panteion|E] and to neglect our [traditions|E] is to invite ruin on my [house|E]. Besides, while walking to a [temple|E] is tiring, arguing with my [council|E] is even worse!"
 decision_nars_faith_choice_tooltip:0 "Enact rites to dedicate yourself to the [panteion|E]"
 decision_nars_faith_choice_confirm:0 "Proceed!"
 
 faith_selian_1_decision_name:0 "Dedicate a Libation"
 faith_selian_1_decision_desc:0 "Enact [selian|E] rites to dedicate yourself to your [culture|E]."
 decision_libation_effect_tooltip: "You may lose some [stress|E] and gain a small amount of [piety|E]!"
 decision_libation_effect_desc: "You offer a libation to the [panteion|E] and reflect on your [faith|E]"
 decision_libation_confirm: "Pour the libation!"

 faith_selian_2_decision_name:0 "Ponder the [panteion|E]"
 faith_selian_2_decision_desc:0 "Decide your favored patron god of the [panteion|E]."
 change_to_faith_selian_2_decision_desc_1:0 "You [decide|E] which patron God of the [panteion|E] calls to you the most"
 change_to_faith_selian_2_decision_desc_2:0 "You gain a [modifier|E] that reflects the values of your chosen patron God!"

 faith_selian_3_decision_name:0 "Impose [selianes|E] Heritage"
 faith_selian_3_decision_desc:0 "Evangelize your [realm|E] to the Archaic Politeíon of our [tradition|E]."
 change_to_faith_selian_3_decision_desc_1:0 "Every [province|E] of your [realm|E] has a chance to convert to your [faith|E] and [culture|E]!\n$EFFECT_LIST_BULLET$This [decision|E] #emp will#! cause the lost of [control|E] in the converted [province|E]!"
 change_to_faith_selian_3_decision_desc_2:0 "The efficacy of this [decision|E] scales with [narsokratia|E] [title_ranks|E]!"

 faith_selian_4_decision_name:0 "Sponsor [archaic|E] Missionaries"
 faith_selian_4_decision_desc:0 "Sponsor an [archaic|E] missionary to spread the teachings of the [nars_faith|E] to neighbouring [realms|E]!"
 change_to_faith_selian_4_decision_desc_1:0 "You will sponsor an [archaic|E] missionary to try to convert a neighboring [ruler|E] of a different [faith|E] religion than [GetReligionByKey('selian_religion').GetName]!\n$EFFECT_LIST_BULLET$If successful, the [ruler|E] will convert to your [faith|E]\n$EFFECT_LIST_BULLET$In addition, if successful, you will gain a [legend_seed|E]"

 faith_selian_1_decision_tooltip: "Settle in to pour a libation and reflect on your [faith|E]"
 faith_selian_2_decision_tooltip: "Ponder the [panteion|E] and embody values of your patron God"
 faith_selian_3_decision_tooltip: "Forcibly convert your [provinces|E] to the [archaic|E] [faith|E]"
 faith_selian_4_decision_tooltip: "Sponsor an [archaic|E] missionary to spread the teachings of the [nars_faith|E] to neighbouring [realms|E]"

 faith_selian_1_cooldown_tt: "Dedicate a Libation is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_selian_1_cooldown' ))]"
 faith_selian_2_cooldown_tt: "Ponder the [panteion|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_selian_2_cooldown' ))]"
 faith_selian_3_cooldown_tt: "Impose [nars_faith|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_selian_3_cooldown' ))]"
 faith_selian_4_cooldown_tt: "Sponsor [archaic|E] Missionaries is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'faith_selian_4_cooldown' ))]"
  
 # ── Construction ──

 decision_establish_aretaic_school: "Establish Archiving Citadel"
 decision_establish_aretaic_school_desc: "The [selians|E] possess a [culture|E] that espouses [innovation|E], and yet it's undeniable that other barbaric [realms|E] have closen the gap while the [selianes|E] was in exile. I shall expend our [gold|E] to establish an innovating [building|E] of perfected learning. A new [GetBuilding('aretaic_school_02').GetName] for [education|E]."
 decision_establish_aretaic_school_tooltip: "Found a university for the pursuit of [innovation|E]"
 decision_establish_aretaic_school_effect_tooltip: "A [special_building|E] slot will be added to the [capital|E] of one of your [county|E] and the #V Aretaiké Scholí#! will be available to be constructed"
 decision_establish_aretaic_school_confirm: "Select a Barony!"
 establish_aretaic_school_no_barony_tt: "You must personally hold a [barony|E] that does not already have a [special_building|E] slot"
 pick_aretaic_school_barony: "Pick the Archive's Location"
 pick_aretaic_school_barony_desc: "The intent is clear and my people inspired. My lands and realm are ripe for a new school of archive, but where exactly should it be built?"
 pick_aretaic_school_barony_confirm: "Clear the grounds!"

 decision_establish_brothel: "Open a Brothel-Complex"
 decision_establish_brothel_desc: "It is undeniable that ethnic [selians|E] are few in numbers. I shall expend our [gold|E] to establish a [building|E] of hedonism to cultivate a [breeding|E] programme. A [GetBuilding('brothel_complex_02').GetName], brothel-complexes fit to espouse certain necessary ideas. I shall dedicate this [building|E] of [fertility|E] to [enuo|E]."
 decision_establish_brothel_tooltip: "Found a [building|E] dedicated to the pursuit of [fertility|E]"
 decision_establish_brothel_effect_tooltip: "A [special_building|E] slot will be added to the [capital|E] of one of your [county|E] and the #V Hedonēion#! will be available to be constructed"
 decision_establish_brothel_confirm: "Select a Barony!"
 establish_brothel_no_barony_tt: "You must personally hold a [barony|E] that does not already have a [special_building|E] slot"
 pick_brothel_barony: "Pick the Brothel's Location"
 pick_brothel_barony_desc: "The intent is clear and my people inspired. My lands are ripe for new schools of archives for my [realm|E], but where exactly should it be built?"
 pick_brothel_barony_confirm: "Clear the grounds!"

 pick_special_building_barony_custom_tt: "You will now choose a held [barony|E] for your [special_building|E]\n#weak It must be the capital of its [county|E], not be [leased|E], and not already have a [special_building|E] Slot#!"

 establish_brothel_cooldown_tt: "$decision_establish_brothel$ is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'establish_brothel_cooldown' ))]"
 # ── Foundries ──

 decision_munitions_research: "Found the Mástiges"
 decision_munitions_research_desc: "A new substance has been disbursed from the distant [regions|E] of [GetTitleByKey('h_china').GetNameNoTier]. A black powder that is known to hold untold potential. These 'firearms' may be reliably deployed if properly researched, and already my [marshal|E] keeps droning about the potential of equipping my [hoplites|E] with them."
 decision_munitions_research_tooltip: "Enable the recruitment of [GetMaA('maa_mastiges').GetName] [men_at_arms|E] armed with new armaments!"
 decision_munitions_research_confirm: "Blood and iron!"

 munitions_research_capital_unoccupied_tt: "[capital|E] is not [occupied|E]"
 munitions_research_3_years_tooltip: "If you complete the [GetScheme('munitions_research_scheme').GetTypeName] [scheme|E], your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"
 munitions_research_mastiges_tooltip: "Unlocks the recruitment of the [GetMaA('maa_mastiges').GetName] [men_at_arms|E]"
 munitions_research_success_tooltip: "On Success, your [capital|E] will gain [GetModifier('munitions_research_modifier').GetNameWithTooltip] for #high 30 years#!"

 decision_mend_narsil: "Mend Narsíl"
 decision_mend_narsil_desc: "During the [civil_wars|E] sorrounding the fall of old [narsokratia|E], the longsword [narsil|E] was shattered. Its shards however, still remains with us as an heirloom from a line of exiles. Mending and reforging the [artifact|E] is not just a [virtuous|E] undertaking but a necessity for our people."
 decision_mend_narsil_effect_tooltip: "Reforge and claim [narsil|E] as an [artifact|E]"
 decision_mend_narsil_tooltip: "Reforge the heirloom of the old [selian|E] [hegemons|E]!"
 decision_mend_narsil_confirm: "To our foundries!"

 # ── Imperial Decisions ──

 decision_selian_imperial_administration: "Issue Imperial Decrees"
 decision_selian_imperial_administration_desc: "As the [ruler|E] of an [empire|E] held by the [selianes|E], the vast machinery of the [realm|E] rests solely in my hands. The old [narsokratia|E] of yore had thrived because it directed its boundless resources with calculated precision. It is precisely why I must issue decrees to secure our desired [hegemony|E]!"
 decision_selian_imperial_administration_tooltip: "Issue a grand decree to bolster the administration of your Empire"
 decision_selian_imperial_administration_confirm: "Send the edict!"
  
 nars_realm_1_decision_name: "Develop Industry"
 nars_realm_1_decision_desc: "Invest heavily in the development of [buildings|E] of our great empire."
 nars_realm_1_decision_tooltip: "Invest in the [development|E] of [buildings|E] of the [realm|E]!"
 nars_realm_1_cooldown_tt: "Develop Industry is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nars_realm_1_cooldown' ))]"
 change_to_nars_realm_1_decision_desc_1: "$industrial_boom_province_tt$"

 nars_realm_2_decision_name: "Hire Synods"
 nars_realm_2_decision_desc: "Establish a sprawling, invisible web of operatives to act as your yes and ears."
 nars_realm_2_decision_tooltip: "Establish an invisible web of intrigue for [control|E]!"
 nars_realm_2_cooldown_tt: "Hire Synods is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nars_realm_2_cooldown' ))]"
 change_to_nars_realm_2_decision_desc_1: "$spy_network_province_tt$"

 nars_realm_3_decision_name: "Distribute Propaganda"
 nars_realm_3_decision_desc: "Dispatch orators to weave a narrative to gain [county_opinion|E]!"
 nars_realm_3_decision_tooltip: "Dispatch orators to weave a narrative to gain [county_opinion|E]!"
 nars_realm_3_cooldown_tt: "Distribute Propaganda is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'nars_realm_3_cooldown' ))]"
 change_to_nars_realm_3_decision_desc_1: "$selian_propaganda_province_tt$"

 # ── Titles ──

 decision_h_narsokratia: "Restore the Mōnarkía"
 decision_h_narsokratia_confirm: "Let us rejoice!"
 decision_h_narsokratia_tooltip: "The old [selianrealm|E] will be restored!"
 decision_h_narsokratia_desc: "We are to outgrow the confines of mere [empires|E]. If a significant sum of territories on the present [realms|E] could be pacified, our [realm|E] would win enough [renown|E] in the eyes of all [selianes|E] and the other backwards [cultures|E] as the successor of the [narsokratia|E] in our historical antiquity."
 decision_h_narsokratia_effect_tooltip: "Establish #v [GetTitleByKey('h_narsokratia').GetName]#! as your [primary_title|E]\n$EFFECT_LIST_BULLET$All [vassals|E] convert to [administrative|E] [government|E]\n$EFFECT_LIST_BULLET$[vassal|E] [rulers|E] have a chance to convert to [selian|E] [culture|E] and [faith|E] "
 decision_h_narsokratia_troop_effect_tooltip: "You get an #V undyingly loyal#! [army|E] of [selian|E] [men_at_arms|E]:\n$BULLET_WITH_TAB$#V 1500#! $maa_mastiges$ #weak ([gunpowder|E])#!\n$BULLET_WITH_TAB$#V 8500#! $maa_hoplitai$ #weak ([heavy_infantry|E])#!" 

 decision_pledge_restoration: "Proclaim Oath of the $selian$"
 decision_pledge_restoration_confirm: "I am the scourge of [ROOT.Char.GetFaith.HighGodName]!"
 decision_pledge_restoration_tooltip: "#WEAK I sing of warfare and a man at war#!"
 decision_pledge_restoration_desc: "For far too long has my sword been sheathed, now the Earth shall drown beneath an ocean of blood for #EMP our#! glory. The sacred wars begins now!"
 decision_pledge_restoration_tt: "Your [dynasty|E] will get the #V [GetTrait('nars_scion').GetName( GetNullCharacter )]#! inheritable [fame_trait|E]"
 nars_conqueror_decision_troops: "You will get an army of seasoned veterans, consisting of [GetMaA('accolade_maa_lancers').GetName] and [GetMaA('accolade_maa_vanguards').GetName] to aid your future conquests"
 gain_nars_conqueror_tt: "You will get the #V [GetTrait('nars_conqueror').GetName( GetNullCharacter )]#! [trait|E]"
 nars_conqueror_decision_enough_troops: "You have at least 3500 [soldiers|E]"
 nars_conqueror_defensive_war_tt: "@warning_icon! #X Neighbouring [rulers|E] will declare a #v $selian_defiance_cb$#! against you!#!"
 nars_conqueror_rally_war_tt: "An [army|E] of #v undyingly loyal#! [selian|E] [soldiers|E] is formed in your [capital|E]"
 nars_conqueror_if_win_defiance_tt: "\nIf you win the #v $selian_defiance_cb$:#!"
 nars_conqueror_if_lose_defiance_tt: "\nIf you lose the #v $selian_defiance_cb$:#!"
 nars_conqueror_if_lose_defiance_tt_1: "You are [imprisoned|E] by your enemies and may be [executed|E]"
 nars_conqueror_if_lose_defiance_tt_2: "You lose most of your [herd|E], [prestige|E], and [gold|E]" 
 nars_conqueror_if_lose_defiance_tt_3: "You lose #high 2#! [legitimacy_levels|E]"
 nars_conqueror_if_lose_defiance_tt_4: "Your [vassals|E] splinter and become independent"
 nars_conqueror_defensive_war_will_happen_tt: "@alert_icon! #alert_trial Neighbouring [rulers|E] will declare a #v $selian_defiance_cb$#! against you!#!"
 selian_coalition_member_name_tt: "[character_war.GetShortUIName] will declare [war|E]!"

 # ── NEW DECISIONS ──

 decision_take_epithet: "Adopt an Epithet"
 decision_take_epithet_desc: "The [selians|E] have always had a tradition of adopting epithets that reflect the deeds, temperament and character of themselves. For one to adopt an epithet, the [character|E] in question solidifies their ideals into a name that will be remembered by other fellow [selianes|E] and for posterity."
 decision_take_epithet_tooltip: "Adopt an epithet or nickname that #emp may#! reflect your temperament, deeds, and character!"
 decision_take_epithet_confirm: "My second name!"

 decision_recruit_selian_courtier: "Muster the Selian"
 decision_recruit_selian_courtier_desc: "The [selians|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch heralds to scale those miserable peaks and drag them down to our [court|E]. It is time to bring those damn lazy [selianes|E] hermits down!"
 decision_recruit_selian_courtier_tooltip: "Send out heralds to find [selians|E] to your [court|E]" 
 decision_recruit_selian_courtier_confirm:0 "Proceed!"
 decision_recruit_selian_adventurer: "Muster the Selian"
 decision_recruit_selian_adventurer_desc: "The [selians|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch scouts to scale those miserable peaks and drag them down to my [camp|E]. It is time to bring those damn lazy [selianes|E] hermits down!"
 decision_recruit_selian_adventurer_tooltip: "At least #P 4#! [selianes|E] will arrive as [guests|E] to your [camp|E] within the coming months"
 decision_recruit_selian_adventurer_confirm:0 "Proceed!"

 decision_hire_selian_1:0 "Search for [selianes|E]"
 decision_hire_selian_1_tooltip:3 "At least #P 4#! [selianes|E] will arrive as [guests|E] to your [court|E] within the coming months"
 decision_hire_selian_1_effect_tooltip:4 "Your servants will suggest a number of suitable [selianes|E] for your court"

 decision_hire_selian_2:0 "Scout for a [polymetis|E]"
 decision_hire_selian_2_tooltip:0 "You will receive #P 2#! suitable [polymetis|E] prospects for you to choose for your [court|E] as a [courtier|E]"
 selian_2_court_position_custom_desc: "$EFFECT_LIST_BULLET$Provides @travel_safety_icon![travel_safety|E] and @travel_speed_icon![travel_speed|E] during [travels|E]"
 decision_hire_selian_2_desc:0 "A good $selian_2_court_position$ is the key to a successful journey. I will request for a number of suitable candidates to be suggested."

 recruit_selian_1_cooldown_tt: "Search for [selianes|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_selian_1_cooldown' ))]"
 recruit_selian_2_cooldown_tt: "Scout for a [polymetis|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_selian_2_cooldown' ))]"
