 libation_bad_modifier_desc: "This fickle [ruler|E] uncaringly drunk his own offering"

 #Main
 decision_k_narsokratia: "Proclaim a Despotēia"
 found_k_narsokratia_decision_desc: "The squabbling [rulers|E] and warlords of this [era|E] mistake their disorganized [realms|E] for true nations. By uniting the pacified [provinces|E], I shall reintroduce the concept of [narsokratia|E] to these [land|E], forging a [kingdom|E] that will belong to my [dynasty|E] for all time."
 decision_k_narsokratia_confirm: "Gather the realm"
 decision_k_narsokratia_tooltip: "Found an entirely new Despotēia title"
 decision_e_narsokratia: "Form an Ōtarkhia"
 found_e_narsokratia_decision_desc: "The pretender [rulers|E] who currently call themselves [emperors|E] are merely [nomadic|E] [stewards|E] occupying our [narsid|E] [domains|E]. I shall create an [empire|E] of the [menofnars|E] to outshine their mockery of a [realm|E] and outlast history itself."
 decision_e_narsokratia_confirm: "The State is Absolute."
 decision_e_narsokratia_tooltip: "Found an entirely new Ōtarkhia title"
 create_k_narsokratia: "You reestablish a Despotēia"
 create_title_every_held_duchy: "Every [duchy|E] title you [hold|E] or [completely_control|E]"
 create_custom_kingdom_de_jure_changes: "Becomes [de_jure|E] [duchies|E] of your new Despotēia"
 create_e_narsokratia: "You reestablish an Ōtarkhia"
 create_title_every_held_kingdom: "Every [kingdom|E] title you [hold|E] or [completely_control|E]"
 create_custom_empire_de_jure_changes: "Becomes [de_jure|E] [kingdoms|E] of your new Ōtarkhia"
 decision_h_narsokratia: "Restore the Old Nārsokratía"
 decision_h_narsokratia_confirm: "I will restore the Hegemony of yore!"
 found_h_narsokratia_decision_tooltip: "The old [narsidrealm|E] will be restored!"
 found_h_narsokratia_decision_desc: "We have outgrown the confines of mere [empires|E]. If key territories of the present [realms|E] could be pacified, our [realm|E] would win [prestige|E] and [renown|E] in the eyes of all [menofnars|E] and the other barbaric [cultures|E] as the undisputed continuation of the [narsidrealm|E] of antiquity. \n\nThe [narsokratia|E] of our [realm|E] will be the rightful inheritors of the world."

 found_h_narsokratia_decision_tt: "Either your Religion is Orphists or your Culture is Narsid"
 found_h_narsokratia_decision_effect_tooltip: "Establish [GetTitleByKey('h_narsokratia').GetName] as your [primary_title|E].\n$EFFECT_LIST_BULLET$The [narsokratia|E] of the [menofnars|E] will be restored.\n$EFFECT_LIST_BULLET$[GetTitleByKey('h_narsokratia').GetName] will acquire the [de_jure|E] of all currently held [empires|E].\n$Effect_LIST_Bullet$Convert yourself and all of your [vassals|E] to the [culture|E] and [faith|E] of your [capital|E]."