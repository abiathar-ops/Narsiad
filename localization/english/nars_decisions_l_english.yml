 nikean_courtiers.0001.t: "A Nikean Arrives"
 nikean_courtiers.0001.desc: "Answering our herald's call, a newfound exiled Nikean has arrived at [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"

 decision_recruit_nikean_courtier: "Muster the Nikēís"
 decision_recruit_nikean_courtier_desc: "The [nikeans|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch heralds to scale those miserable peaks and drag them down to our [court|E]. It is time to bring those damn lazy [nikeis|E] hermits down!"
 decision_recruit_nikean_courtier_tooltip: "Send out heralds to find [nikeans|E] to your [court|E]" 
 decision_recruit_nikean_courtier_confirm:0 "Proceed!"
 decision_recruit_nikean_adventurer: "Muster the Nikēís"
 decision_recruit_nikean_adventurer_desc: "The [nikeans|E] are scattered with many of our stubborn kins still clinging to the harsh peaks of our mountain exiles. With a bit of [prestige|E], I can now dispatch scouts to scale those miserable peaks and drag them down to my [camp|E]. It is time to bring those damn lazy [nikeis|E] hermits down!"
 decision_recruit_nikean_adventurer_tooltip: "At least #P 4#! [nikeis|E] will arrive as [guests|E] to your [camp|E] within the coming months"
 decision_recruit_nikean_adventurer_confirm:0 "Proceed!"

 decision_hire_nikean_1:0 "Search for [nikeis|E]"
 decision_hire_nikean_1_tooltip:3 "At least #P 4#! [nikeis|E] will arrive as [guests|E] to your [court|E] within the coming months"
 decision_hire_nikean_1_effect_tooltip:4 "Your servants will suggest a number of suitable [nikeis|E] for your court"

 decision_hire_nikean_2:0 "Scout for a [sophes|E]"
 decision_hire_nikean_2_tooltip:0 "You will receive #P 2#! suitable [sophes|E] prospects for you to choose for your [court|E] as a [courtier|E]"
 nikean_2_court_position_custom_desc: "$EFFECT_LIST_BULLET$Provides @travel_safety_icon![travel_safety|E] and @travel_speed_icon![travel_speed|E] during [travels|E]"
 decision_hire_nikean_2_desc:0 "A good $nikean_2_court_position$ is the key to a successful journey. I will request for a number of suitable candidates to be suggested."

 recruit_nikean_1_cooldown_tt: "Search for [nikeis|E] is on cooldown for [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'recruit_nikean_1_cooldown' ))]"
