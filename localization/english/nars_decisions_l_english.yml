 decision_develop_industry: "Develop Industry"
 decision_develop_industry_tooltip: "Unleash the industrial power of Nars!"
 decision_develop_industry_desc: "The world has too long lay empty and desolate. Now, as the Narsids' power grows, it is time to turn it into the most prosperous [realm|E] in the world.\n\nLet the wheels spin and the metal glow, progress and power comes to our people!" 
 industrial_boom_province_modifier: "Industrial Boom"
 industrial_boom_character_modifier: "Industrial Boom"

 decision_try_for_a_child: "Try to have a Child"
 decision_try_for_a_child_tooltip: "Talk to your spouse about having a child"
 decision_try_for_a_child_desc: "[ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] and I know that the act of procreation and nurturing of an unborn child is an extremely special moment for any [menofnars|E]. I'm sure that such a time of union and love will give us great delight and joy, though maintaining a strong spiritual connection of our Fëa will require our utmost focus and attention."
 decision_try_for_a_child_confirm: "Approach [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]"
 decision_try_for_a_child_effect: "You and [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip] will attempt to conceive a child, which will take much of your focus."
 
 decision_self_care: "Groom Yourself"
 decision_self_care_desc: "My body has always been a source of pride and inspiration to me, as it is to all [menofnars|E]. Amongst the [narsid|E], a long and well-kept body is more than shaving hair. To grow and care for it is to honour the heritage of our ancestors, and to maintain it well is to show discipline and respect for the traditions that bind us.\n\nI must take good care of mine, ensuring it looks its very best."
 decision_self_care_tooltip: "Settle in to groom yourself"
 decision_self_care_effect_tooltip: "You may lose some [stress|E] and you'll look great!"
 decision_self_care_confirm: "I'll need some oil..."