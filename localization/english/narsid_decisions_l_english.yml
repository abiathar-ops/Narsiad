 decision_spy_network: "Establish the Silent Synod"
 decision_spy_network_desc: "A perfect [realm|E] requires perfect knowledge. While our [hoplites|E] secure the borders, treason often breeds in the shadows of alleyways and traded for coin in the dark. By exploiting the vices of the populace, we will hear every [secret|E] and uncover every plot before it draws breath."
 decision_spy_network_confirm: "St. Alnarēs, hear and protect us!"
 decision_spy_network_tt: "Establish the Silent Synod to monitor the [narsid|E] [realm|E]."
