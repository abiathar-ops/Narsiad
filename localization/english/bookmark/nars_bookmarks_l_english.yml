l_english:
 bm_1178_nikean:0 "Restoring Antiquity"
 bm_1178_nikean_desc:0 "Centuries ago, on a time where historical records don't reach. The Nikean's hegemony fell amidst civil wars and nomadic incursions, leaving a handful on indefinite exiles on remotely fortified locations to conserve their heritage. \n\nThe last few decades, a handful of Nikeans broke their centuries of isolation. Leaving behind the safety of their mountain strongholds exile, they marched into a now unfamiliar world, selling their swords to warring lords and plotting to one day restore their hegemonic birthright.\n\n#bold Will these heirs of a nearly obliterated heritage forge a new destiny in the lowlands, or will the outside world extinguish these restorationists?#!"

 bookmark_restoring_antiquity_alnars: "$Alnars$"
 bookmark_restoring_antiquity_nikeas: "$Nikeas$"
 bookmark_restoring_antiquity_nikeos: "$Nikeos$"
 bookmark_restoring_antiquity_ollias: "Olliás"
 bookmark_restoring_antiquity_opelia: "Ōpelía"

 bookmark_restoring_antiquity_eleios: "$Eleios$ 'Ktístēs'"
 bookmark_restoring_antiquity_eleios_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_restoring_antiquity_eleios_desc: "[Concept( 'story_nikean', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_nikean', '$bm_story_content_available_copy|q$' )|E]\nHeir to Alnárs, one of the first Nikeans to venture to the outside world, Ēleîos is a Nikean measured greatly even among the thousands of his fellow Nikean kins. \n\nSchemed against and framed by an unknown force, the House Narēsíos is fractured as the estranged siblings split to find their own fortunes elsewhere. \n\n#bold Can you restore the glory of House Narēsíos, or will the increasingly hostile siblings ruin their legacy with their rampant vicious quarrels?#!"

 bookmark_restoring_antiquity_ilione: "$Ilione$ 'Keraunós'"
 bookmark_restoring_antiquity_ilione_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_restoring_antiquity_ilione_desc: "[Concept( 'story_nikean', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_nikean', '$bm_story_content_available_copy|q$' )|E]\nA second daughter set to not inherit, Iliónē has long embraced the spirit of the Nikean mercenary life. \n\nConsidered a veteran sellsword by many and a cruel bloodthirsty butcher by others, Iliónē's reputation remains a controversial one, not helped by the fact that she married an older man one-and-a-half her age.\n\n#bold Can you turn a mercenary company's foothold into a restored realm, or will the lonely mountains claim your legacy once more?#!"

 bookmark_restoring_antiquity_strato: "$Strato$ 'Kryphios'"
 bookmark_restoring_antiquity_strato_subheading: "$BOOKMARK_SUBHEADING_ADVENTURER$"
 bookmark_restoring_antiquity_strato_desc: "[Concept( 'story_nikean', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_nikean', '$bm_story_content_available_copy|q$' )|E]\nStratō Alkibíadēs is infamous for his silver-tongued rhetorics. Vile rumours sorround his own personage with talks of witchcraft among others even worse. \n\nNevertheless, however, the presence of his saintly wife, Ōpelía, remains a factual dichotomy to his foul reputation. For how could someone so purely virtuous devote herself to someone so irredeemably vile?\n\n#bold Can you scheme yourself to be on top, or will your birthright be despoiled once more?#!"

 nikean_troop_intro_name: "Alnárs' Hoplîtes"
 nikean_troop_hegemony_name: "Myrioi"
 nikean_troop_event_name: "Errant Hoplîtes"