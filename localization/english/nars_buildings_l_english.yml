l_english:
 building_type_akropolis_duchy_01:0 "Akrópolis"
 building_type_akropolis_duchy_01_desc:0 "The [Glossary('Akrópolis', 'AKROPOLIS_GLOSS')] crowns the area, gathering the realm's workshop and barracks behind many rings. The thrums of hammers and roaring kilns arms hosts and impregnable walls of the $game_concept_selianes$."
 building_akropolis_duchy_01:0 "Hoplothēkē"
 building_akropolis_duchy_01_desc:0 "Upon the first ring of the [Glossary('Akrópolis', 'AKROPOLIS_GLOSS')], foundries produce metalworks as well as other commodities thus becoming a source of gold and wealth to its holder.\n\n#flavor "Let us create a city from the beginning in speech." - $alnars_anduril$#!"
 building_akropolis_duchy_02:0 "Lochagēion"
 building_akropolis_duchy_02_desc:0 "Upon the second ring of the [Glossary('Akrópolis', 'AKROPOLIS_GLOSS')], war armories supply warfare while organized workshops function with specialized smiths labor continuously.\n\n#flavor "Let us create a city from the beginning in speech." - $alnars_anduril$#!"
 building_akropolis_duchy_03:0 "Polemarchēion"
 building_akropolis_duchy_03_desc:0 "The [Glossary('Akrópolis', 'AKROPOLIS_GLOSS')] stands complete as it becomes a bastion of the [selian|E] holding. It is now a forge-complex dedicated to $game_concept_phokas$ of whose blessing pervades.\n\n#flavor "Let us create a city from the beginning in speech." - $alnars_anduril$#!"

 building_type_constructing_cranes_01: "Constructing Cranes"
 building_type_constructing_cranes_01_desc: "All of the land around the castle is being cleared and work is underway to install the needed foundations.\n\nThis is a massive project that will have to be completed in for several weeks."
 building_constructing_cranes_01: "Constructing Cranes"
 building_constructing_cranes_01_desc: "Cranes are erected to build towering structures, while the clatter of gears and the hum of machinery fill the air. A new special building is being constructed.\n\n#flavor This will be completed in #color_green 6-12#! months!#!"

 building_type_aretaic_school_01: "School of Virtue"
 building_type_aretaic_school_01_desc: "A sprawling complex of schools, the $building_aretaic_school_01$ echoes with hushed voices of philosophers racing in unravelling the secrets of the cosmos.\n\n#flavor "Life is short, the art long, opportunity fleeting, experiment treacherous, judgment difficult." - $alnars_anduril$#!"
 building_aretaic_school_01: "Aretaiké Scholí"
 building_aretaic_school_01_desc: "$building_type_aretaic_school_01_desc$"

 building_type_brothel_complex_01:0 "Leisure Quarters"
 building_type_brothel_complex_01_desc:0 "Dens of decadence where the mask of propriety is finally dropped. As the $building_brothel_complex_01$ opens its doors, the culture of indulgence is embraced by the realm.\n\n#flavor "Pleasure is the only thing worth pursuing." - $Strato$, Sodomites.#!"
 building_brothel_complex_01:0 "Hedonēion"
 building_brothel_complex_01_desc:0 "$building_type_brothel_complex_01_desc$"
 brothel_complex_01_tt: "Enables the [GetActivityType( 'activity_nars_orgio' ).GetName] [activity|E] for [rulers|E] within the same [realm|E]"