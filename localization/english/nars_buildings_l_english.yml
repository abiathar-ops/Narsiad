l_english:
 # ─────────────────────────────────────────────────────────
 #  BROTHEL DUCHY  –  Pleasure Quarter
 # ─────────────────────────────────────────────────────────
 building_type_brothel_duchy_01:0 "Leisure Quarters"
 building_type_brothel_duchy_01_desc:0 "These clandestine institutions are ostensibly dedicated to the high dramatic arts and culture. However, beneath the veneer of sophistication, they increasingly serve as exclusive venues for the nobility's private indulgences and, in the duchy capital, as engines of political influence, prestige, and cultural reach."
 building_brothel_duchy_01:0 "Odēion"
 building_brothel_duchy_01_desc:0 "A covered recital hall known for its acoustic perfection, hosting musical contests and poetry recitals. While the public gathers to enjoy the art, the performers are frequently available for private, curtained audiences after the show."
 building_brothel_duchy_02:0 "Dionysion"
 building_brothel_duchy_02_desc:0 "A hall devoted to wine, dance, and ecstatic performance. The air here is thick with incense and the scent of unmixed wine, blurring the line between actor and audience until the celebrations dissolve into uninhibited revelry long after the curtain falls."
 building_brothel_duchy_03:0 "Hedonēion"
 building_brothel_duchy_03_desc:0 "A sanctum of pleasure. The pinnacle of elite decadence, where the masquerade of art is finally dropped. In these halls, morality is left at the threshold, and power and desire become the only laws that remain for those who rule."

 building_type_canton_duchy_01:0 "Fortified Citadels"
 building_type_canton_duchy_01_desc:0 "These martial institutions are dedicated to the training, housing, and equipping of the heavy citizen-infantry. Through sweat and bronze, they forge a unified phalanx capable of breaking any enemy line. In the duchy capital, they double as the seat of knightly command and the bulwark of the realm's borders."
 building_canton_duchy_01:0 "Hoplothēkē"
 building_canton_duchy_01_desc:0 "A dedicated armory and drill-hall where the heavy bronze panoplies are stored and maintained. Instructors teach the precise spear-thrusts and shield-locks necessary for cohesive infantry warfare."
 building_canton_duchy_02:0 "Lochagēion"
 building_canton_duchy_02_desc:0 "A prominent administrative and housing complex for regiments. By centralizing officers and their men, the regiment can muster and deploy with frightening speed."
 building_canton_duchy_03:0 "Polemarchēion"
 building_canton_duchy_03_desc:0 "The grand bastion housing the supreme commanders and the elite vanguard. Within this impregnable citadel, the art of infantry warfare is perfected into an instrument of absolute state power."

 building_type_foundry_duchy_01:0 "Industrial Foundries"
 building_type_foundry_duchy_01_desc:0 "The rhythmic thrum of hammers and the roaring heat of the kilns define these industrial hubs. From simple agrarian tools to the heavy bronze panoplies of the phalanx, these foundries are the beating heart of the realm's war machine. In the duchy capital, they grow into colossal arsenals capable of arming a host and raising impregnable walls."
 building_foundry_duchy_01:0 "Ergastērion"
 building_foundry_duchy_01_desc:0 "An organized workshop where specialized smiths labor under a master's eye. Production is divided among different craftsmen, significantly increasing the output of shields, greaves, and blades."
 building_foundry_duchy_02:0 "Hoplopoieion"
 building_foundry_duchy_02_desc:0 "A sprawling state-funded manufactory strictly devoted to the art of war. Rows of anvils ring in unison as armorers churn out standardized, high-quality panoplies to equip the heavy infantry."
 building_foundry_duchy_03:0 "Hēphaisteion"
 building_foundry_duchy_03_desc:0 "The supreme pinnacle of metallurgy, blending divine devotion with absolute industrial mastery. Dedicated to the Smith God, this legendary forge-complex produces masterwork armaments whose quality approaches the mythic."

 building_type_aretaic_school_01: "Archiving Citadel"
 building_type_aretaic_school_01_desc: "A sprawling complex echoing with the hushed voices of philosophers unravelling the secrets of the cosmos, working tirelessly both day and night to not only store ancient knowledge but also to translate new great works of literature from across the world!"
 building_aretaic_school_01: "Constructing Cranes"
 building_aretaic_school_01_desc: "Cranes are erected to build the towering library halls, while the clatter of gears and the hum of machinery fill the air. The construction of the Aretaiké Scholí has begun."
 building_aretaic_school_02: "Aretaiké Scholí"
 building_aretaic_school_02_desc: "$building_type_aretaic_school_01_desc$"

 NOT_holy_site_nars_or_holy_site_trigger:0 "The holder must be Nikean or consider this a [holy_site|E]"