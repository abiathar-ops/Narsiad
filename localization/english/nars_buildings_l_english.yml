l_english:
 # Alkastron - Military Command Chain
 building_type_alkastron_01:0 "Kastrōpolis"
 building_type_alkastron_01_desc:0 "A distinct architectural tradition of battle-hardened bastions devoted not merely to defense, but to the science of disciplined command, the formation of a soldiering caste, and the projection of state power through martial efficiency."
 building_alkastron_01:0 "Archēgions"
 building_alkastron_01_desc:0 "A strictly regimented compound where cadets and junior officers are forged from raw recruits. Amidst the constant echo of drills and the study of foundational texts, they receive their early formation in the administration of violence and the oversight of the bastille."
 building_alkastron_02:0 "Stratēgions"
 building_alkastron_02_desc:0 "A sanctified instruction hall dominating the district, where mid-ranked officers gather over sand tables and maps. Here, the focus shifts from personal combat to campaign logistics, advanced battlefield doctrine, and the complex coordination of multi-regiment maneuvers."
 building_alkastron_03:0 "Hēgemonion"
 building_alkastron_03_desc:0 "The pinnacle seat of war authority and statecraft. Commanders trained within the Hēgemonion do not simply learn to fight; they master the governance of martial institutions, ensuring that the army functions as a seamless extension of the ruler's political will."

 building_type_brothel_01:0 "Brothels"
 building_type_brothel_01_desc:0 "These clandestine institutions are ostensibly dedicated to the high dramatic arts and culture. However, beneath the veneer of sophistication, they increasingly serve as exclusive venues for the nobility's private indulgences, political intrigue, and concealed vices."
 building_brothel_01:2 "Odēion"
 building_brothel_01_desc:0 "A covered recital hall known for its acoustic perfection, hosting musical contests and poetry recitals. While the public gathers to enjoy the art, the performers—often chosen for beauty as much as talent—are frequently available for private, curtained audiences after the show."
 building_brothel_02:0 "Thēatron"
 building_brothel_02_desc:0 "A grand venue for tragedy and comedy where the city's elite gather to see and be seen. The true drama, however, occurs in the shadowed private boxes, where patrons mingle with the realm's most desirable talents and reputations are traded as currency."
 building_brothel_03:0 "Dionysion"
 building_brothel_03_desc:0 "A hall devoted to wine, dance, and ecstatic performance. The air here is thick with incense and the scent of unmixed wine, blurring the line between actor and audience until the celebrations dissolve into uninhibited revelry long after the curtain falls."
 building_brothel_04:0 "Kēposion"
 building_brothel_04_desc:0 "A sponsors' hall filled with exotic flora and secluded alcoves. Wealthy patrons fund troupes of dancers here, securing not just their loyalty on stage, but the exclusive right to their company behind gilded doors away from prying eyes."
 building_brothel_05:0 "Symposion"
 building_brothel_05_desc:0 "A private banquet hall reserved for the aristocracy. In these secluded chambers, reclining on plush couches, the city's power brokers forge political alliances amidst flowing vintage wine, philosophical debate, and the caress of skilled companions."
 building_brothel_06:0 "Tryphēsion"
 building_brothel_06_desc:0 "A sanctuary dedicated to beauty and desire, where the concept of magnificence is worshipped physically. The companions here are trained in the highest arts of conversation and seduction, their time reserved for those who can afford the most divine of experiences."
 building_brothel_07:0 "Erotikon"
 building_brothel_07_desc:0 "A walled estate of softness and excess, completely isolated from the common world. Here, the ruling class retreats to indulge in a life of absolute, languid luxury, served by silent attendants who ensure that no desire, however obscure, goes unsatisfied."
 building_brothel_08:0 "Hedonēion"
 building_brothel_08_desc:0 "A sanctum of pleasure. The pinnacle of elite decadence, where the masquerade of art is finally dropped. In these marble halls, morality is left at the threshold, and power and desire become the only laws that remain for those who rule."

 building_type_canton_01:0 "Cantonments"
 building_type_canton_01_desc:0 "These martial institutions are dedicated to the training, housing, and equipping of the heavy citizen-infantry. Through sweat and bronze, they forge a unified phalanx capable of breaking any enemy line."
 building_canton_01:0 "Ephēbeion"
 building_canton_01_desc:0 "A formalized training ground where youths serving as ephebes receive their initial martial and civic conditioning, preparing their bodies for the heavy panoply of war."
 building_canton_02:0 "Palaistra"
 building_canton_02_desc:0 "A specialized wrestling and sparring school. Here, recruits learn the balance, leverage, and sheer physical endurance required to hold the line in the brutal crush of the phalanx."
 building_canton_03:0 "Hoplothēkē"
 building_canton_03_desc:0 "A dedicated armory and drill-hall where the heavy bronze panoplies are stored and maintained. Instructors teach the precise spear-thrusts and shield-locks necessary for cohesive infantry warfare."
 building_canton_04:0 "Prōmachōn"
 building_canton_04_desc:0 "A fortified staging area and bastion designed for the border patrols. It features expanded armories and secure sleeping quarters, ensuring the vanguard is always ready."
 building_canton_05:0 "Lochagēion"
 building_canton_05_desc:0 "A prominent administrative and housing complex for a regiment. By centralizing the officers and their men, the regiment can muster and deploy with frightening speed."
 building_canton_06:0 "Taxichēion"
 building_canton_06_desc:0 "A massive regimental hub overseen by an archon. It features vast storehouses of grain and bronze, capable of sustaining a standing force year-round."
 building_canton_07:0 "Phorchēion"
 building_canton_07_desc:0 "An imposing, heavily fortified garrison command that towers over the surrounding landscape. It serves as an unassailable redoubt and a monument to the realm's martial supremacy."
 building_canton_08:0 "Polemarchēion"
 building_canton_08_desc:0 "The grand bastion housing the supreme commanders and the elite vanguard. Within this impregnable citadel, the art of infantry warfare is perfected into an instrument of absolute state power."

 building_type_foundry_01:0 "Foundries"
 building_type_foundry_01_desc:0 "The rhythmic thrum of hammers and the roaring heat of the kilns define these industrial hubs. From simple agrarian tools to the heavy bronze panoplies of the phalanx, these foundries are the beating heart of the realm's war machine."
 building_foundry_01:0 "Chalkeion"
 building_foundry_01_desc:0 "A modest local smithy with clay hearths and stone anvils. Here, basic ores are smelted to provide tools for the peasantry and simple, reliable spearheads for the local militia."
 building_foundry_02:0 "Kaminos"
 building_foundry_02_desc:0 "Larger, more efficient furnaces built to continuously smelt raw ore. The billowing smoke of the kaminos signals a steady production of refined metals ready to be worked by skilled artisans."
 building_foundry_03:0 "Ergastērion"
 building_foundry_03_desc:0 "An organized workshop where specialized smiths labor under a master's eye. Production is divided among different craftsmen, significantly increasing the output of shields, greaves, and blades."
 building_foundry_04:0 "Sidērourgeion"
 building_foundry_04_desc:0 "A dedicated ironworks equipped with massive bellows and heavy trip-hammers. Working with iron requires intense heat and immense effort, but it yields weapons capable of shattering lesser bronze."
 building_foundry_05:0 "Hoplopoieion"
 building_foundry_05_desc:0 "A sprawling state-funded manufactory strictly devoted to the art of war. Rows of anvils ring in unison as armorers churn out standardized, high-quality panoplies to equip the heavy infantry."

 building_foundry_06:0 "Mēchanopoieion"
 building_foundry_06_desc:0 "A highly advanced engineering yard where mathematicians and master smiths collaborate. It produces the heavy torsion engines, ballistae, and siege equipment needed to break the strongest city walls."

 building_foundry_07:0 "Chalkothēkē"
 building_foundry_07_desc:0 "A colossal arsenal and storehouse of martial wealth. The Chalkothēkē holds thousands of gleaming shields and weapons in reserve, ensuring that the state can instantly arm an entire mobilized host at a moment's notice."
 building_foundry_08:0 "Hēphaisteion"
 building_foundry_08_desc:0 "The supreme pinnacle of metallurgy, blending divine devotion with absolute industrial mastery. Dedicated to the Smith God, this legendary forge-complex produces masterwork armaments whose quality approaches the mythic."

 NOT_holy_site_nars_or_holy_site_trigger:0 "The holder must be Narsid or consider this a [holy_site|E]"
 alkastron_effect_desc:1 "Enables further #V Narsid Decisions#! for your [realm|E]"