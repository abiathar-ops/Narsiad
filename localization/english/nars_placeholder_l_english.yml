 decision_nikean_faith_choice:0 "Enact Panteiōn Rites"
 decision_nikean_faith_choice_desc:0 "Only by [faith|E] could we [nikeis|E] come to understand the roots of our old [culture|E]. My [legitimacy|E] is only a favor bestowed by the [panteion|E] and to neglect our [traditions|E] is to invite ruin on my [house|E]. Besides, while walking to a [temple|E] is tiring, arguing with my [council|E] is even worse!"
 decision_nikean_faith_choice_tooltip:0 "Change your designated educational discipline"
 decision_nikean_faith_choice_confirm:0 "Proceed!"
 
 faith_nikean_1_decision_name:0 "Dedicate a Libation"
 faith_nikean_1_decision_desc:0 "Enact [nikean|E] rites to dedicate yourself to your [culture|E]."
 change_to_faith_nikean_1_decision_desc:0 "You shift your focus to the Hoplîte discipline, prioritizing military academies, battlefield tactics, and martial prowess."

 faith_nikean_2_decision_name:0 "Sponsor a Panteiōn"
 faith_nikean_2_decision_desc:0 "Dedicate yourself to a Panteiōn of our [faith|E]."
 change_to_faith_nikean_2_decision_desc_1:0 "You decide which patron God of the [panteion|E] calls to you the most"
 change_to_faith_nikean_2_decision_desc_2:0 "You gain a [modifier|E] that reflects the values of your chosen patron God and a small amount of [piety|E]!"
 #decision_faith_nikean_2_decision_tooltip: "Think about [ROOT.Char.GetFaith.PantheonTerm]"
 # decision_faith_nikean_2_decision_desc:1 "#F It is not uncommon for [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] to single out one discipline amongst [ROOT.Char.GetFaith.PantheonTerm] who suits their particular tastes and aims in life for special attention.\n\nI should contemplate these divine beings and decide which one calls to me the most.#!"

 faith_nikean_1_decision_tooltip: "Settle in to pour a libation and reflect on your [faith|E]"
 faith_nikean_2_decision_tooltip: "Sponsor a [panteion|E] and embody values of your patron God"
