 nikean_faith.1041.t: "Evangelizing the [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 nikean_faith.1041.desc: "The Kingdom of Heaven belongs to the faithful, but our neighbor, [pagan.GetTitledFirstName], is blissfully unaware of it, and persists in believing in [pagan.GetHerHis] superstitions and false gods.\n\nSaving [pagan.GetHerHis] soul and those of [pagan.GetHerHis] people is a noble endeavor in itself, but there also #EMP earthly#! advantages to their conversion. For starters, reducing their hostility towards us and bringing them into our own sphere of influence.\n\nMy chosen missionary, [evangelizer.GetFirstName], is ready to go."
 nikean_faith.1041.a: "May [ROOT.Char.GetFaith.HighGodName] guide you!"
 nikean_faith.1041.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital."
 nikean_faith.1043.desc: "Emissaries from our neighbors come and go frequently enough that they all mix together in my mind. However, today's envoy from [GetTitleByKey('e_byzantium').GetName] sticks out like none before.\n\n[evangelizer.GetSheHe|U] seems to be some sort of holy [evangelizer.GetWomanMan], for starters, and instead of advancing political demands, this [evangelizer.GetFirstName] preaches of an omnipotent God, honored in temples of gold and silver that always smell of incense."
 nikean_faith.1043.a: "Please, tell me more."
 nikean_faith.1043.a.tt: "You create an [alliance|E] with [evangelizer.GetTitledFirstNamePossessiveNoTooltip] liege, [sender.GetTitledFirstName]"
 nikean_faith.1043.b: "We don't need new gods."
 nikean_faith.1043.c: "Ridiculous blasphemy!"
 nikean_faith.1043.c.tt: "This is sure to send a message: your preachers are not welcome here! But we should be ready for retaliation..."
 nikean_faith.1046.desc_new: "My predecessor [sender.GetFirstName] had invested into the evangelism of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] missionary [evangelizer.GetFirstName], in fact, has just returned."
 nikean_faith.1046.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring the knowledge of God to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back today, as I've been eagerly waiting for [evangelizer.GetHerHis] report."
 nikean_faith.1046.desc_success: "\n\n"I bring great news, my liege! [pagan.GetTitledFirstName|U] was eager to hear the Glad Tidings, and converted to [evangelizer.GetFaith.GetName], accompanied by many of [pagan.GetHerHis] people.""
 nikean_faith.1046.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of God, and sent me away empty-handed.""
 nikean_faith.1046.a: "Excellent!"
 nikean_faith.1046.b: "It's only a temporary setback."
 nikean_faith.1047.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my missionary [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of God!"
 nikean_faith.1047.a: "Outrageous!"
 valid_neighboring_and_across_water_top_liege: "Any neighboring top liege: $valid_for_conversion_tt$"
 valid_neighboring_and_across_water_realm_same_rank: "Any neighboring ruler of your same rank: $valid_for_conversion_tt$"
 valid_for_conversion_tt: "\n$EFFECT_LIST_BULLET$Has a non-[GetReligionFamily('rf_nikean').GetName] [faith|E]\n$EFFECT_LIST_BULLET$Is not at [war|E]\n$EFFECT_LIST_BULLET$Has not violently refused a conversion attempt before"
 negotiated_alliance_delay_tt: "The alliance will take effect as soon as [evangelizer.GetNameNoTooltip] returns to [evangelizer.GetHerHis] liege."
