 decision_nikean_faith_entry_desc:0 "This is a placeholder decision. It does nothing and should be replaced with an actual decision before release."
 decision_nikean_faith_entry_tooltip:0 "This is a placeholder decision. It does nothing and should be replaced with an actual decision before release."
